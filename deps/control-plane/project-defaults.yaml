# Platform-wide Project settings for this control plane: every Project's
# composition reads them, so apply this once, before the first Project (see
# ../../api/examples/project-defaults.yaml for every key).
apiVersion: apiextensions.crossplane.io/v1beta1
kind: EnvironmentConfig
metadata:
  name: project-defaults
data:
  grafana:
    ingress:
      className: haproxy
      # *.paas.cndev.nl points at the HAProxy LoadBalancer IP
      # (kubectl get svc -n haproxy-ingress); a new IP only needs that DNS
      # record changed. The wildcard covers one label: <x>-{project}.
      hostTemplate: grafana-{project}.paas.cndev.nl
  prometheus:
    # The locations' Prometheus send their samples here, through this
    # cluster's ingress (the same wildcard DNS name).
    remoteWrite:
      hostTemplate: prometheus-{project}.paas.cndev.nl
      scheme: http
      className: haproxy
    # These describe the locations (where kube-prometheus-stack runs there).
    clusterMetrics:
      namespace: prometheus-operator-system
      serviceMonitorLabels:
        release: prometheus-operator
  # A COSI backup bucket per Project (Cloudian HyperStore, installed by
  # ../cosi/install.sh): PostgresClusters with backups and no
  # destination of their own archive there. Each Project gets its own
  # BucketClass (deletionPolicy Retain) and keys per location; the IAM access
  # class still hands out S3 keys in COSI's BucketInfo Secret.
  backup:
    cosi:
      driverName: cloudian-cosi-driver
      bucketAccessClassName: cloudian-iam
