# Envoy Gateway helm values add-on for locations with self-hosted models
# (ModelServer, KServe; deps/README.md step 8): lets Agent Router route a
# model to a server's InferencePool, whose endpoint picker (llm-d) chooses
# the replica. Upstream's examples/inference-pool/envoy-gateway-values-addon.yaml
# of Agent Router v1.2.0, for use after envoy-gateway-values.yaml:
#
#   helm upgrade -i eg oci://docker.io/envoyproxy/gateway-helm --version v1.9.2 \
#     -n envoy-gateway-system -f envoy-gateway-values.yaml -f envoy-gateway-values-inferencepool.yaml
#
# The InferencePool CRD (KServe's chart brings it) must be there first.
config:
  envoyGateway:
    extensionManager:
      backendResources:
        - group: inference.networking.k8s.io
          kind: InferencePool
          version: v1
