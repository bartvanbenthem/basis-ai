[package]
name = "basis-tools"
version = "0.5.0"
edition.workspace = true
publish.workspace = true
description = "Development tools of the api directory: asset and OpenAPI generation, render test assertions, fixtures"

[dependencies]
function-basis = { path = "../function" }
serde = "1"
serde_json = "1"
serde_yaml = "0.9"
regex = "1"
sha2 = "0.10"
hex = "0.4"
flate2 = "1"
yaml-rust2 = { version = "0.10", default-features = false }
