# Crossplane v2 composes objects with its own ServiceAccount, so that
# ServiceAccount needs RBAC for exactly the kinds the compositions compose on
# the control plane -- nothing else. The aggregate-to-crossplane label merges
# these ClusterRoles into Crossplane's own ClusterRole
# (crossplane:aggregate-to-crossplane), no binding needed.
#
# The control plane runs no databases: CNPG and Prometheus Operator objects
# go to the locations as provider-kubernetes Objects (managed resources,
# which Crossplane grants itself), applied there with each location's
# kubeconfig. What PostgresClusters compose here is the GrafanaDashboard;
# ValkeyCaches compose their password Secret, ModelGateways their clients'
# keys (Crossplane's own ClusterRole already covers Secrets).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: crossplane:composed:basis
  labels:
    rbac.crossplane.io/aggregate-to-crossplane: "true"
rules:
  - apiGroups: [grafana.integreatly.org]
    resources: [grafanadashboards]
    verbs: [get, list, watch, create, update, patch, delete]
  # GenAIStacks compose these APIs next to them (child XRs).
  - apiGroups: [postgres.cndev.nl]
    resources: [postgresclusters]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [cache.cndev.nl]
    resources: [valkeycaches]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [ai.cndev.nl]
    resources: [modelgateways]
    verbs: [get, list, watch, create, update, patch, delete]
  # ModelGateways read the ModelServers their self-hosted models name.
  - apiGroups: [ai.cndev.nl]
    resources: [modelservers]
    verbs: [get, list, watch]
---
# What the Project composition (apis/project) composes on the control plane.
# Creating RoleBindings is limited by Kubernetes' escalation check, so
# instead of holding every permission of the roles it hands out, Crossplane
# gets "bind" on exactly those three ClusterRoles.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: crossplane:composed:basis-projects
  labels:
    rbac.crossplane.io/aggregate-to-crossplane: "true"
rules:
  - apiGroups: [""]
    resources: [namespaces, serviceaccounts, persistentvolumeclaims]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [rolebindings]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [clusterroles]
    resourceNames: [admin, edit, view]
    verbs: [bind]
  - apiGroups: [monitoring.coreos.com]
    resources: [prometheuses]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [grafana.integreatly.org]
    resources: [grafanas, grafanadatasources]
    verbs: [get, list, watch, create, update, patch, delete]
  # The remote-write endpoint the project's locations send their metrics to.
  - apiGroups: [networking.k8s.io]
    resources: [ingresses]
    verbs: [get, list, watch, create, update, patch, delete]
  # The project's backup bucket (COSI): its own BucketClass (Retain), and in
  # the project namespace one BucketClaim and a BucketAccess per location.
  # COSI writes each access's credentials Secret; the composition reads it and
  # composes a Secret with the keys unpacked (Crossplane's own ClusterRole
  # already covers Secrets).
  - apiGroups: [objectstorage.k8s.io]
    resources: [bucketclasses, bucketclaims, bucketaccesses]
    verbs: [get, list, watch, create, update, patch, delete]
  # One per location of the project: keeps its Location from being deleted.
  - apiGroups: [protection.crossplane.io]
    resources: [clusterusages]
    verbs: [get, list, watch, create, update, patch, delete]
---
# What the Location composition (apis/location) composes on the control
# plane: the location's provider-kubernetes ClusterProviderConfig. Its
# Objects are managed resources, which Crossplane grants itself.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: crossplane:composed:basis-locations
  labels:
    rbac.crossplane.io/aggregate-to-crossplane: "true"
rules:
  - apiGroups: [kubernetes.m.crossplane.io]
    resources: [clusterproviderconfigs]
    verbs: [get, list, watch, create, update, patch, delete]
---
# Lets namespace users manage PostgresClusters through the built-in
# admin/edit/view roles (e.g. a team's RoleBinding to "edit" in the project
# namespace on the control plane).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: basis:postgresclusters:edit
  labels:
    rbac.authorization.k8s.io/aggregate-to-admin: "true"
    rbac.authorization.k8s.io/aggregate-to-edit: "true"
rules:
  - apiGroups: [postgres.cndev.nl]
    resources: [postgresclusters]
    verbs: [get, list, watch, create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: basis:postgresclusters:view
  labels:
    rbac.authorization.k8s.io/aggregate-to-view: "true"
rules:
  - apiGroups: [postgres.cndev.nl]
    resources: [postgresclusters]
    verbs: [get, list, watch]
---
# The same for ValkeyCaches.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: basis:valkeycaches:edit
  labels:
    rbac.authorization.k8s.io/aggregate-to-admin: "true"
    rbac.authorization.k8s.io/aggregate-to-edit: "true"
rules:
  - apiGroups: [cache.cndev.nl]
    resources: [valkeycaches]
    verbs: [get, list, watch, create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: basis:valkeycaches:view
  labels:
    rbac.authorization.k8s.io/aggregate-to-view: "true"
rules:
  - apiGroups: [cache.cndev.nl]
    resources: [valkeycaches]
    verbs: [get, list, watch]
---
# The same for GenAIStacks, ModelGateways and ModelServers.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: basis:genaistacks:edit
  labels:
    rbac.authorization.k8s.io/aggregate-to-admin: "true"
    rbac.authorization.k8s.io/aggregate-to-edit: "true"
rules:
  - apiGroups: [ai.cndev.nl]
    resources: [genaistacks, modelgateways, modelservers]
    verbs: [get, list, watch, create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: basis:genaistacks:view
  labels:
    rbac.authorization.k8s.io/aggregate-to-view: "true"
rules:
  - apiGroups: [ai.cndev.nl]
    resources: [genaistacks, modelgateways, modelservers]
    verbs: [get, list, watch]
---
# Projects are cluster-scoped, so the namespace roles don't apply: reading
# them is harmless, creating one (a namespace + Prometheus + Grafana) is a
# platform decision. Bind this to whoever may create projects.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: basis:projects:view
  labels:
    rbac.authorization.k8s.io/aggregate-to-view: "true"
rules:
  - apiGroups: [platform.cndev.nl]
    resources: [projects]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: basis:projects:admin
rules:
  - apiGroups: [platform.cndev.nl]
    resources: [projects]
    verbs: [get, list, watch, create, update, patch, delete]
---
# Locations (Kubernetes clusters the platform can place databases in) are
# cluster-scoped too, and reference kubeconfig Secrets: reading them is fine
# for anyone, registering one is a platform-admin job.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: basis:locations:view
  labels:
    rbac.authorization.k8s.io/aggregate-to-view: "true"
rules:
  - apiGroups: [platform.cndev.nl]
    resources: [locations]
    verbs: [get, list, watch]
