# project-defaults with a COSI driver and access class, both Locations, and what COSI wrote for each
# BucketAccess (fake keys).
apiVersion: apiextensions.crossplane.io/v1beta1
kind: EnvironmentConfig
metadata:
  name: project-defaults
data:
  backup:
    cosi:
      driverName: cloudian-cosi-driver
      parameters:
        storagePolicy: replicated-3
      bucketAccessClassName: backups-keys
---
apiVersion: platform.cndev.nl/v1alpha1
kind: Location
metadata:
  name: si-ske-demo
spec:
  credentials:
    secretRef:
      namespace: basis-locations
      name: si-ske-demo
---
apiVersion: platform.cndev.nl/v1alpha1
kind: Location
metadata:
  name: onprem-ams
spec:
  credentials:
    secretRef:
      namespace: basis-locations
      name: onprem-ams
---
apiVersion: v1
kind: Secret
metadata:
  name: cosi-backups-si-ske-demo
  namespace: team-orders
data:
  BucketInfo: 
---
apiVersion: v1
kind: Secret
metadata:
  name: cosi-backups-onprem-ams
  namespace: team-orders
data:
  BucketInfo: 
---
# The PostgresClusters' backup stores (Objects labelled
# postgres.cndev.nl/backup-store): orders-db and its replica cluster archive to
# the project's bucket, ledger-db to an object store of its own.
apiVersion: kubernetes.m.crossplane.io/v1alpha1
kind: Object
metadata:
  name: orders-db-objectstore
  namespace: team-orders
  labels:
    postgres.cndev.nl/backup-store: "true"
    postgres.cndev.nl/postgrescluster: orders-db
  annotations:
    platform.cndev.nl/location: si-ske-demo
status:
  atProvider:
    manifest:
      apiVersion: barmancloud.cnpg.io/v1
      kind: ObjectStore
      metadata:
        name: orders-db-backup
        namespace: team-orders
        annotations:
          postgres.cndev.nl/server-name: orders-db
          postgres.cndev.nl/postgres-version: "17"
          postgres.cndev.nl/database: orders
          postgres.cndev.nl/database-owner: orders
      spec:
        configuration:
          destinationPath: s3://team-orders-backups-0f3a/barman
      status:
        serverRecoveryWindow:
          orders-db:
            firstRecoverabilityPoint: "2026-10-02T02:00:00Z"
            lastSuccessfulBackupTime: "2026-10-08T02:00:00Z"
---
apiVersion: kubernetes.m.crossplane.io/v1alpha1
kind: Object
metadata:
  name: orders-db-recovery-objectstore
  namespace: team-orders
  labels:
    postgres.cndev.nl/backup-store: "true"
    postgres.cndev.nl/postgrescluster: orders-db
  annotations:
    platform.cndev.nl/location: onprem-ams
status:
  atProvider:
    manifest:
      apiVersion: barmancloud.cnpg.io/v1
      kind: ObjectStore
      metadata:
        name: orders-db-backup
        namespace: team-orders
        annotations:
          postgres.cndev.nl/server-name: orders-db-onprem-ams
          postgres.cndev.nl/postgres-version: "17"
          postgres.cndev.nl/database: orders
          postgres.cndev.nl/database-owner: orders
      spec:
        configuration:
          destinationPath: s3://team-orders-backups-0f3a/barman
---
apiVersion: kubernetes.m.crossplane.io/v1alpha1
kind: Object
metadata:
  name: ledger-db-objectstore
  namespace: team-orders
  labels:
    postgres.cndev.nl/backup-store: "true"
    postgres.cndev.nl/postgrescluster: ledger-db
  annotations:
    platform.cndev.nl/location: si-ske-demo
status:
  atProvider:
    manifest:
      apiVersion: barmancloud.cnpg.io/v1
      kind: ObjectStore
      metadata:
        name: ledger-db-backup
        namespace: team-orders
        annotations:
          postgres.cndev.nl/server-name: ledger-db
      spec:
        configuration:
          destinationPath: s3://elsewhere/postgres
