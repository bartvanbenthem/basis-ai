apiVersion: kubernetes.m.crossplane.io/v1alpha1
kind: Object
metadata:
  annotations:
    crossplane.io/composition-resource-name: location-onprem-ams-backup-check
  name: location-onprem-ams-backup-check
  namespace: team-orders
status:
  atProvider:
    manifest:
      apiVersion: batch/v1
      kind: CronJob
      metadata:
        labels:
          app.kubernetes.io/managed-by: crossplane
          app.kubernetes.io/part-of: basis
          platform.cndev.nl/project: team-orders
        name: backup-check
        namespace: team-orders
      spec:
        concurrencyPolicy: Forbid
        failedJobsHistoryLimit: 1
        jobTemplate:
          spec:
            activeDeadlineSeconds: 120
            backoffLimit: 0
            template:
              metadata:
                labels:
                  app.kubernetes.io/managed-by: crossplane
                  app.kubernetes.io/part-of: basis
                  platform.cndev.nl/check: backup
                  platform.cndev.nl/project: team-orders
              spec:
                automountServiceAccountToken: false
                containers:
                - args:
                  - "set -u\nkey=\"platform-check/${LOCATION}\"\nurl=\"${S3_ENDPOINT%/}/${S3_BUCKET}/${key}\"\
                    \ns3() {\n  method=$1; shift\n  code=$(curl -sS -o /tmp/body -w\
                    \ '%{http_code}' --connect-timeout 10 --max-time 30 \\\n    --aws-sigv4\
                    \ \"aws:amz:${REGION:-us-east-1}:s3\" --user \"${ACCESS_KEY_ID}:${ACCESS_SECRET_KEY}\"\
                    \ \\\n    -H 'x-amz-content-sha256: UNSIGNED-PAYLOAD' -X \"$method\"\
                    \ \"$@\" \"$url\" 2>/tmp/err) \\\n    || { echo \"$method $url:\
                    \ $(cat /tmp/err)\"; return 1; }\n  case $code in 2??) return\
                    \ 0 ;; esac\n  echo \"$method $url: HTTP $code $(sed -n 's:.*<Code>\\\
                    (.*\\)</Code>.*:\\1:p' /tmp/body)\"\n  return 1\n}\nstamp=$(date\
                    \ -u +%Y-%m-%dT%H:%M:%SZ)\ns3 PUT --data-binary \"$stamp\" ||\
                    \ exit 1\ns3 GET || exit 1\n[ \"$(cat /tmp/body)\" = \"$stamp\"\
                    \ ] || { echo \"GET $url: read back something else than was written\"\
                    ; exit 1; }\ns3 DELETE || echo \"warning: could not delete the\
                    \ test object\"\necho \"ok: wrote, read back and deleted s3://${S3_BUCKET}/${key}\
                    \ via ${S3_ENDPOINT}\"\n"
                  command:
                  - sh
                  - -c
                  env:
                  - name: LOCATION
                    value: onprem-ams
                  - name: S3_ENDPOINT
                    value: https://s3.example.com
                  - name: S3_BUCKET
                    value: team-orders-backups-0f3a
                  - name: ACCESS_KEY_ID
                    valueFrom:
                      secretKeyRef:
                        key: ACCESS_KEY_ID
                        name: backup-check-s3
                  - name: ACCESS_SECRET_KEY
                    valueFrom:
                      secretKeyRef:
                        key: ACCESS_SECRET_KEY
                        name: backup-check-s3
                  - name: REGION
                    valueFrom:
                      secretKeyRef:
                        key: REGION
                        name: backup-check-s3
                        optional: true
                  image: curlimages/curl:8.16.0
                  name: check
                  resources:
                    limits:
                      memory: 64Mi
                    requests:
                      cpu: 10m
                      memory: 16Mi
                  securityContext:
                    allowPrivilegeEscalation: false
                    capabilities:
                      drop:
                      - ALL
                    readOnlyRootFilesystem: true
                  volumeMounts:
                  - mountPath: /tmp
                    name: tmp
                restartPolicy: Never
                securityContext:
                  runAsNonRoot: true
                  seccompProfile:
                    type: RuntimeDefault
                volumes:
                - emptyDir:
                    sizeLimit: 1Mi
                  name: tmp
        schedule: '*/5 * * * *'
        successfulJobsHistoryLimit: 1
      status:
        lastScheduleTime: '2026-01-01T00:05:00Z'
        lastSuccessfulTime: '2026-01-01T00:05:04Z'
  conditions:
  - type: Ready
    status: 'True'
    reason: Available
  - type: Synced
    status: 'True'
    reason: ReconcileSuccess
---
