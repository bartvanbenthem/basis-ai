# Both sites: databases run in si-ske-demo, replica clusters in onprem-ams.
apiVersion: platform.cndev.nl/v1alpha1
kind: Project
metadata:
  name: team-payments
spec:
  owner: team-payments
  description: Payment services
  locations:
    protected: si-ske-demo
    recovery: onprem-ams
  access:
    - group: payments-devs
      role: edit
    - group: auditors
      role: view
  quota:
    cpu: "8"
    memory: 32Gi
    storage: 200Gi
  observability:
    prometheus:
      retention: 30d
      storage:
        size: 50Gi
        storageClass: fast
