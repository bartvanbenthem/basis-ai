# bucket, with a name too long for project-<name>-backups<claim UID> to fit S3's
# 63 characters: the class becomes prj-<first 16 of name>-<hash>.
#
# Both sites and a COSI backup bucket (driver from project-defaults): the
# project's own BucketClass (Retain), and in its namespace one BucketClaim, a
# BucketAccess per location and their keys unpacked into Secrets
# PostgresClusters copy to the locations.
apiVersion: platform.cndev.nl/v1alpha1
kind: Project
metadata:
  name: team-orders-and-invoices
spec:
  owner: team-orders-and-invoices
  locations:
    protected: si-ske-demo
    recovery: onprem-ams
# The inventory as the last reconcile left it: old-db is gone since (its
# folder stays, inactive), orders-db's window gets updated.
status:
  backup:
    servers:
      - serverName: old-db
        cluster: old-db
        location: si-ske-demo
        active: true
        postgresVersion: 16
        database: app
        owner: app
        firstRecoverabilityPoint: "2026-09-01T02:00:00Z"
        lastSuccessfulBackup: "2026-09-30T02:00:00Z"
      - serverName: orders-db
        cluster: orders-db
        location: si-ske-demo
        active: true
        firstRecoverabilityPoint: "2026-10-01T02:00:00Z"
