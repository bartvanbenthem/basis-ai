# xr/bucket.yaml while COSI grants the first BucketAccess: the next one waits
# for it (concurrent grants race on the Bucket and can fail for good).
apiVersion: platform.cndev.nl/v1alpha1
kind: Project
metadata:
  name: team-orders
spec:
  owner: team-orders
  locations:
    protected: si-ske-demo
    recovery: onprem-ams
# The inventory as the last reconcile left it: old-db is gone since (its
# folder stays, inactive), orders-db's window gets updated.
status:
  backup:
    servers:
      - serverName: old-db
        cluster: old-db
        location: si-ske-demo
        active: true
        postgresVersion: 16
        database: app
        owner: app
        firstRecoverabilityPoint: "2026-09-01T02:00:00Z"
        lastSuccessfulBackup: "2026-09-30T02:00:00Z"
      - serverName: orders-db
        cluster: orders-db
        location: si-ske-demo
        active: true
        firstRecoverabilityPoint: "2026-10-01T02:00:00Z"
