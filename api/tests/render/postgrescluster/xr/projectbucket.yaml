# Geo-replicated, backups in the Project's COSI bucket: no destinationPath or
# s3Credentials of its own. Each site gets its own credentials, copied from
# the Project's Secret for its location.
apiVersion: cnpg.cndev.nl/v1alpha1
kind: PostgresCluster
metadata:
  name: secrets-db
  namespace: vault
spec:
  instances: 2
  geoReplication:
    enabled: true
  backup:
    enabled: true
    retentionPolicy: 14d
