# The Secrets it references (S3 credentials, a role's password) are copied
# from the control plane to the protected location by reference.
apiVersion: cnpg.cndev.nl/v1alpha1
kind: PostgresCluster
metadata:
  name: ledger-db
  namespace: payments
spec:
  instances: 2
  roles:
    - name: reporting
      passwordSecret: ledger-db-reporting
  pooler:
    enabled: true
  backup:
    enabled: true
    destinationPath: s3://pg-backups/payments
    s3Credentials:
      secretName: ledger-db-s3
