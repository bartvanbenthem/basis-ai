# A running cluster whose size was retired from the catalog: it keeps what
# status.sizing says it runs with, and that's no problem.
apiVersion: postgres.cndev.nl/v1alpha1
kind: PostgresCluster
metadata:
  name: orders-db
  namespace: demo
spec:
  size: retired
  storage:
    size: 50Gi
status:
  sites:
    protected: si-ske-demo
  sizing:
    size: retired
    resources:
      requests: {cpu: "3", memory: 12Gi}
      limits: {memory: 12Gi}
    parameters:
      shared_buffers: 3GB
