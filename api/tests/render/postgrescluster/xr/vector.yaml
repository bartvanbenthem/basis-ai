# The vector profile (PostgreSQL 18): 2 CPUs and 8Gi tuned for vector, and
# the image extensions VectorChord and pg_search from the postgres-extensions
# catalog, mounted as image volumes and preloaded. Both require pgvector,
# which the Database gets first although the spec leaves it out.
apiVersion: postgres.cndev.nl/v1alpha1
kind: PostgresCluster
metadata:
  name: rag-db
  namespace: demo
spec:
  profile: vector
  postgresVersion: 18
  resources:
    cpu: "2"
    memory: 8Gi
  database:
    name: docs
    owner: docs
    extensions: [vchord, pg_search]
