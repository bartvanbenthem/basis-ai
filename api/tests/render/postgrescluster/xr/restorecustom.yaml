# Restored from an object store of its own (the latest state), without
# backups of its own: no WAL archiving, only the read-only restore store.
apiVersion: cnpg.cndev.nl/v1alpha1
kind: PostgresCluster
metadata:
  name: ledger-copy
  namespace: payments
  uid: 9c0ffee1-0000-4000-8000-000000000001
spec:
  instances: 1
  monitoring:
    grafanaDashboard:
      enabled: false
  restore:
    source:
      serverName: ledger-db
      destinationPath: s3://payments-backups/postgres
      endpointURL: https://minio.example.com
      s3Credentials:
        secretName: ledger-db-s3
