# A size from the postgres-sizes catalog (apis/postgrescluster/sizes.yaml):
# its resources and tuned settings, with spec.postgresql.parameters on top.
apiVersion: cnpg.cndev.nl/v1alpha1
kind: PostgresCluster
metadata:
  name: orders-db
  namespace: demo
spec:
  size: m
  storage:
    size: 50Gi
  postgresql:
    parameters:
      max_connections: "500"
