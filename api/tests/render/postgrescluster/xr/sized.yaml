# Resources of its own: PostgreSQL's settings tuned to them, with
# spec.postgresql.parameters on top.
apiVersion: postgres.cndev.nl/v1alpha1
kind: PostgresCluster
metadata:
  name: orders-db
  namespace: demo
spec:
  resources:
    cpu: "2"
    memory: 8Gi
  storage:
    size: 50Gi
  postgresql:
    parameters:
      max_connections: "500"
