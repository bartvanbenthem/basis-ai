# A running cluster moved to a size the catalog doesn't have (the admission
# policy would refuse it): the change isn't applied, the instances keep what
# status.sizing says, and the status says why.
apiVersion: postgres.cndev.nl/v1alpha1
kind: PostgresCluster
metadata:
  name: orders-db
  namespace: demo
spec:
  size: huge
  storage:
    size: 50Gi
status:
  sites:
    protected: si-ske-demo
  sizing:
    size: m
    resources:
      requests: {cpu: "2", memory: 8Gi}
      limits: {memory: 8Gi}
    parameters:
      shared_buffers: 2GB
