# status.sites wins over the Project: a cluster never moves, even if the
# Project's locations were changed behind its back (or the Project is gone).
apiVersion: cnpg.cndev.nl/v1alpha1
kind: PostgresCluster
metadata:
  name: orders-db
  namespace: demo
spec:
  storage:
    size: 10Gi
status:
  sites:
    protected: onprem-rtm
