apiVersion: kubernetes.m.crossplane.io/v1alpha1
kind: Object
metadata:
  annotations:
    crossplane.io/composition-resource-name: recovery-prometheusrule
  name: secrets-db-r-recovery-prometheusrule
  namespace: vault
status:
  atProvider:
    manifest:
      apiVersion: monitoring.coreos.com/v1
      kind: PrometheusRule
      metadata:
        labels:
          app.kubernetes.io/managed-by: crossplane
          app.kubernetes.io/part-of: basis
          postgres.cndev.nl/postgrescluster: secrets-db-r
        name: secrets-db-r-alerts
        namespace: vault
      spec:
        groups:
        - name: cloudnative-pg/vault/secrets-db-r
          rules:
          - alert: CNPGClusterHACritical
            annotations:
              description: 'CloudNativePG Cluster "{{ $labels.job }}" has no ready
                standby replicas. Your cluster at a severe

                risk of data loss and downtime if the primary instance fails.


                The primary instance is still online and able to serve queries, although
                connections to the `-ro` endpoint

                will fail. The `-r` endpoint os operating at reduced capacity and
                all traffic is being served by the main.


                This can happen during a normal fail-over or automated minor version
                upgrades in a cluster with 2 or less

                instances. The replaced instance may need some time to catch-up with
                the cluster primary instance.


                This alarm will be always trigger if your cluster is configured to
                run with only 1 instance. In this

                case you may want to silence it.'
              runbook_url: https://github.com/cloudnative-pg/charts/blob/main/charts/cluster/docs/runbooks/CNPGClusterHACritical.md
              summary: CNPG Cluster has no standby replicas!
            expr: "max by (job) (cnpg_pg_replication_streaming_replicas{namespace=\"\
              vault\"} - cnpg_pg_replication_is_wal_receiver_up{namespace=\"vault\"\
              }) < 1\n  and on (job)\n(max by (job) (cnpg_collector_replica_mode{namespace=\"\
              vault\"}) == 0)\n"
            for: 5m
            labels:
              cnpg_cluster: secrets-db-r
              namespace: vault
              severity: critical
          - alert: CNPGClusterHAWarning
            annotations:
              description: 'CloudNativePG Cluster "{{ $labels.job }}" has only {{
                $value }} standby replicas, putting

                your cluster at risk if another instance fails. The cluster is still
                able to operate normally, although

                the `-ro` and `-r` endpoints operate at reduced capacity.


                This can happen during a normal fail-over or automated minor version
                upgrades. The replaced instance may

                need some time to catch-up with the cluster primary instance.


                This alarm will be constantly triggered if your cluster is configured
                to run with less than 3 instances.

                In this case you may want to silence it.'
              runbook_url: https://github.com/cloudnative-pg/charts/blob/main/charts/cluster/docs/runbooks/CNPGClusterHAWarning.md
              summary: CNPG Cluster less than 2 standby replicas.
            expr: "max by (job) (cnpg_pg_replication_streaming_replicas{namespace=\"\
              vault\"} - cnpg_pg_replication_is_wal_receiver_up{namespace=\"vault\"\
              }) < 2\n  and on (job)\n(max by (job) (cnpg_collector_replica_mode{namespace=\"\
              vault\"}) == 0)\n"
            for: 5m
            labels:
              cnpg_cluster: secrets-db-r
              namespace: vault
              severity: warning
          - alert: CNPGClusterHighConnectionsCritical
            annotations:
              description: 'CloudNativePG Cluster "vault/secrets-db-r" instance {{
                $labels.pod }} is using {{ $value }}% of

                the maximum number of connections.'
              runbook_url: https://github.com/cloudnative-pg/charts/blob/main/charts/cluster/docs/runbooks/CNPGClusterHighConnectionsCritical.md
              summary: CNPG Instance maximum number of connections critical!
            expr: 'sum by (pod) (cnpg_backends_total{namespace="vault", pod=~"secrets-db-r-([1-9][0-9]*)$"})
              / max by (pod) (cnpg_pg_settings_setting{name="max_connections", namespace="vault",
              pod=~"secrets-db-r-([1-9][0-9]*)$"}) * 100 > 95

              '
            for: 5m
            labels:
              cnpg_cluster: secrets-db-r
              namespace: vault
              severity: critical
          - alert: CNPGClusterHighConnectionsWarning
            annotations:
              description: 'CloudNativePG Cluster "vault/secrets-db-r" instance {{
                $labels.pod }} is using {{ $value }}% of

                the maximum number of connections.'
              runbook_url: https://github.com/cloudnative-pg/charts/blob/main/charts/cluster/docs/runbooks/CNPGClusterHighConnectionsWarning.md
              summary: CNPG Instance is approaching the maximum number of connections.
            expr: 'sum by (pod) (cnpg_backends_total{namespace="vault", pod=~"secrets-db-r-([1-9][0-9]*)$"})
              / max by (pod) (cnpg_pg_settings_setting{name="max_connections", namespace="vault",
              pod=~"secrets-db-r-([1-9][0-9]*)$"}) * 100 > 80

              '
            for: 5m
            labels:
              cnpg_cluster: secrets-db-r
              namespace: vault
              severity: warning
          - alert: CNPGClusterHighReplicationLag
            annotations:
              description: 'CloudNativePG Cluster "vault/secrets-db-r" is experiencing
                a high replication lag of

                {{ $value }}s.


                High replication lag indicates network issues, busy instances, slow
                queries or suboptimal configuration.'
              runbook_url: https://github.com/cloudnative-pg/charts/blob/main/charts/cluster/docs/runbooks/CNPGClusterHighReplicationLag.md
              summary: CNPG Cluster high replication lag
            expr: 'max(cnpg_pg_replication_lag{namespace="vault",pod=~"secrets-db-r-([1-9][0-9]*)$"})
              > 1

              '
            for: 5m
            labels:
              cnpg_cluster: secrets-db-r
              namespace: vault
              severity: warning
          - alert: CNPGInstanceMetricsAbsent
            annotations:
              description: 'CloudNativePG instance "vault/{{ $labels.pod }}" has had
                an unreachable metrics endpoint for 10 minutes, so its metrics exporter
                is hung.


                The lag, HA and replication alerts all read from this exporter and
                will not fire while it is down. A hung exporter has previously coincided
                with a frozen standby, so physical replication may be stuck and unmonitored.
                Check the instance directly.'
              runbook_url: https://github.com/cloudnative-pg/charts/blob/main/charts/cluster/docs/runbooks/CNPGInstanceMetricsAbsent.md
              summary: CNPG instance metrics exporter is hung
            expr: 'up{namespace="vault",pod=~"secrets-db-r-([1-9][0-9]*)$"} == 0

              '
            for: 10m
            labels:
              cnpg_cluster: secrets-db-r
              namespace: vault
              severity: critical
          - alert: CNPGClusterInstancesOnSameNode
            annotations:
              description: 'CloudNativePG Cluster "vault/secrets-db-r" has {{ $value
                }}

                instances on the same node {{ $labels.node }}.


                A failure or scheduled downtime of a single node will lead to a potential
                service disruption and/or data loss.'
              runbook_url: https://github.com/cloudnative-pg/charts/blob/main/charts/cluster/docs/runbooks/CNPGClusterInstancesOnSameNode.md
              summary: CNPG Cluster instances are located on the same node.
            expr: 'count by (node) (kube_pod_info{namespace="vault", pod=~"secrets-db-r-([1-9][0-9]*)$"})
              > 1

              '
            for: 5m
            labels:
              cnpg_cluster: secrets-db-r
              namespace: vault
              severity: warning
          - alert: CNPGClusterLogicalReplicationErrorsCritical
            annotations:
              description: 'CloudNativePG Cluster''s "vault/secrets-db-r" "{{ .subname
                }}" subscription has experienced {{ $value }} errors in the last 5
                minutes.


                CRITICAL: High error rate indicates persistent replication issues
                requiring immediate attention. This could lead to significant data
                inconsistency or complete replication failure. Errors include both
                apply errors and sync errors. The subscription may stop working if
                errors continue.'
              runbook_url: https://github.com/cloudnative-pg/charts/blob/main/charts/cluster/docs/runbooks/CNPGClusterLogicalReplicationErrors.md
              summary: CNPG Cluster critical logical replication errors
            expr: 'label_replace(max by (namespace, job, subname) (increase(cnpg_pg_stat_subscription_apply_error_count[5m])
              + increase(cnpg_pg_stat_subscription_sync_error_count[5m])), "cluster",
              "$1", "job", ".+/(.+)") >= 5

              '
            for: 0m
            labels:
              cnpg_cluster: secrets-db-r
              namespace: vault
              severity: critical
          - alert: CNPGClusterLogicalReplicationErrors
            annotations:
              description: 'CloudNativePG Cluster''s "vault/secrets-db-r" "{{ .subname
                }}" subscription has experienced {{ $value }} errors.


                This includes both apply errors (during normal replication) and sync
                errors (during initial table sync). Errors indicate data consistency
                issues that need immediate attention to prevent data divergence.'
              runbook_url: https://github.com/cloudnative-pg/charts/blob/main/charts/cluster/docs/runbooks/CNPGClusterLogicalReplicationErrors.md
              summary: CNPG Cluster logical replication errors detected
            expr: 'label_replace(max by (namespace, job, subname) (increase(cnpg_pg_stat_subscription_apply_error_count[5m])
              + increase(cnpg_pg_stat_subscription_sync_error_count[5m])), "cluster",
              "$1", "job", ".+/(.+)") > 0

              '
            for: 1m
            labels:
              cnpg_cluster: secrets-db-r
              namespace: vault
              severity: warning
          - alert: CNPGClusterLogicalReplicationLaggingCritical
            annotations:
              description: 'CloudNativePG Cluster''s "vault/secrets-db-r" "{{ .subname
                }}" subscription is experiencing critical replication lag!

                Current lag: {{ $value }}s


                CRITICAL: The subscriber is significantly behind the publisher. Immediate
                action required. This could lead to significant data inconsistency,
                disk space exhaustion on publisher, or extended recovery time.'
              runbook_url: https://github.com/cloudnative-pg/charts/blob/main/charts/cluster/docs/runbooks/CNPGClusterLogicalReplicationLagging.md
              summary: CNPG Cluster critical logical replication lag
            expr: "(\n  # Receipt lag - not receiving WAL data\n  label_replace(max\
              \ by (namespace, job, subname) (cnpg_pg_stat_subscription_receipt_lag_seconds),\
              \ \"cluster\", \"$1\", \"job\", \".+/(.+)\") > 300\n) or (\n  # Apply\
              \ lag - not applying received data\n  label_replace(max by (namespace,\
              \ job, subname) (cnpg_pg_stat_subscription_apply_lag_seconds), \"cluster\"\
              , \"$1\", \"job\", \".+/(.+)\") > 300\n) or (\n  # LSN distance - large\
              \ amount of pending data\n  label_replace(max by (namespace, job, subname)\
              \ (cnpg_pg_stat_subscription_buffered_lag_bytes), \"cluster\", \"$1\"\
              , \"job\", \".+/(.+)\") / 1024^3 > 4\n)\n"
            for: 2m
            labels:
              cnpg_cluster: secrets-db-r
              namespace: vault
              severity: critical
          - alert: CNPGClusterLogicalReplicationLagging
            annotations:
              description: 'CloudNativePG Cluster''s "vault/secrets-db-r" "{{ .subname
                }}" subscription is experiencing replication lag.

                Current lag: {{ $value }}s


                This alert indicates the subscriber is falling behind the publisher.
                The lag could be receipt lag (not receiving WAL data fast enough due
                to network issues), apply lag (receiving data but not applying it
                fast enough due to resource contention), or LSN distance (large amount
                of pending data to be applied).'
              runbook_url: https://github.com/cloudnative-pg/charts/blob/main/charts/cluster/docs/runbooks/CNPGClusterLogicalReplicationLagging.md
              summary: CNPG Cluster logical replication lagging
            expr: "(\n  # Receipt lag - time since last message received\n  label_replace(max\
              \ by (namespace, job, subname) (cnpg_pg_stat_subscription_receipt_lag_seconds),\
              \ \"cluster\", \"$1\", \"job\", \".+/(.+)\") > 60\n) or (\n  # Apply\
              \ lag - time delay in applying changes\n  label_replace(max by (namespace,\
              \ job, subname) (cnpg_pg_stat_subscription_apply_lag_seconds), \"cluster\"\
              , \"$1\", \"job\", \".+/(.+)\") > 60\n) or (\n  # LSN distance - bytes\
              \ pending to be applied\n  label_replace(max by (namespace, job, subname)\
              \ (cnpg_pg_stat_subscription_buffered_lag_bytes), \"cluster\", \"$1\"\
              , \"job\", \".+/(.+)\") / 1024^3 > 1\n)\n"
            for: 5m
            labels:
              cnpg_cluster: secrets-db-r
              namespace: vault
              severity: warning
          - alert: CNPGClusterLogicalReplicationStoppedCritical
            annotations:
              description: "CloudNativePG Cluster's \"vault/secrets-db-r\" \"{{ .subname\
                \ }}\" subscription is in a critical state.\n\nCRITICAL: The subscription\
                \ has been stopped for more than 15 minutes. This will lead to significant\
                \ data divergence and requires immediate intervention.\n\nStatus:\
                \ \nDuration: {{ $value }}s"
              runbook_url: https://github.com/cloudnative-pg/charts/blob/main/charts/cluster/docs/runbooks/CNPGClusterLogicalReplicationStopped.md
              summary: CNPG Cluster logical replication subscription CRITICAL
            expr: "(\n  # Subscription is explicitly disabled\n  label_replace(max\
              \ by (namespace, job, subname) (cnpg_pg_stat_subscription_enabled),\
              \ \"cluster\", \"$1\", \"job\", \".+/(.+)\") == 0\n) or (\n  # Subscription\
              \ is enabled but stuck (no worker process with significant lag)\n  label_replace(max\
              \ by (namespace, job, subname) (cnpg_pg_stat_subscription_enabled),\
              \ \"cluster\", \"$1\", \"job\", \".+/(.+)\") == 1\n  and label_replace(max\
              \ by (namespace, job, subname) (cnpg_pg_stat_subscription_pid), \"cluster\"\
              , \"$1\", \"job\", \".+/(.+)\") == 0\n  and label_replace(max by (namespace,\
              \ job, subname) (cnpg_pg_stat_subscription_buffered_lag_bytes), \"cluster\"\
              , \"$1\", \"job\", \".+/(.+)\") / 1024^3 > 0.1\n)\n"
            for: 15m
            labels:
              cnpg_cluster: secrets-db-r
              namespace: vault
              severity: critical
          - alert: CNPGClusterLogicalReplicationStopped
            annotations:
              description: "CloudNativePG Cluster's \"vault/secrets-db-r\" \"{{ .subname\
                \ }}\" subscription is stopped.\n\nStatus: \n\nThe subscription is\
                \ not actively replicating data. This could be intentional (disabled)\
                \ or due to an issue preventing the subscription from working."
              runbook_url: https://github.com/cloudnative-pg/charts/blob/main/charts/cluster/docs/runbooks/CNPGClusterLogicalReplicationStopped.md
              summary: CNPG Cluster logical replication subscription stopped
            expr: "(\n  # Subscription is explicitly disabled\n  label_replace(max\
              \ by (namespace, job, subname) (cnpg_pg_stat_subscription_enabled),\
              \ \"cluster\", \"$1\", \"job\", \".+/(.+)\") == 0\n) or (\n  # Subscription\
              \ is enabled but stuck (no worker process with significant lag)\n  label_replace(max\
              \ by (namespace, job, subname) (cnpg_pg_stat_subscription_enabled),\
              \ \"cluster\", \"$1\", \"job\", \".+/(.+)\") == 1\n  and label_replace(max\
              \ by (namespace, job, subname) (cnpg_pg_stat_subscription_pid), \"cluster\"\
