              / max by (pod) (cnpg_pg_settings_setting{name="max_connections", namespace="vault",
              pod=~"secrets-db-r-([1-9][0-9]*)$"}) * 100 > 80

              '
            for: 5m
            labels:
              cnpg_cluster: secrets-db-r
              namespace: vault
              severity: warning
          - alert: CNPGClusterHighReplicationLag
