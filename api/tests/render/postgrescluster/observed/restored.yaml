              secrets-db-r-([1-9][0-9]*)$-tbs.*\"})\n    /\n    sum by (namespace,persistentvolumeclaim)\
              \ (kubelet_volume_stats_capacity_bytes{namespace=\"vault\", persistentvolumeclaim=~\"\
              secrets-db-r-([1-9][0-9]*)$-tbs.*\"})\n    *\n    on(namespace, persistentvolumeclaim)\
              \ group_left(volume)\n    kube_pod_spec_volumes_persistentvolumeclaims_info{pod=~\"\
              secrets-db-r-([1-9][0-9]*)$\"}\n) * 100 > 70\n"
            for: 5m
            labels:
              cnpg_cluster: secrets-db-r
              namespace: vault
              severity: warning
          - alert: CNPGClusterOffline
            annotations:
              description: 'CloudNativePG Cluster "vault/secrets-db-r" has no ready
                instances.


                Having an offline cluster means your applications will not be able
                to access the database, leading to

                potential service disruption and/or data loss.'
              runbook_url: https://github.com/cloudnative-pg/charts/blob/main/charts/cluster/docs/runbooks/CNPGClusterOffline.md
              summary: CNPG Cluster has no running instances!
            expr: '(count(cnpg_collector_up{namespace="vault",pod=~"secrets-db-r-([1-9][0-9]*)$"})
              OR on() vector(0)) == 0

              '
            for: 5m
            labels:
              cnpg_cluster: secrets-db-r
              namespace: vault
              severity: critical
          - alert: CNPGClusterPhysicalReplicationLagCritical
            annotations:
              description: 'CloudNativePG Cluster "vault/secrets-db-r" is experiencing
                a very high physical replication lag of {{ $value }}ms.


                High replication lag indicates network issues, busy instances, slow
                queries or suboptimal configuration.'
              runbook_url: https://github.com/cloudnative-pg/charts/blob/main/charts/cluster/docs/runbooks/CNPGClusterPhysicalReplicationLag.md
              summary: CNPG Cluster very high physical replication lag
            expr: 'max(cnpg_pg_replication_lag{namespace="vault",pod=~"secrets-db-r-([1-9][0-9]*)$"})
              > 15

              '
            for: 5m
            labels:
              cnpg_cluster: secrets-db-r
              namespace: vault
              severity: critical
          - alert: CNPGClusterPhysicalReplicationLagWarning
            annotations:
              description: 'CloudNativePG Cluster "vault/secrets-db-r" is experiencing
                a high physical replication lag of {{ $value }}ms.


                High replication lag indicates network issues, busy instances, slow
                queries or suboptimal configuration.'
              runbook_url: https://github.com/cloudnative-pg/charts/blob/main/charts/cluster/docs/runbooks/CNPGClusterPhysicalReplicationLag.md
              summary: CNPG Cluster high physical replication lag
            expr: 'max(cnpg_pg_replication_lag{namespace="vault",pod=~"secrets-db-r-([1-9][0-9]*)$"})
              > 1

              '
            for: 5m
            labels:
              cnpg_cluster: secrets-db-r
              namespace: vault
              severity: warning
          - alert: CNPGClusterZoneSpreadWarning
            annotations:
              description: 'CloudNativePG Cluster "vault/secrets-db-r" has instances
                in the same availability zone.


                A disaster in one availability zone will lead to a potential service
                disruption and/or data loss.'
              runbook_url: https://github.com/cloudnative-pg/charts/blob/main/charts/cluster/docs/runbooks/CNPGClusterZoneSpreadWarning.md
              summary: CNPG Cluster instances in the same zone.
            expr: '3 > count(count by (label_topology_kubernetes_io_zone) (kube_pod_info{namespace="vault",
              pod=~"secrets-db-r-([1-9][0-9]*)$"} * on(node,instance) group_left(label_topology_kubernetes_io_zone)
              kube_node_labels)) < 3

              '
            for: 5m
            labels:
              cnpg_cluster: secrets-db-r
              namespace: vault
              severity: warning
  conditions:
  - type: Ready
    status: 'True'
    reason: Available
  - type: Synced
    status: 'True'
    reason: ReconcileSuccess
