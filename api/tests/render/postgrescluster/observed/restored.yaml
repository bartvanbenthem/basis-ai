      spec:
        groups:
        - name: cloudnative-pg/vault/secrets-db-r
          rules:
          - alert: CNPGClusterHACritical
            annotations:
              description: 'CloudNativePG Cluster "{{ $labels.job }}" has no ready
                standby replicas. Your cluster at a severe

                risk of data loss and downtime if the primary instance fails.


                The primary instance is still online and able to serve queries, although
                connections to the `-ro` endpoint

                will fail. The `-r` endpoint os operating at reduced capacity and
                all traffic is being served by the main.


                This can happen during a normal fail-over or automated minor version
                upgrades in a cluster with 2 or less

                instances. The replaced instance may need some time to catch-up with
                the cluster primary instance.


                This alarm will be always trigger if your cluster is configured to
                run with only 1 instance. In this

                case you may want to silence it.'
              runbook_url: https://github.com/cloudnative-pg/charts/blob/main/charts/cluster/docs/runbooks/CNPGClusterHACritical.md
              summary: CNPG Cluster has no standby replicas!
            expr: "max by (job) (cnpg_pg_replication_streaming_replicas{namespace=\"\
              vault\"} - cnpg_pg_replication_is_wal_receiver_up{namespace=\"vault\"\
              }) < 1\n  and on (job)\n(max by (job) (cnpg_collector_replica_mode{namespace=\"\
              vault\"}) == 0)\n"
            for: 5m
            labels:
              cnpg_cluster: secrets-db-r
              namespace: vault
              severity: critical
          - alert: CNPGClusterHAWarning
            annotations:
              description: 'CloudNativePG Cluster "{{ $labels.job }}" has only {{
                $value }} standby replicas, putting

                your cluster at risk if another instance fails. The cluster is still
                able to operate normally, although

                the `-ro` and `-r` endpoints operate at reduced capacity.


                This can happen during a normal fail-over or automated minor version
                upgrades. The replaced instance may

                need some time to catch-up with the cluster primary instance.


                This alarm will be constantly triggered if your cluster is configured
                to run with less than 3 instances.

                In this case you may want to silence it.'
              runbook_url: https://github.com/cloudnative-pg/charts/blob/main/charts/cluster/docs/runbooks/CNPGClusterHAWarning.md
              summary: CNPG Cluster less than 2 standby replicas.
            expr: "max by (job) (cnpg_pg_replication_streaming_replicas{namespace=\"\
              vault\"} - cnpg_pg_replication_is_wal_receiver_up{namespace=\"vault\"\
              }) < 2\n  and on (job)\n(max by (job) (cnpg_collector_replica_mode{namespace=\"\
              vault\"}) == 0)\n"
            for: 5m
            labels:
              cnpg_cluster: secrets-db-r
              namespace: vault
              severity: warning
          - alert: CNPGClusterHighConnectionsCritical
            annotations:
              description: 'CloudNativePG Cluster "vault/secrets-db-r" instance {{
                $labels.pod }} is using {{ $value }}% of

                the maximum number of connections.'
              runbook_url: https://github.com/cloudnative-pg/charts/blob/main/charts/cluster/docs/runbooks/CNPGClusterHighConnectionsCritical.md
              summary: CNPG Instance maximum number of connections critical!
            expr: 'sum by (pod) (cnpg_backends_total{namespace="vault", pod=~"secrets-db-r-([1-9][0-9]*)$"})
              / max by (pod) (cnpg_pg_settings_setting{name="max_connections", namespace="vault",
              pod=~"secrets-db-r-([1-9][0-9]*)$"}) * 100 > 95

              '
            for: 5m
            labels:
              cnpg_cluster: secrets-db-r
              namespace: vault
              severity: critical
