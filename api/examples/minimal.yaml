# Smallest useful PostgresCluster: 3 instances of PostgreSQL 17 with
# metrics, alerts and a Grafana dashboard (all defaults), in the demo
# Project's protected location, internal only (the default). Applications in
# that location connect with the credentials in Secret demo/orders-db-app at
# orders-db-rw.demo.svc:5432. For clients outside the location, see
# spec.expose in production.yaml.
apiVersion: cnpg.cndev.nl/v1alpha1
kind: PostgresCluster
metadata:
  name: orders-db
  namespace: demo
spec:
  storage:
    size: 10Gi
