# Every feature of the API switched on: a size from the catalog with some
# settings of its own, WAL on its own volume, quorum
# synchronous replication, PgBouncer (rw + ro), S3 backups through the Barman
# Cloud plugin, extra databases/roles, external LoadBalancer, monitoring.
#
# Needs the S3 credentials Secret first, e.g.:
#   kubectl -n payments create secret generic payments-db-s3 \
#     --from-literal=ACCESS_KEY_ID=... --from-literal=ACCESS_SECRET_KEY=...
apiVersion: postgres.cndev.nl/v1alpha1
kind: PostgresCluster
metadata:
  name: payments-db
  namespace: payments
  labels:
    backstage.io/owner: team-payments
spec:
  postgresVersion: 17
  instances: 3
  # Each instance's CPU and memory (request and limit); PostgreSQL's settings
  # are tuned to them.
  resources:
    cpu: "2"
    memory: 8Gi
  storage:
    size: 50Gi
  walStorage:
    size: 10Gi
  postgresql:
    parameters:
      # Over the tuned settings.
      max_connections: "300"
      pg_stat_statements.max: "10000"
      pg_stat_statements.track: all
  database:
    name: payments
    owner: payments
  databases:
    - name: payments_audit
      owner: payments
      extensions: [pg_stat_statements]
  roles:
    - name: reporting
      login: true
      inRoles: [pg_read_all_data]
      passwordSecret: payments-db-reporting
  highAvailability:
    podAntiAffinityType: required
    zoneSpread: true
    synchronousReplicas: 1
    synchronousDataDurability: preferred
  pooler:
    enabled: true
    instances: 2
    poolMode: transaction
    readOnly: true
  backup:
    enabled: true
    destinationPath: s3://pg-backups/payments
    endpointURL: https://object.storage.eu01.onstackit.cloud
    s3Credentials:
      secretName: payments-db-s3
    retentionPolicy: 30d
    schedule: "0 0 2 * * *"
  monitoring:
    enabled: true
    prometheusRule:
      excludeRules: [CNPGClusterZoneSpreadWarning]
    grafanaDashboard:
      enabled: true
  # External access for clients outside the location (off by default):
  # Service <name>-external. Connect with sslmode=verify-full and the CA in
  # Secret <name>-ca.
  expose:
    enabled: true
    type: LoadBalancer
    # On SKE a LoadBalancer Service gets an ephemeral public IP by default.
    # To keep the IP stable, reserve a public IP in the STACKIT project:
    # annotations:
    #   lb.stackit.cloud/external-address: 192.0.2.10
    # Required: only these CIDRs reach 5432.
    loadBalancerSourceRanges: [10.0.0.0/8]
