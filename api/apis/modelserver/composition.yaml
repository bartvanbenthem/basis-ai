# The ModelServer composition is Go code: function-basis
# (../../function/modelserver). See its package documentation for what gets
# composed: the LLMInferenceService (vLLM, llm-d's scheduler), its model
# credentials, PodMonitor and PrometheusRule in each of the Project's sites,
# and the GrafanaDashboard in the Project's Grafana.
apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: modelserver
  labels:
    ai.cndev.nl/api: modelserver
spec:
  compositeTypeRef:
    apiVersion: ai.cndev.nl/v1alpha1
    kind: ModelServer
  mode: Pipeline
  pipeline:
    - step: compose
      functionRef:
        name: function-basis
