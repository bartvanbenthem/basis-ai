# The PostgresCluster composition is Rust: function-basis
# (../../function/src/postgrescluster/mod.rs). See its module documentation for what
# gets composed, the sites, the replica topology and the switchover protocol.
apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: postgrescluster
  labels:
    postgres.cndev.nl/api: postgrescluster
spec:
  compositeTypeRef:
    apiVersion: postgres.cndev.nl/v1alpha1
    kind: PostgresCluster
  mode: Pipeline
  pipeline:
    - step: compose
      functionRef:
        name: function-basis
