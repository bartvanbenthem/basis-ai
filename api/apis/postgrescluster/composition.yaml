# The PostgresCluster composition is Go code: function-basis
# (../../function/postgrescluster). See its package documentation for what
# gets composed, the sites, the replica topology and the switchover protocol.
apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: postgrescluster
  labels:
    cnpg.cndev.nl/api: postgrescluster
spec:
  compositeTypeRef:
    apiVersion: cnpg.cndev.nl/v1alpha1
    kind: PostgresCluster
  mode: Pipeline
  pipeline:
    - step: compose
      functionRef:
        name: function-basis
