# PostgresCluster: a namespaced Crossplane v2 composite resource that bundles
# everything a production CloudNativePG database needs (Cluster, Pooler,
# Barman Cloud ObjectStore + ScheduledBackup, Databases, PodMonitors and
# custom exporter queries, PrometheusRule, GrafanaDashboard) behind one small,
# opinionated API.
#
# Crossplane v2: apiextensions.crossplane.io/v2 + scope: Namespaced. There is
# no claim/XR split any more -- users (and Backstage) create PostgresCluster
# objects directly in their Project's namespace on the control plane. The
# composition places the CNPG/Prometheus objects in the Project's locations
# through provider-kubernetes Objects; only the GrafanaDashboard stays on the
# control plane. See ../../README.md.
#
# Locations: the platform's control plane runs no databases. Every
# PostgresCluster runs in its Project's protected location (another
# Kubernetes cluster, see ../../../portal/catalog/docs/platform/locations.md); with
# spec.geoReplication a CloudNativePG replica cluster runs in the Project's
# recovery location, fed through the backup object store (distributed
# topology), ready to take over.
#
# Restore: spec.restore creates the cluster from another cluster's backup
# folder (point in time or latest) instead of an empty database; only at
# creation, and the source is only read.
apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: postgresclusters.postgres.cndev.nl
spec:
  group: postgres.cndev.nl
  scope: Namespaced
  names:
    kind: PostgresCluster
    plural: postgresclusters
    shortNames: [pgc]
    categories: [crossplane, basis]
  defaultCompositionRef:
    name: postgrescluster
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      additionalPrinterColumns:
        - name: Version
          type: integer
          jsonPath: .spec.postgresVersion
        - name: CPU
          type: string
          jsonPath: .spec.resources.cpu
        - name: Memory
          type: string
          jsonPath: .spec.resources.memory
        - name: Instances
          type: integer
          jsonPath: .spec.instances
        - name: Ready-Instances
          type: integer
          jsonPath: .status.readyInstances
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Primary
          type: string
          jsonPath: .status.currentPrimary
        - name: Location
          type: string
          jsonPath: .status.primaryLocation
        - name: Site
          type: string
          jsonPath: .status.primarySite
        # Crossplane appends SYNCED, READY, COMPOSITION and AGE itself.
      schema:
        openAPIV3Schema:
          type: object
          description: A production-ready PostgreSQL cluster managed by CloudNativePG.
          properties:
            spec:
              type: object
              x-kubernetes-validations:
                - rule: "!has(self.backup) || has(self.backup.destinationPath) == has(self.backup.s3Credentials)"
                  message: set backup.destinationPath and backup.s3Credentials together, or neither to use the Project's backup bucket
                - rule: "!has(self.highAvailability) || !has(self.highAvailability.synchronousReplicas) || self.highAvailability.synchronousReplicas < self.instances"
                  message: highAvailability.synchronousReplicas must be lower than instances
                - rule: "!has(oldSelf.walStorage) || has(self.walStorage)"
                  message: walStorage cannot be removed from an existing cluster
                - rule: "!has(self.geoReplication) || !self.geoReplication.enabled || (has(self.backup) && self.backup.enabled)"
                  message: geoReplication needs backup.enabled (the replica cluster is fed through the backup object store)
                - rule: "!has(self.geoReplication) || !has(self.geoReplication.primarySite) || self.geoReplication.primarySite == 'protected' || self.geoReplication.enabled"
                  message: geoReplication.primarySite can only be recovery while geoReplication is enabled
                - rule: "!has(self.geoReplication) || !has(self.geoReplication.instances) || !has(self.highAvailability) || !has(self.highAvailability.synchronousReplicas) || self.highAvailability.synchronousReplicas < self.geoReplication.instances"
                  message: highAvailability.synchronousReplicas must be lower than geoReplication.instances
                - rule: "has(self.restore) == has(oldSelf.restore)"
                  message: restore can only be set when the cluster is created, and stays
                - rule: "!has(self.profile) || self.profile != 'vector' || (has(self.postgresVersion) ? self.postgresVersion : 17) >= 18"
                  message: profile vector needs postgresVersion 18 or later (its extensions are mounted from images)
              properties:
                restore:
                  type: object
                  description: >-
                    Create this cluster from another cluster's backups instead of an empty database
                    (point-in-time recovery), only when the cluster is created. The source is a
                    backup folder (a cluster's status.backup.serverName, or one of its Project's
                    status.backup.servers) in the Project's backup bucket, or in an object store of
                    its own. It is only read: this cluster archives to a folder of its own
                    (status.backup.serverName). postgresVersion and database must match the source.
                  required: [source]
                  x-kubernetes-validations:
                    - rule: self == oldSelf
                      message: restore is immutable
                  properties:
                    source:
                      type: object
                      required: [serverName]
                      x-kubernetes-validations:
                        - rule: has(self.destinationPath) == has(self.s3Credentials)
                          message: set restore.source.destinationPath and s3Credentials together, or neither to restore from the Project's backup bucket
                      properties:
                        serverName:
                          type: string
                          description: Backup folder to restore from, e.g. the source cluster's name.
                          pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
                          maxLength: 128
                        destinationPath:
                          type: string
                          description: >-
                            Object store prefix the folder is in, e.g. s3://my-bucket/postgres. Leave it
                            (and s3Credentials) out for the Project's backup bucket.
                          pattern: '^s3://.+'
                        endpointURL:
                          type: string
                          description: S3 endpoint for non-AWS object stores.
                        endpointCA:
                          type: object
                          description: Secret holding a CA bundle for a self-signed endpoint.
                          properties:
                            secretName:
                              type: string
                            key:
                              type: string
                              default: ca.crt
                          required: [secretName]
                        s3Credentials:
                          type: object
                          description: Secret in the same namespace with S3 credentials that can read the folder.
                          properties:
                            secretName:
                              type: string
                            accessKeyIdKey:
                              type: string
                              default: ACCESS_KEY_ID
                            secretAccessKeyKey:
                              type: string
                              default: ACCESS_SECRET_KEY
                            regionKey:
                              type: string
                          required: [secretName]
                    targetTime:
                      type: string
                      format: date-time
                      description: >-
                        Recover up to this moment (RFC 3339, e.g. 2026-10-08T09:30:00Z). It must lie after
                        the source's first recoverability point. Leave it out to replay every archived
                        WAL file (the latest state).
                geoReplication:
                  type: object
                  default: {}
                  description: >-
                    A CloudNativePG replica cluster in the Project's recovery location, kept up to
                    date from the WAL archive in the backup object store (no network path between
                    the locations needed). Needs backup.enabled and a Project with a recovery
                    location.
                  properties:
                    enabled:
                      type: boolean
                      default: false
                    instances:
                      type: integer
                      description: Instances in the recovery location. Defaults to spec.instances.
                      minimum: 1
                      maximum: 9
                    primarySite:
                      type: string
                      description: >-
                        Site of the primary. Setting it to recovery switches the primary over to
                        the replica cluster (and back with protected): the current primary is
                        demoted first and the replica cluster is promoted with its demotion token,
                        so no transaction is lost (see promotion for when the old primary is gone).
                      enum: [protected, recovery]
                      default: protected
                    promotion:
                      type: string
                      description: >-
                        How a primarySite change is carried out. Switchover waits for the current
                        primary's demotion token. Failover promotes the other site right away, for
                        when the primary's location is down; transactions it had not archived
                        yet are lost, and the old primary may have to be recreated before it can rejoin.
                      enum: [Switchover, Failover]
                      default: Switchover
                postgresVersion:
                  type: integer
                  description: PostgreSQL major version, resolved to a digest-pinned image through the ClusterImageCatalog.
                  enum: [14, 15, 16, 17, 18]
                  default: 17
                  x-kubernetes-validations:
                    - rule: self >= oldSelf
                      message: postgresVersion cannot be downgraded (major upgrades only go forward)
                imageCatalog:
                  type: string
                  description: Name of the ClusterImageCatalog to resolve postgresVersion in (installed by operator).
                  default: postgresql-standard-trixie
                profile:
                  type: string
                  description: >-
                    Workload profile. general: settings tuned to the resources. vector: for
                    embeddings, RAG and hybrid search (PostgreSQL 18+): more maintenance_work_mem
                    and parallel maintenance workers to build vector indexes in memory, and exporter metrics on vector and BM25 indexes and index builds. List the
                    extensions in database.extensions (vector, vchord, pg_search).
                  enum: [general, vector]
                  default: general
                instances:
                  type: integer
                  description: Number of PostgreSQL instances (1 primary + N-1 hot standbys). Use 3 or more for production.
                  minimum: 1
                  maximum: 9
                  default: 3
                storage:
                  type: object
                  default: {}
                  description: PGDATA volume.
                  x-kubernetes-validations:
                    - rule: "!has(self.size) || !has(oldSelf.size) || quantity(self.size).compareTo(quantity(oldSelf.size)) >= 0"
                      message: volumes can grow but not shrink
                    - rule: "has(self.storageClass) == has(oldSelf.storageClass) && (!has(self.storageClass) || self.storageClass == oldSelf.storageClass)"
                      message: storageClass cannot be changed after creation
                  properties:
                    size:
                      type: string
                      description: Volume size, e.g. 20Gi. Can be increased later if the StorageClass allows expansion.
                      default: 10Gi
                      pattern: '^[0-9]+(Mi|Gi|Ti)$'
                    storageClass:
                      type: string
                      description: StorageClass name. Uses the cluster default when unset.
                walStorage:
                  type: object
                  description: Separate volume for WAL files. Recommended for production to isolate WAL I/O and avoid PGDATA filling up from WAL.
                  x-kubernetes-validations:
                    - rule: "quantity(self.size).compareTo(quantity(oldSelf.size)) >= 0"
                      message: volumes can grow but not shrink
                    - rule: "has(self.storageClass) == has(oldSelf.storageClass) && (!has(self.storageClass) || self.storageClass == oldSelf.storageClass)"
                      message: storageClass cannot be changed after creation
                  properties:
                    size:
                      type: string
                      pattern: '^[0-9]+(Mi|Gi|Ti)$'
                    storageClass:
                      type: string
                  required: [size]
                resources:
                  type: object
                  description: >-
                    CPU and memory for each PostgreSQL instance (memory is request and limit; no CPU
                    limit, so instances aren't throttled). PostgreSQL's settings (shared_buffers,
                    effective_cache_size, work_mem, ...) are tuned to them; postgresql.parameters
                    set here win. Changing them restarts the instances one by one, the primary last
                    (switchover).
                  default: {}
                  properties:
                    cpu:
                      type: string
                      pattern: '^[0-9]+(\.[0-9]+)?m?$'
                      default: 500m
                    memory:
                      type: string
                      description: Mi or Gi.
                      pattern: '^[0-9]+(Mi|Gi)$'
                      default: 1Gi
                postgresql:
                  type: object
                  description: PostgreSQL configuration.
                  properties:
                    parameters:
                      type: object
                      description: postgresql.conf parameters, e.g. max_connections=200, shared_buffers=256MB. Parameters CNPG manages itself are rejected by its webhook.
                      additionalProperties:
                        type: string
                    pgHba:
                      type: array
                      description: Extra pg_hba.conf lines, prepended to the CNPG defaults.
                      items:
                        type: string
                    sharedPreloadLibraries:
                      type: array
                      items:
                        type: string
                database:
                  type: object
                  default: {}
                  description: Application database created at bootstrap (initdb). Its credentials end up in the <name>-app Secret.
                  properties:
                    name:
                      type: string
                      default: app
                      x-kubernetes-validations:
                        - rule: self == oldSelf
                          message: database.name is immutable
                    owner:
                      type: string
                      default: app
                      x-kubernetes-validations:
                        - rule: self == oldSelf
                          message: database.owner is immutable
                    encoding:
                      type: string
                      default: UTF8
                    localeCollate:
                      type: string
                      default: C
                    localeCType:
                      type: string
                      default: C
                    extensions:
                      type: array
                      description: >-
                        Extensions to ensure present in this database, e.g. [vector]. Each must be in the
                        postgres-extensions catalog. Removing one from the list leaves it installed.
                      maxItems: 32
                      items:
                        type: string
                        pattern: '^[a-z0-9_-]+$'
                      x-kubernetes-list-type: set
                databases:
                  type: array
                  description: Additional databases managed declaratively (postgresql.cnpg.io Database).
                  maxItems: 32
                  items:
                    type: object
                    required: [name, owner]
                    properties:
                      name:
                        type: string
                        pattern: '^[a-z_][a-z0-9_]*$'
                      owner:
                        type: string
                        description: Role owning the database. Must exist (bootstrap owner, or one of roles[]).
                      extensions:
                        type: array
                        description: >-
                          Extensions to ensure present, e.g. [pg_stat_statements, vector]. Each must be
                          in the postgres-extensions catalog. Removing one from the list leaves it installed.
                        maxItems: 32
                        items:
                          type: string
                          pattern: '^[a-z0-9_-]+$'
                      reclaimPolicy:
                        type: string
                        description: Whether to drop the database in PostgreSQL when it is removed from this list.
                        enum: [retain, delete]
                        default: retain
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys: [name]
                roles:
                  type: array
                  description: Additional PostgreSQL roles managed by CNPG (Cluster.spec.managed.roles).
                  maxItems: 32
                  items:
                    type: object
                    required: [name]
                    properties:
                      name:
                        type: string
                        pattern: '^[a-z_][a-z0-9_]*$'
                      login:
                        type: boolean
                        default: true
                      createdb:
                        type: boolean
                        default: false
                      inRoles:
                        type: array
                        description: Roles to grant membership of, e.g. [pg_read_all_data, pg_monitor].
                        items:
                          type: string
                      passwordSecret:
                        type: string
                        description: Name of a kubernetes.io/basic-auth Secret (keys username/password) in the same namespace. Without one the role has no password.
                      connectionLimit:
                        type: integer
                        default: -1
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys: [name]
                enableSuperuserAccess:
                  type: boolean
                  description: Create the <name>-superuser Secret and allow postgres-user logins. Keep off unless needed.
                  default: false
                highAvailability:
                  type: object
                  default: {}
                  properties:
                    podAntiAffinityType:
                      type: string
                      description: required = never co-locate two instances on one node (pods stay Pending if nodes run out); preferred = best effort.
                      enum: [required, preferred]
                      default: preferred
                    zoneSpread:
                      type: boolean
                      description: Spread instances across topology.kubernetes.io/zone.
                      default: true
                    synchronousReplicas:
                      type: integer
                      description: Number of synchronous standbys (quorum-based, method any). 0 = asynchronous replication.
                      minimum: 0
                      default: 0
                    synchronousDataDurability:
                      type: string
                      description: required = writes block when no synchronous standby is available; preferred = degrade to async instead.
                      enum: [required, preferred]
                      default: preferred
                    primaryUpdateMethod:
                      type: string
                      description: How the primary is updated during rolling updates.
                      enum: [switchover, restart]
                      default: switchover
                    primaryUpdateStrategy:
                      type: string
                      description: unsupervised = operator switches over automatically; supervised = wait for a manual promote.
                      enum: [unsupervised, supervised]
                      default: unsupervised
                pooler:
                  type: object
                  default: {}
                  description: PgBouncer connection pooler(s) in front of the cluster.
                  properties:
                    enabled:
                      type: boolean
                      default: false
                    instances:
                      type: integer
                      minimum: 1
                      maximum: 10
                      default: 2
                    poolMode:
                      type: string
                      enum: [session, transaction]
                      default: transaction
                    maxClientConn:
                      type: integer
                      minimum: 1
                      default: 1000
                    defaultPoolSize:
                      type: integer
                      minimum: 1
                      default: 25
                    readOnly:
                      type: boolean
                      description: Also create a pooler for the read-only (standby) service, <name>-pooler-ro.
                      default: false
                backup:
                  type: object
                  default: {}
                  description: >-
                    Continuous WAL archiving + scheduled base backups to S3-compatible object storage via
                    the Barman Cloud plugin (installed by operator). Without destinationPath and
                    s3Credentials it goes to the Project's backup bucket (Project spec.backup, COSI),
                    with credentials of their own in each site.
                  properties:
                    enabled:
                      type: boolean
                      default: false
                    destinationPath:
                      type: string
                      description: >-
                        Object store prefix, e.g. s3://my-bucket/postgres. The cluster name is appended by
                        Barman. Leave it (and s3Credentials) out to use the Project's backup bucket.
                      pattern: '^s3://.+'
                    endpointURL:
                      type: string
                      description: S3 endpoint for non-AWS object stores (MinIO, STACKIT, Ceph, ...).
                    endpointCA:
                      type: object
                      description: Secret holding a CA bundle for a self-signed endpoint.
                      properties:
                        secretName:
                          type: string
                        key:
                          type: string
                          default: ca.crt
                      required: [secretName]
                    s3Credentials:
                      type: object
                      description: Secret in the same namespace with S3 credentials.
                      properties:
                        secretName:
                          type: string
                        accessKeyIdKey:
                          type: string
                          default: ACCESS_KEY_ID
                        secretAccessKeyKey:
                          type: string
                          default: ACCESS_SECRET_KEY
                        regionKey:
                          type: string
                          description: Optional Secret key holding the S3 region.
                      required: [secretName]
                    retentionPolicy:
                      type: string
                      description: Recovery window to keep, e.g. 30d, 4w.
                      pattern: '^[1-9][0-9]*[dwm]$'
                      default: 30d
                    schedule:
                      type: string
                      description: Base backup schedule in CNPG's 6-field cron format (seconds first).
                      default: "0 0 2 * * *"
                    compression:
                      type: string
                      enum: [gzip, bzip2, snappy, lz4]
                      default: gzip
                monitoring:
                  type: object
                  default: {}
                  properties:
                    enabled:
                      type: boolean
                      description: Create PodMonitor(s) so Prometheus scrapes the instance (and pooler) metrics endpoints on port 9187/9127.
                      default: true
                    podMonitorLabels:
                      type: object
                      description: Extra labels on the PodMonitors/PrometheusRule, to match your Prometheus' selectors (e.g. release=kube-prometheus-stack).
                      additionalProperties:
                        type: string
                    prometheusRule:
                      type: object
                      default: {}
                      properties:
                        enabled:
                          type: boolean
                          description: Create a PrometheusRule with the upstream CloudNativePG alerts scoped to this cluster.
                          default: true
                        excludeRules:
                          type: array
                          description: Alert names to leave out, e.g. [CNPGClusterZoneSpreadWarning].
                          items:
                            type: string
                    grafanaDashboard:
                      type: object
                      default: {}
                      properties:
                        enabled:
                          type: boolean
                          description: Create a grafana-operator GrafanaDashboard with the CloudNativePG dashboard, preselected on this cluster.
                          default: true
                        instanceSelector:
                          type: object
                          description: matchLabels selecting the Grafana instance(s). Defaults to dashboards.paas.cndev.nl/scope=<namespace>.
                          additionalProperties:
                            type: string
                        allowCrossNamespaceImport:
                          type: boolean
                          description: Allow a Grafana in another namespace to import this dashboard.
                          default: false
                        folder:
                          type: string
                          default: CloudNativePG
                        datasourceName:
                          type: string
                          description: Name of the Prometheus datasource in Grafana.
                          default: prometheus
                expose:
                  type: object
                  description: >-
                    External access to the primary (read-write) as <name>-external, a LoadBalancer
                    Service. Off by default: applications in the cluster's location connect
                    in-cluster to <name>-rw (or the pooler), which also follows the primary after a
                    switchover. Turn it on only for clients outside the location (admin and BI
                    tools, migrations); it then needs loadBalancerSourceRanges.
                  default: {}
                  x-kubernetes-validations:
                    # has(): the API server also checks this against expose's default ({}), before
                    # the nested default enabled: false applies.
                    - rule: "!has(self.enabled) || !self.enabled || (has(self.loadBalancerSourceRanges) && size(self.loadBalancerSourceRanges) > 0)"
                      message: expose.enabled needs loadBalancerSourceRanges (the clients' CIDRs); a database is never open to everyone
                  properties:
                    enabled:
                      type: boolean
                      default: false
                    type:
                      type: string
                      enum: [LoadBalancer]
                      default: LoadBalancer
                    annotations:
                      type: object
                      additionalProperties:
                        type: string
                    loadBalancerSourceRanges:
                      type: array
                      description: CIDRs allowed to connect, e.g. [203.0.113.10/32]. Required when enabled.
                      maxItems: 50
                      items:
                        type: string
                        pattern: '^[0-9a-fA-F:.]+/[0-9]{1,3}$'
            status:
              type: object
              properties:
                ready:
                  type: boolean
                  description: True when every instance is ready.
                phase:
                  type: string
                  description: CNPG Cluster phase, e.g. "Cluster in healthy state".
                instances:
                  type: integer
                readyInstances:
                  type: integer
                currentPrimary:
                  type: string
                image:
                  type: string
                  description: PostgreSQL image currently running.
                message:
                  type: string
                endpoints:
                  type: object
                  description: >-
                    DNS names applications connect to (port 5432), inside the primary's location.
                    The same names exist in the recovery location.
                  properties:
                    readWrite:
                      type: string
                    readOnly:
                      type: string
                    read:
                      type: string
                    pooler:
                      type: string
                    poolerReadOnly:
                      type: string
                secrets:
                  type: object
                  description: Secrets holding connection credentials, generated by CNPG in the namespace of the same name in each location.
                  properties:
                    app:
                      type: string
                    superuser:
                      type: string
                backup:
                  type: object
                  properties:
                    serverName:
                      type: string
                      description: >-
                        Folder the primary archives to in the backup store, what another cluster's
                        restore.source.serverName names. A restored cluster gets a new one,
                        <name>-<first 8 characters of its uid>.
                    lastSuccessfulBackup:
                      type: string
                    firstRecoverabilityPoint:
                      type: string
                sites:
                  type: object
                  description: >-
                    The Project's locations this cluster was placed in, pinned on first use so
                    the cluster never moves with its Project.
                  properties:
                    protected:
                      type: string
                    recovery:
                      type: string
                sizing:
                  type: object
                  description: What the instances run with, from spec.resources and spec.profile.
                  properties:
                    resources:
                      type: object
                      x-kubernetes-preserve-unknown-fields: true
                    parameters:
                      type: object
                      description: PostgreSQL settings tuned to the resources and profile, before spec.postgresql.parameters.
                      additionalProperties:
                        type: string
                backupStore:
                  type: object
                  description: >-
                    The Project's backup bucket the cluster archives to or restores from, pinned on
                    first use (only when backup.destinationPath or restore.source.destinationPath is
                    unset).
                  properties:
                    destinationPath:
                      type: string
                    endpointURL:
                      type: string
                    namespace:
                      type: string
                      description: Namespace on the control plane with each site's credentials Secret.
                    region:
                      type: boolean
                      description: Whether the credentials Secrets carry a REGION key.
                primarySite:
                  type: string
                  description: Site the primary runs in (protected or recovery).
                primaryLocation:
                  type: string
                  description: Location the primary runs in.
                promotionToken:
                  type: string
                  description: Demotion token the primary was promoted with (kept so the promotion stays valid until CloudNativePG has acted on it).
                locations:
                  type: array
                  description: One entry per location the cluster runs in, the protected site first.
                  items:
                    type: object
                    properties:
                      location:
                        type: string
                      site:
                        type: string
                        description: protected or recovery.
                      role:
                        type: string
                        description: primary, replica, or promoting (waiting for the demotion token).
                      ready:
                        type: boolean
                      phase:
                        type: string
                      instances:
                        type: integer
                      readyInstances:
                        type: integer
                      currentPrimary:
                        type: string
                        description: Instance pod acting as primary (the designated primary in a replica cluster).
                monitoring:
                  type: object
                  properties:
                    dashboardUid:
                      type: string
                      description: Grafana dashboard UID for this cluster (link as <grafana>/d/<uid>).
