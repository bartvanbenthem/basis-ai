# The Project composition is Go code: function-basis
# (../../function/project). See its package documentation for what gets
# composed: the namespace on the control plane with the project's Prometheus,
# Grafana, access and backup bucket (COSI), and per location (wrapped in
# provider-kubernetes Objects) the namespace, a Prometheus that writes to the
# control plane, access, an optional quota and the backup reachability check.
#
# Cluster-wide settings come from the EnvironmentConfig "project-defaults"
# (example: ../../examples/project-defaults.yaml); every key is optional.
apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: project
  labels:
    platform.cndev.nl/api: project
spec:
  compositeTypeRef:
    apiVersion: platform.cndev.nl/v1alpha1
    kind: Project
  mode: Pipeline
  pipeline:
    - step: compose
      functionRef:
        name: function-basis
