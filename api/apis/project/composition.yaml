# Composition for platform.cndev.nl/v1alpha1 Project (see definition.yaml).
#
# Composes, for Project <name>, on the control plane (which runs no
# databases):
#   Namespace <name>                      labels platform.cndev.nl/project and
#                                         dashboards.paas.cndev.nl/scope = <name>;
#                                         where the PostgresCluster XRs live
#   ServiceAccount + Prometheus           receives the samples of the project's
#                                         locations (remote write), scrapes nothing
#   PersistentVolumeClaim                 the Prometheus volume, so it can grow
#   Grafana + GrafanaDatasource           what PostgresCluster dashboards import into
#   Ingress prometheus-remote-write       only /api/v1/write, with prometheus.remoteWrite
#                                         in project-defaults
#   RoleBinding per spec.access entry
#   BucketClass project-<name>-backups    COSI, cluster-scoped: deletionPolicy Retain, driver
#                                         from project-defaults backup.cosi.driverName (not
#                                         with spec.backup.bucketClassName); prj-<16>-<hash>
#                                         when that leaves no room for the bucket name
#   BucketClaim backups                   the project's backup bucket (spec.backup)
#   BucketAccess backups-<location>       one per location: its own S3 keys, which COSI
#                                         writes to Secret cosi-backups-<location>; with a
#                                         ServiceAccount backups-<location> (IAM access classes
#                                         need one); created one at a time, the next once the
#                                         previous is granted
#   Secret backup-s3-<location>           those keys unpacked from COSI's BucketInfo JSON
#                                         (ACCESS_KEY_ID, ACCESS_SECRET_KEY, REGION), what
#                                         PostgresClusters copy to that location
#
# With a backup bucket, status.backup.servers is an inventory of the backup
# folders in it: every PostgresCluster's ObjectStore Object (label
# cnpg.cndev.nl/backup-store) names its folder; entries stay, inactive, after
# the cluster is deleted, so it can still be restored from (restore.source).
#
# and in each of its locations, spec.locations.protected (where its
# databases run) and spec.locations.recovery (optional, where
# PostgresClusters with geoReplication keep a replica cluster):
#   Namespace <name>                      never deleted by Crossplane
#   ClusterRoleBinding platform:project:<name>:prometheus
#                                         -> ClusterRole cnpg-platform:project-prometheus
#                                            (created there by the Location)
#   ServiceAccount + Prometheus + PVC     scrapes the namespace's PodMonitors/
#                                         PrometheusRules, the CNPG operator's
#                                         PodMonitor + the cluster metrics from
#                                         kube-prometheus-stack; externalLabels
#                                         location/site; remote write to the
#                                         control plane
#   RoleBinding per spec.access entry
#   ResourceQuota + LimitRange            only with spec.quota
#   Secret backup-check-s3 + CronJob      with a backup bucket: the location's keys, and every
#     backup-check                        few minutes a write, read and delete of a test object
#                                         from there (status.backup.reachability)
#
# Cluster-wide settings come from the EnvironmentConfig "project-defaults"
# (example: ../../examples/project-defaults.yaml); every key is optional and
# falls back to the defaults below, so the composition works without it.
#
# Namespaced objects are only rendered once the Namespace is observed, so the
# first reconcile never fails on "namespace not found".
#
# The "location" template renders the namespace and everything in it for one
# member: "local" (the control plane) is composed directly, each location's
# objects are wrapped in a provider-kubernetes Object (in the project
# namespace on the control plane, resource names "location-<location>-<name>")
# for the ClusterProviderConfig named after the location. The Namespace in a
# location is never deleted by Crossplane (management policies without
# Delete): deleting the Project leaves it and any database still in it.
#
# Each location names a Location (../location), read as an extra resource. A
# Project with an unregistered location isn't ready (its objects there are
# still rendered, so nothing is torn down while a Location is being
# re-created). Every registered one gets a ClusterUsage, so the Location can't
# be deleted while the Project uses it. The namespace on the control plane
# records the locations for the admission policy and the PostgresCluster
# composition (annotations platform.cndev.nl/protected-location,
# platform.cndev.nl/recovery-location and, for Locations with schedulable:
# false, platform.cndev.nl/unschedulable-locations).
apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: project
  labels:
    platform.cndev.nl/api: project
spec:
  compositeTypeRef:
    apiVersion: platform.cndev.nl/v1alpha1
    kind: Project
  mode: Pipeline
  pipeline:
    - step: render
      functionRef:
        name: function-go-templating
      input:
        apiVersion: gotemplating.fn.crossplane.io/v1beta1
        kind: GoTemplate
        source: Inline
        inline:
          template: |
            {{- /* ================= location: the namespace and what's in it, for one location =================
                 . = dict xr, env (project-defaults data), member (location, site, prefix,
                 observed: normalised observed resources keyed without the prefix),
                 remoteWriteUrl, remoteWriteHost, unschedulable (registered locations closed
                 to new databases). Member "local" is the control plane. */}}
            {{- define "location" }}
            {{- $xr := .xr }}
            {{- $spec := $xr.spec | default (dict) }}
            {{- $name := $xr.metadata.name }}
            {{- $ns := $name }}
            {{- $m := .member }}
            {{- $local := eq $m.location "local" }}
            {{- $observed := $m.observed }}
            {{- $env := .env }}
            {{- $clusterMetrics := dig "prometheus" "clusterMetrics" (dict) $env }}
            {{- $cmEnabled := dig "enabled" true $clusterMetrics }}
            {{- $cmNamespace := dig "namespace" "prometheus-operator-system" $clusterMetrics }}
            {{- $cmLabels := dig "serviceMonitorLabels" (dict "release" "prometheus-operator") $clusterMetrics }}
            {{- $cmExclude := dig "excludeApps" (list "kube-prometheus-stack-apiserver" "kube-prometheus-stack-coredns" "kube-prometheus-stack-kube-controller-manager" "kube-prometheus-stack-kube-etcd" "kube-prometheus-stack-kube-proxy" "kube-prometheus-stack-kube-scheduler" "kube-prometheus-stack-operator") $clusterMetrics }}
            {{- $operatorMetrics := dig "prometheus" "operatorMetrics" (dict) $env }}
            {{- $omEnabled := dig "enabled" true $operatorMetrics }}
            {{- $omNamespace := dig "namespace" "cnpg-system" $operatorMetrics }}
            {{- $ingress := dig "grafana" "ingress" (dict) $env }}
            {{- $hostTemplate := dig "hostTemplate" "" $ingress }}
            {{- $remoteWrite := dig "prometheus" "remoteWrite" (dict) $env }}

            {{- /* ---- spec, with the XRD defaults repeated for `crossplane render` and older objects ---- */}}
            {{- $obs := $spec.observability | default (dict) }}
            {{- $prom := $obs.prometheus | default (dict) }}
            {{- $promEnabled := dig "enabled" true $prom }}
            {{- $graf := $obs.grafana | default (dict) }}
            {{- $grafEnabled := and $local (dig "enabled" true $graf) }}
            {{- $host := "" }}
            {{- if and $grafEnabled (dig "ingress" true $graf) $hostTemplate }}{{ $host = replace "{project}" $name $hostTemplate }}{{ end }}
            {{- $scheme := dig "scheme" "http" $ingress }}
            {{- $quota := $spec.quota | default (dict) }}
            {{- $scope := dict "dashboards.paas.cndev.nl/scope" $ns }}
            {{- $labels := dict "app.kubernetes.io/managed-by" "crossplane" "app.kubernetes.io/part-of" "cnpg-platform" "platform.cndev.nl/project" $name }}

            {{- /* ---- readiness from observed state ---- */}}
            {{- $nsObs := index $observed "namespace" }}
            {{- $nsReady := and $nsObs (eq (dig "resource" "status" "phase" "" $nsObs) "Active") }}
            {{- $promReady := false }}
            {{- with index $observed "prometheus" }}
            {{- range (dig "resource" "status" "conditions" (list) .) }}
            {{- if and (eq .type "Available") (eq .status "True") }}{{ $promReady = true }}{{ end }}
            {{- end }}
            {{- end }}
            {{- $grafReady := false }}
            {{- with index $observed "grafana" }}
            {{- $gs := dig "resource" "status" (dict) . }}
            {{- $grafReady = and (eq (dig "stage" "" $gs) "complete") (eq (dig "stageStatus" "" $gs) "success") }}
            {{- end }}
            ---
            apiVersion: v1
            kind: Namespace
            metadata:
              name: {{ $ns }}
              annotations:
                {{ setResourceNameAnnotation "namespace" }}
                gotemplating.fn.crossplane.io/ready: {{ if $nsReady }}"True"{{ else }}"False"{{ end }}
                {{- with $spec.description }}
                platform.cndev.nl/description: {{ . | quote }}
                {{- end }}
                {{- if $local }}
                # Read by the admission policy that keeps PostgresClusters in
                # the project's locations (policies.yaml).
                {{- with dig "locations" "protected" "" $spec }}
                platform.cndev.nl/protected-location: {{ . | quote }}
                {{- end }}
                {{- with dig "locations" "recovery" "" $spec }}
                platform.cndev.nl/recovery-location: {{ . | quote }}
                {{- end }}
                {{- if .backupBucket }}
                # PostgresClusters may then leave backup.destinationPath out.
                platform.cndev.nl/backup-bucket: "true"
                {{- end }}
                {{- with .unschedulable }}
                # Locations whose Location says schedulable: false; the same
                # policy refuses PostgresClusters that newly add them.
                platform.cndev.nl/unschedulable-locations: {{ join "," . | quote }}
                {{- end }}
                {{- else }}
                platform.cndev.nl/orphan: "true"
                {{- end }}
              labels:
                {{- range $k, $v := merge (dict) $labels $scope }}
                {{ $k }}: {{ $v | quote }}
                {{- end }}
                {{- with $spec.owner }}
                backstage.io/owner: {{ . | quote }}
                {{- end }}
                # CNPG, Prometheus and Grafana all run under "baseline";
                # "restricted" warnings flag workloads to harden.
                pod-security.kubernetes.io/enforce: baseline
                pod-security.kubernetes.io/warn: restricted

            {{- if and $promEnabled (not $local) }}
            ---
            # Cluster-wide: kubelet/cAdvisor targets live on the nodes and
            # kube-state-metrics/node-exporter in the kube-prometheus-stack
            # namespace. One shared ClusterRole, one binding per project.
            apiVersion: rbac.authorization.k8s.io/v1
            kind: ClusterRoleBinding
            metadata:
              name: platform:project:{{ $name }}:prometheus
              annotations:
                {{ setResourceNameAnnotation "prometheus-clusterrolebinding" }}
                gotemplating.fn.crossplane.io/ready: {{ if index $observed "prometheus-clusterrolebinding" }}"True"{{ else }}"False"{{ end }}
              labels:
                {{- range $k, $v := $labels }}
                {{ $k }}: {{ $v | quote }}
                {{- end }}
            roleRef:
              apiGroup: rbac.authorization.k8s.io
              kind: ClusterRole
              name: cnpg-platform:project-prometheus
            subjects:
              - kind: ServiceAccount
                name: prometheus
                namespace: {{ $ns }}
            {{- end }}

            {{- if $nsObs }}
            {{- if $promEnabled }}
            ---
            apiVersion: v1
            kind: ServiceAccount
            metadata:
              name: prometheus
              namespace: {{ $ns }}
              annotations:
                {{ setResourceNameAnnotation "prometheus-serviceaccount" }}
                gotemplating.fn.crossplane.io/ready: {{ if index $observed "prometheus-serviceaccount" }}"True"{{ else }}"False"{{ end }}
              labels:
                {{- range $k, $v := $labels }}
                {{ $k }}: {{ $v | quote }}
                {{- end }}
            ---
            apiVersion: monitoring.coreos.com/v1
            kind: Prometheus
            metadata:
              name: prometheus
              namespace: {{ $ns }}
              annotations:
                {{ setResourceNameAnnotation "prometheus" }}
                gotemplating.fn.crossplane.io/ready: {{ if $promReady }}"True"{{ else }}"False"{{ end }}
              labels:
                {{- range $k, $v := $labels }}
                {{ $k }}: {{ $v | quote }}
                {{- end }}
            spec:
              serviceAccountName: prometheus
              replicas: 1
              retention: {{ dig "retention" "7d" $prom | quote }}
              {{- if $local }}
              # The Prometheus in the project's locations writes here.
              enableRemoteWriteReceiver: true
              {{- else }}
              # Tells this location's series apart in the shared Grafana.
              externalLabels:
                location: {{ $m.location }}
                site: {{ $m.site }}
              {{- with .remoteWriteUrl }}
              remoteWrite:
                - url: {{ . | quote }}
              {{- end }}
              {{- end }}
              resources:
                requests:
                  cpu: {{ dig "resources" "requests" "cpu" "100m" $prom | quote }}
                  memory: {{ dig "resources" "requests" "memory" "512Mi" $prom | quote }}
                limits:
                  memory: {{ dig "resources" "limits" "memory" "2Gi" $prom | quote }}
              # Without fsGroup the PVC stays root-owned and Prometheus
              # (non-root) crashes on "open /prometheus/queries.active".
              securityContext:
                runAsNonRoot: true
                runAsUser: 1000
                runAsGroup: 2000
                fsGroup: 2000
                seccompProfile:
                  type: RuntimeDefault
              storage:
                volumeClaimTemplate:
                  spec:
                    accessModes: [ReadWriteOnce]
                    {{- with (dig "storage" "storageClass" "" $prom) }}
                    storageClassName: {{ . | quote }}
                    {{- end }}
                    resources:
                      requests:
                        storage: {{ dig "storage" "size" "10Gi" $prom | quote }}
              {{- if not $local }}
              # Every PodMonitor in this namespace (what PostgresClusters
              # create) and, with operator metrics on, the CNPG operator's,
              # which the dashboard's operator panels query.
              podMonitorSelector: {}
              {{- if $omEnabled }}
              podMonitorNamespaceSelector:
                matchExpressions:
                  - key: kubernetes.io/metadata.name
                    operator: In
                    values:
                      - {{ $ns }}
                      - {{ $omNamespace }}
              {{- end }}
              # Rules from this namespace (the CNPG alerts) and, with cluster
              # metrics on, kube-prometheus-stack's recording rules that the
              # CNPG dashboard's CPU panels query.
              ruleSelector: {}
              ruleNamespaceSelector:
                matchExpressions:
                  - key: kubernetes.io/metadata.name
                    operator: In
                    values:
                      - {{ $ns }}
                      {{- if $cmEnabled }}
                      - {{ $cmNamespace }}
                      {{- end }}
              {{- if $cmEnabled }}
              # Only the node/container ServiceMonitors from
              # kube-prometheus-stack, not the control-plane ones.
              serviceMonitorNamespaceSelector:
                matchLabels:
                  kubernetes.io/metadata.name: {{ $cmNamespace }}
              serviceMonitorSelector:
                matchLabels:
                  {{- range $k, $v := $cmLabels }}
                  {{ $k }}: {{ $v | quote }}
                  {{- end }}
                {{- with $cmExclude }}
                matchExpressions:
                  - key: app
                    operator: NotIn
                    values:
                      {{- range . }}
                      - {{ . }}
                      {{- end }}
                {{- end }}
              {{- end }}
              {{- end }}
            ---
            # The Prometheus StatefulSet's volume, composed so that growing
            # spec.observability.prometheus.storage.size grows the PVC: a
            # StatefulSet never resizes the PVCs of its volumeClaimTemplate.
            # Named as the StatefulSet would name it (prometheus-<prometheus>-db-
            # prometheus-<prometheus>-0), so it uses this one, or Crossplane
            # adopts the one it already created. The XRD forbids shrinking.
            apiVersion: v1
            kind: PersistentVolumeClaim
            metadata:
              name: prometheus-prometheus-db-prometheus-prometheus-0
              namespace: {{ $ns }}
              annotations:
                {{ setResourceNameAnnotation "prometheus-pvc" }}
                # Bound only once the pod is scheduled (WaitForFirstConsumer);
                # the Prometheus' readiness already covers that.
                gotemplating.fn.crossplane.io/ready: "True"
              labels:
                {{- range $k, $v := $labels }}
                {{ $k }}: {{ $v | quote }}
                {{- end }}
            spec:
              accessModes: [ReadWriteOnce]
              {{- with (dig "storage" "storageClass" "" $prom) }}
              storageClassName: {{ . | quote }}
              {{- end }}
              resources:
                requests:
                  storage: {{ dig "storage" "size" "10Gi" $prom | quote }}
            {{- end }}

            {{- if $grafEnabled }}
            ---
            apiVersion: grafana.integreatly.org/v1beta1
            kind: Grafana
            metadata:
              name: grafana
              namespace: {{ $ns }}
              annotations:
                {{ setResourceNameAnnotation "grafana" }}
                gotemplating.fn.crossplane.io/ready: {{ if $grafReady }}"True"{{ else }}"False"{{ end }}
              labels:
                {{- range $k, $v := merge (dict) $labels $scope }}
                {{ $k }}: {{ $v | quote }}
                {{- end }}
            spec:
              config:
                # The portal embeds the dashboards in an iframe.
                security:
                  allow_embedding: "true"
                # Read-only anonymous access so the iframe works without a
                # login. Admin login: Secret grafana-admin-credentials.
                auth.anonymous:
                  enabled: "true"
                  org_role: Viewer
                {{- if $host }}
                server:
                  root_url: {{ printf "%s://%s" $scheme $host | quote }}
                {{- end }}
              {{- if $host }}
              ingress:
                spec:
                  {{- with (dig "className" "" $ingress) }}
                  ingressClassName: {{ . | quote }}
                  {{- end }}
                  rules:
                    - host: {{ $host | quote }}
                      http:
                        paths:
                          - path: /
                            pathType: Prefix
                            backend:
                              service:
                                name: grafana-service
                                port:
                                  number: 3000
                  {{- with (dig "tlsSecretName" "" $ingress) }}
                  tls:
                    - hosts: [{{ $host | quote }}]
                      secretName: {{ . | quote }}
                  {{- end }}
              {{- end }}
            {{- if $promEnabled }}
            ---
            # Named "prometheus": the datasource name the PostgresCluster
            # dashboards are wired to (monitoring.grafanaDashboard.datasourceName).
            apiVersion: grafana.integreatly.org/v1beta1
            kind: GrafanaDatasource
            metadata:
              name: prometheus
              namespace: {{ $ns }}
              annotations:
                {{ setResourceNameAnnotation "grafana-datasource" }}
                gotemplating.fn.crossplane.io/ready: {{ if index $observed "grafana-datasource" }}"True"{{ else }}"False"{{ end }}
              labels:
                {{- range $k, $v := $labels }}
                {{ $k }}: {{ $v | quote }}
                {{- end }}
            spec:
              instanceSelector:
                matchLabels:
                  {{- range $k, $v := $scope }}
                  {{ $k }}: {{ $v | quote }}
                  {{- end }}
              datasource:
                name: prometheus
                type: prometheus
                access: proxy
                url: http://prometheus-operated.{{ $ns }}.svc:9090
                isDefault: true
            {{- end }}
            {{- end }}

            {{- if and $local $promEnabled .remoteWriteHost }}
            ---
            # Only the remote-write path: the Prometheus in the locations
            # push through it. Restrict it with ingress annotations from
            # project-defaults (prometheus.remoteWrite.annotations), e.g. an
            # IP allow-list or client certificates.
            apiVersion: networking.k8s.io/v1
            kind: Ingress
            metadata:
              name: prometheus-remote-write
              namespace: {{ $ns }}
              annotations:
                {{ setResourceNameAnnotation "prometheus-remote-write" }}
                gotemplating.fn.crossplane.io/ready: {{ if index $observed "prometheus-remote-write" }}"True"{{ else }}"False"{{ end }}
                {{- range $k, $v := dig "annotations" (dict) $remoteWrite }}
                {{ $k }}: {{ $v | quote }}
                {{- end }}
              labels:
                {{- range $k, $v := $labels }}
                {{ $k }}: {{ $v | quote }}
                {{- end }}
            spec:
              {{- with (dig "className" "" $remoteWrite) }}
              ingressClassName: {{ . | quote }}
              {{- end }}
              rules:
                - host: {{ .remoteWriteHost | quote }}
                  http:
                    paths:
                      - path: /api/v1/write
                        pathType: Exact
                        backend:
                          service:
                            name: prometheus-operated
                            port:
                              number: 9090
              {{- with (dig "tlsSecretName" "" $remoteWrite) }}
              tls:
                - hosts: [{{ $.remoteWriteHost | quote }}]
                  secretName: {{ . | quote }}
              {{- end }}
            {{- end }}

            {{- range $i, $a := $spec.access | default (list) }}
            ---
            apiVersion: rbac.authorization.k8s.io/v1
            kind: RoleBinding
            metadata:
              name: {{ printf "project-%s-%s" $a.role (sha1sum $a.group | trunc 8) }}
              namespace: {{ $ns }}
              annotations:
                {{ setResourceNameAnnotation (printf "access-%d" $i) }}
                gotemplating.fn.crossplane.io/ready: {{ if index $observed (printf "access-%d" $i) }}"True"{{ else }}"False"{{ end }}
                platform.cndev.nl/group: {{ $a.group | quote }}
              labels:
                {{- range $k, $v := $labels }}
                {{ $k }}: {{ $v | quote }}
                {{- end }}
            roleRef:
              apiGroup: rbac.authorization.k8s.io
              kind: ClusterRole
              name: {{ $a.role }}
            subjects:
              - apiGroup: rbac.authorization.k8s.io
                kind: Group
                name: {{ $a.group | quote }}
            {{- end }}

            {{- /* The quota is for the databases: none on the control plane. */}}
            {{- if and $quota (not $local) }}
            ---
            apiVersion: v1
            kind: ResourceQuota
            metadata:
              name: project
              namespace: {{ $ns }}
              annotations:
                {{ setResourceNameAnnotation "quota" }}
                gotemplating.fn.crossplane.io/ready: {{ if index $observed "quota" }}"True"{{ else }}"False"{{ end }}
              labels:
                {{- range $k, $v := $labels }}
                {{ $k }}: {{ $v | quote }}
                {{- end }}
            spec:
              hard:
                {{- with $quota.cpu }}
                requests.cpu: {{ . | quote }}
                {{- end }}
                {{- with $quota.memory }}
                requests.memory: {{ . | quote }}
                limits.memory: {{ . | quote }}
                {{- end }}
                {{- with $quota.storage }}
                requests.storage: {{ . | quote }}
                {{- end }}
            ---
            # A quota on cpu/memory rejects pods without requests/limits;
            # these defaults keep operator-generated pods (CNPG jobs, Grafana)
            # schedulable.
            apiVersion: v1
            kind: LimitRange
            metadata:
              name: project-defaults
              namespace: {{ $ns }}
              annotations:
                {{ setResourceNameAnnotation "limitrange" }}
                gotemplating.fn.crossplane.io/ready: {{ if index $observed "limitrange" }}"True"{{ else }}"False"{{ end }}
              labels:
                {{- range $k, $v := $labels }}
                {{ $k }}: {{ $v | quote }}
                {{- end }}
            spec:
              limits:
                - type: Container
                  defaultRequest:
                    cpu: 50m
                    memory: 64Mi
                  default:
                    memory: 256Mi
            {{- end }}
            {{- end }}

            {{- /* ---- backup bucket reachability: WAL archiving runs here, so it is
                 checked from here, with this location's keys, every few minutes.
                 .backupCheck = dict endpoint, bucket, image, schedule; empty until
                 the bucket and this location's keys exist. ---- */}}
            {{- $check := .backupCheck | default (dict) }}
            {{- $checkState := dict }}
            {{- if and $check (not $local) }}
            ---
            # This location's S3 keys, copied from backup-s3-<location> on the control plane.
            apiVersion: v1
            kind: Secret
            metadata:
              name: backup-check-s3
              namespace: {{ $ns }}
              annotations:
                {{ setResourceNameAnnotation "backup-check-s3" }}
                gotemplating.fn.crossplane.io/ready: {{ if index $observed "backup-check-s3" }}"True"{{ else }}"False"{{ end }}
                platform.cndev.nl/copy-from: {{ printf "%s/backup-s3-%s" $ns $m.location }}
              labels:
                {{- range $k, $v := $labels }}
                {{ $k }}: {{ $v | quote }}
                {{- end }}
            ---
            # Writes, reads back and deletes platform-check/<location> in the bucket,
            # what WAL archiving (write) and a replica cluster (read) need. The
            # result is the CronJob's last schedule vs. last success; the job's
            # log says why it failed.
            apiVersion: batch/v1
            kind: CronJob
            metadata:
              name: backup-check
              namespace: {{ $ns }}
              annotations:
                {{ setResourceNameAnnotation "backup-check" }}
                gotemplating.fn.crossplane.io/ready: {{ if index $observed "backup-check" }}"True"{{ else }}"False"{{ end }}
              labels:
                {{- range $k, $v := $labels }}
                {{ $k }}: {{ $v | quote }}
                {{- end }}
            spec:
              schedule: {{ $check.schedule | quote }}
              concurrencyPolicy: Forbid
              successfulJobsHistoryLimit: 1
              failedJobsHistoryLimit: 1
              jobTemplate:
                spec:
                  backoffLimit: 0
                  activeDeadlineSeconds: 120
                  template:
                    metadata:
                      labels:
                        {{- range $k, $v := $labels }}
                        {{ $k }}: {{ $v | quote }}
                        {{- end }}
                        platform.cndev.nl/check: backup
                    spec:
                      restartPolicy: Never
                      automountServiceAccountToken: false
                      securityContext:
                        runAsNonRoot: true
                        # Numeric, so the kubelet can verify non-root for images whose
                        # USER is a name (curlimages/curl runs as "curl_user").
                        runAsUser: 65534
                        runAsGroup: 65534
                        seccompProfile:
                          type: RuntimeDefault
                      containers:
                        - name: check
                          image: {{ $check.image | quote }}
                          command: [sh, -c]
                          args:
                            - |
                              set -u
                              key="platform-check/${LOCATION}"
                              url="${S3_ENDPOINT%/}/${S3_BUCKET}/${key}"
                              s3() {
                                method=$1; shift
                                code=$(curl -sS -o /tmp/body -w '%{http_code}' --connect-timeout 10 --max-time 30 \
                                  --aws-sigv4 "aws:amz:${REGION:-us-east-1}:s3" --user "${ACCESS_KEY_ID}:${ACCESS_SECRET_KEY}" \
                                  -H 'x-amz-content-sha256: UNSIGNED-PAYLOAD' -X "$method" "$@" "$url" 2>/tmp/err) \
                                  || { echo "$method $url: $(cat /tmp/err)"; return 1; }
                                case $code in 2??) return 0 ;; esac
                                echo "$method $url: HTTP $code $(sed -n 's:.*<Code>\(.*\)</Code>.*:\1:p' /tmp/body)"
                                return 1
                              }
                              stamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)
                              s3 PUT --data-binary "$stamp" || exit 1
                              s3 GET || exit 1
                              [ "$(cat /tmp/body)" = "$stamp" ] || { echo "GET $url: read back something else than was written"; exit 1; }
                              s3 DELETE || echo "warning: could not delete the test object"
                              echo "ok: wrote, read back and deleted s3://${S3_BUCKET}/${key} via ${S3_ENDPOINT}"
                          env:
                            - name: LOCATION
                              value: {{ $m.location | quote }}
                            - name: S3_ENDPOINT
                              value: {{ $check.endpoint | quote }}
                            - name: S3_BUCKET
                              value: {{ $check.bucket | quote }}
                            {{- range $k := list "ACCESS_KEY_ID" "ACCESS_SECRET_KEY" "REGION" }}
                            - name: {{ $k }}
                              valueFrom:
                                secretKeyRef:
                                  name: backup-check-s3
                                  key: {{ $k }}
                                  {{- if eq $k "REGION" }}
                                  optional: true
                                  {{- end }}
                            {{- end }}
                          resources:
                            requests:
                              cpu: 10m
                              memory: 16Mi
                            limits:
                              memory: 64Mi
                          securityContext:
                            allowPrivilegeEscalation: false
                            readOnlyRootFilesystem: true
                            capabilities:
                              drop: [ALL]
                          volumeMounts:
                            - name: tmp
                              mountPath: /tmp
                      volumes:
                        - name: tmp
                          emptyDir:
                            sizeLimit: 1Mi
            {{- /* Unknown until the first run; Checking while one runs after a failure. */}}
            {{- $cj := dig "backup-check" "resource" "status" (dict) $observed }}
            {{- $scheduled := $cj.lastScheduleTime | default "" }}
            {{- $succeeded := $cj.lastSuccessfulTime | default "" }}
            {{- $state := "Pending" }}
            {{- if and $succeeded (not (lt $succeeded $scheduled)) }}{{ $state = "Reachable" }}
            {{- else if $cj.active }}{{ $state = "Checking" }}
            {{- else if $scheduled }}{{ $state = "Unreachable" }}{{ end }}
            {{- $checkState = dict "state" $state }}
            {{- with $scheduled }}{{ $_ := set $checkState "lastCheckTime" . }}{{ end }}
            {{- with $succeeded }}{{ $_ := set $checkState "lastSuccessTime" . }}{{ end }}
            {{- end }}

            {{- $waiting := list }}
            {{- if not $nsReady }}{{ $waiting = append $waiting "namespace" }}{{ end }}
            {{- if and $promEnabled (not $promReady) }}{{ $waiting = append $waiting "Prometheus" }}{{ end }}
            {{- if and $grafEnabled (not $grafReady) }}{{ $waiting = append $waiting "Grafana" }}{{ end }}
            {{- /* Read back by the top level (include only returns text). */}}
            ---
            kind: LocationStatus
            waiting: {{ toJson $waiting }}
            backupCheck: {{ toJson $checkState }}
            {{- end }}

            {{- /* ================= top level ================= */}}
            {{- $xr := .observed.composite.resource }}
            {{- $spec := $xr.spec | default (dict) }}
            {{- $name := $xr.metadata.name }}
            {{- $ns := $name }}
            {{- $observed := .observed.resources | default (dict) }}
            {{- $labels := dict "app.kubernetes.io/managed-by" "crossplane" "app.kubernetes.io/part-of" "cnpg-platform" "platform.cndev.nl/project" $name }}

            {{- /* ---- cluster-wide settings: EnvironmentConfig project-defaults ---- */}}
            {{- /* function-go-templating hands namespaced requirements (COSI's Secrets)
                 back in .requiredResources only, and cluster-scoped ones in both. */}}
            {{- $extra := merge (dict) (.extraResources | default (dict)) (.requiredResources | default (dict)) }}
            {{- $env := dict }}
            {{- with (index $extra "defaults") }}
            {{- with .items }}{{ $env = dig "resource" "data" (dict) (first .) }}{{ end }}
            {{- end }}
            {{- $siteLocations := list }}
            {{- range $site := list "protected" "recovery" }}{{ with dig "locations" $site "" $spec }}{{ $siteLocations = append $siteLocations . }}{{ end }}{{ end }}

            {{- /* ---- backup bucket (COSI); the classes need project-defaults, so this
                 settles on the second round of extra resources ---- */}}
            {{- $pb := $spec.backup | default (dict) }}
            {{- $cosi := dig "backup" "cosi" (dict) $env }}
            {{- /* The project's own BucketClass (Retain) unless spec.backup names one;
                 project-defaults bucketClassName is the fallback without a driverName. */}}
            {{- $ownClass := and (eq ($pb.bucketClassName | default "") "") (ne ($cosi.driverName | default "") "") }}
            {{- $bucketClass := $pb.bucketClassName | default ($cosi.bucketClassName | default "") }}
            {{- /* COSI names the bucket <class><claim UID> (36 characters) and S3 allows 63,
                 so the class gets 27: project-<name>-backups while it fits, otherwise
                 prj-<first 16 of name>-<6 hex of sha256(name)>. */}}
            {{- if $ownClass }}
            {{- $bucketClass = printf "project-%s-backups" $name }}
            {{- if gt (len $bucketClass) 27 }}
            {{- $bucketClass = printf "prj-%s-%s" ($name | trunc 16 | trimSuffix "-") (sha256sum $name | trunc 6) }}
            {{- end }}
            {{- end }}
            {{- $accessClass := $pb.bucketAccessClassName | default ($cosi.bucketAccessClassName | default "") }}
            {{- $bucketOn := and (dig "bucket" true $pb) (ne $bucketClass "") (ne $accessClass "") }}
            ---
            apiVersion: meta.gotemplating.fn.crossplane.io/v1alpha1
            kind: ExtraResources
            requirements:
              defaults:
                apiVersion: apiextensions.crossplane.io/v1beta1
                kind: EnvironmentConfig
                matchName: project-defaults
              {{- range $siteLocations }}
              location-{{ . }}:
                apiVersion: platform.cndev.nl/v1alpha1
                kind: Location
                matchName: {{ . }}
              {{- if $bucketOn }}
              # What COSI wrote for this location's BucketAccess.
              cosi-{{ . }}:
                apiVersion: v1
                kind: Secret
                namespace: {{ $ns }}
                matchName: cosi-backups-{{ . }}
              {{- end }}
              {{- end }}
              {{- if $bucketOn }}
              # The PostgresClusters' backup stores, for the inventory of the bucket.
              backup-stores:
                apiVersion: kubernetes.m.crossplane.io/v1alpha1
                kind: Object
                namespace: {{ $ns }}
                matchLabels:
                  cnpg.cndev.nl/backup-store: "true"
              {{- end }}
            {{- $obs := $spec.observability | default (dict) }}
            {{- $promEnabled := dig "prometheus" "enabled" true $obs }}
            {{- $grafEnabled := dig "grafana" "enabled" true $obs }}
            {{- $ingress := dig "grafana" "ingress" (dict) $env }}
            {{- $hostTemplate := dig "hostTemplate" "" $ingress }}
            {{- $host := "" }}
            {{- if and $grafEnabled (dig "grafana" "ingress" true $obs) $hostTemplate }}{{ $host = replace "{project}" $name $hostTemplate }}{{ end }}
            {{- $scheme := dig "scheme" "http" $ingress }}
            {{- $scope := dict "dashboards.paas.cndev.nl/scope" $ns }}

            {{- /* ---- observed, normalised: an Object stands for the object it manages ---- */}}
            {{- $live := dict }}
            {{- range $k, $v := $observed }}
            {{- $r := $v.resource | default (dict) }}
            {{- if and (eq ($r.kind | default "") "Object") (hasPrefix "kubernetes.m.crossplane.io/" ($r.apiVersion | default "")) }}
            {{- with dig "status" "atProvider" "manifest" (dict) $r }}{{ $_ := set $live $k (dict "resource" .) }}{{ end }}
            {{- else }}
            {{- $_ := set $live $k $v }}
            {{- end }}
            {{- end }}

            {{- /* ---- members: the control plane ("local"), then the protected and recovery locations ---- */}}
            {{- $members := list (dict "location" "local" "site" "" "prefix" "") }}
            {{- range $site := list "protected" "recovery" }}
            {{- with dig "locations" $site "" $spec }}{{ $members = append $members (dict "location" . "site" $site "prefix" (printf "location-%s-" .)) }}{{ end }}
            {{- end }}
            {{- $hasRemote := gt (len $members) 1 }}
            {{- $remoteWrite := dig "prometheus" "remoteWrite" (dict) $env }}
            {{- $rwHost := "" }}
            {{- with dig "hostTemplate" "" $remoteWrite }}{{ $rwHost = replace "{project}" $name . }}{{ end }}
            {{- $rwUrl := "" }}
            {{- if and $hasRemote $promEnabled $rwHost }}{{ $rwUrl = printf "%s://%s/api/v1/write" (dig "scheme" "https" $remoteWrite) $rwHost }}{{ end }}
            {{- /* ---- the Location objects of the other locations ---- */}}
            {{- $registered := dict }}
            {{- $unschedulable := list }}
            {{- range $m := rest $members }}
            {{- with dig (printf "location-%s" $m.location) "items" (list) $extra }}
            {{- $loc := (first .).resource }}
            {{- $_ := set $registered $m.location $loc }}
            {{- if eq (dig "spec" "schedulable" true $loc) false }}{{ $unschedulable = append $unschedulable $m.location }}{{ end }}
            {{- end }}
            {{- end }}
            {{- /* Objects live in the project namespace here: none before it exists. */}}
            {{- $hubNs := index $live "namespace" }}
            {{- /* ---- what each location's backup check needs: the bucket, and its keys
                 unpacked (backup-s3-<location>, below) ---- */}}
            {{- $checks := dict }}
            {{- $checkCfg := dig "backup" "check" (dict) $env }}
            {{- $bucketName := dig "backup-bucket" "resource" "status" "bucketName" "" $observed }}
            {{- if and $bucketOn $hubNs (dig "enabled" true $checkCfg) $bucketName }}
            {{- range $loc := $siteLocations }}
            {{- with dig (printf "cosi-%s" $loc) "items" (list) $extra }}
            {{- $s3 := dig "spec" "secretS3" (dict) (dig "resource" "data" "BucketInfo" "" (first .) | b64dec | fromJson) }}
            {{- if and $s3.endpoint $s3.accessKeyID $s3.accessSecretKey }}
            {{- $_ := set $checks $loc (dict "endpoint" $s3.endpoint "bucket" $bucketName "image" (dig "image" "curlimages/curl:8.16.0" $checkCfg) "schedule" (dig "schedule" "*/5 * * * *" $checkCfg)) }}
            {{- end }}
            {{- end }}
            {{- end }}
            {{- end }}

            {{- /* ================= emit every location's objects ================= */}}
            {{- $statuses := list }}
            {{- range $m := $members }}
            {{- $mobs := dict }}
            {{- range $k, $v := $live }}{{ if hasPrefix $m.prefix $k }}{{ $_ := set $mobs (trimPrefix $m.prefix $k) $v }}{{ end }}{{ end }}
            {{- $_ := set $m "observed" $mobs }}
            {{- $remote := ne $m.location "local" }}
            {{- $docs := include "location" (dict "xr" $xr "env" $env "member" $m "remoteWriteUrl" $rwUrl "remoteWriteHost" $rwHost "unschedulable" $unschedulable "backupBucket" $bucketOn "backupCheck" (index $checks $m.location)) }}
            {{- range $doc := splitList "\n---\n" (printf "\n%s" $docs) }}
            {{- $obj := fromYaml $doc }}
            {{- if and $obj (eq ($obj.kind | default "") "LocationStatus") }}
            {{- $waiting := $obj.waiting | default (list) }}
            {{- if and $remote (not $hubNs) }}{{ $waiting = list "the project namespace on the control plane" }}{{ end }}
            {{- $problem := "" }}
            {{- if and $remote (not (hasKey $registered $m.location)) }}{{ $problem = printf "no Location %s; register the cluster first" $m.location }}{{ end }}
            {{- $statuses = append $statuses (dict "location" $m.location "site" $m.site "waiting" $waiting "problem" $problem "backupCheck" ($obj.backupCheck | default (dict))) }}
            {{- else if and $obj (hasKey $obj "kind") (or (not $remote) $hubNs) }}
            {{- $ann := $obj.metadata.annotations }}
            {{- $key := printf "%s%s" $m.prefix (get $ann "gotemplating.fn.crossplane.io/composition-resource-name") }}
            {{- if not $remote }}
            {{- $_ := set $ann "gotemplating.fn.crossplane.io/composition-resource-name" $key }}
            ---
            {{ toYaml $obj }}
            {{- else }}
            {{- $ready := get $ann "gotemplating.fn.crossplane.io/ready" }}
            {{- $orphan := eq (get $ann "platform.cndev.nl/orphan") "true" }}
            {{- $copyFrom := get $ann "platform.cndev.nl/copy-from" }}
            {{- range $a := list "gotemplating.fn.crossplane.io/composition-resource-name" "gotemplating.fn.crossplane.io/ready" "platform.cndev.nl/orphan" "platform.cndev.nl/copy-from" }}{{ $_ := unset $ann $a }}{{ end }}
            {{- if not $ann }}{{ $_ := unset $obj.metadata "annotations" }}{{ end }}
            ---
            apiVersion: kubernetes.m.crossplane.io/v1alpha1
            kind: Object
            metadata:
              name: {{ $key }}
              namespace: {{ $ns }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: {{ $key }}
                gotemplating.fn.crossplane.io/ready: {{ $ready | quote }}
                platform.cndev.nl/location: {{ $m.location }}
              labels:
                {{- range $k, $v := $labels }}
                {{ $k }}: {{ $v | quote }}
                {{- end }}
            spec:
              providerConfigRef:
                kind: ClusterProviderConfig
                name: {{ $m.location }}
              watch: true
              {{- if $orphan }}
              # Never delete the namespace in another location: databases may
              # still run there (no Delete in the management policies).
              managementPolicies: [Observe, Create, Update, LateInitialize]
              {{- end }}
              {{- with $copyFrom }}
              {{- $from := splitList "/" . }}
              # The Secret's data comes from the control plane, never through this spec.
              references:
                {{- range $field := list "data" "type" }}
                - patchesFrom:
                    apiVersion: v1
                    kind: Secret
                    name: {{ last $from }}
                    namespace: {{ first $from }}
                    fieldPath: {{ $field }}
                {{- end }}
              {{- end }}
              forProvider:
                manifest:
                  {{- toYaml $obj | nindent 6 }}
            {{- end }}
            {{- end }}
            {{- end }}
            {{- end }}

            {{- /* ---- the backup bucket: claim, an access per location, its keys unpacked ---- */}}
            {{- $bucket := dict }}
            {{- if and $bucketOn $ownClass }}
            ---
            # Retain: deleting the Project (or the claim) leaves the bucket and its
            # backups; remove them in the object store when they're no longer needed.
            apiVersion: objectstorage.k8s.io/v1alpha1
            kind: BucketClass
            metadata:
              name: {{ $bucketClass }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: backup-bucketclass
                gotemplating.fn.crossplane.io/ready: {{ if index $observed "backup-bucketclass" }}"True"{{ else }}"False"{{ end }}
              labels:
                {{- range $k, $v := $labels }}
                {{ $k }}: {{ $v | quote }}
                {{- end }}
            driverName: {{ $cosi.driverName | quote }}
            deletionPolicy: Retain
            {{- with $cosi.parameters }}
            parameters:
              {{- range $k, $v := . }}
              {{ $k }}: {{ $v | quote }}
              {{- end }}
            {{- end }}
            {{- end }}
            {{- if $bucketOn }}{{ $bucket = dict "ready" false "namespace" $ns }}{{ end }}
            {{- $ungranted := list }}
            {{- /* The rest lives in the project namespace: none before it exists. */}}
            {{- if and $bucketOn $hubNs }}
            {{- $claim := dig "backup-bucket" "resource" (dict) $observed }}
            {{- $bucketName := dig "status" "bucketName" "" $claim }}
            {{- $bucketReady := and (dig "status" "bucketReady" false $claim) (ne $bucketName "") }}
            {{- $credentials := dict }}
            {{- $endpoint := "" }}
            {{- $region := "" }}
            ---
            apiVersion: objectstorage.k8s.io/v1alpha1
            kind: BucketClaim
            metadata:
              name: backups
              namespace: {{ $ns }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: backup-bucket
                gotemplating.fn.crossplane.io/ready: {{ if $bucketReady }}"True"{{ else }}"False"{{ end }}
              labels:
                {{- range $k, $v := $labels }}
                {{ $k }}: {{ $v | quote }}
                {{- end }}
            spec:
              bucketClassName: {{ $bucketClass | quote }}
              protocols: [S3]
            {{- /* One grant at a time: concurrent grants race on the Bucket's finalizer,
                 and a grant retried after a conflict fails for good (the driver's
                 CreateUser isn't idempotent), leaving the access unready forever. */}}
            {{- $granting := false }}
            {{- range $loc := $siteLocations }}
            {{- $access := dig (printf "backup-access-%s" $loc) "resource" (dict) $observed }}
            {{- $granted := dig "status" "accessGranted" false $access }}
            {{- /* The COSI sidecar refuses an IAM-type access class without a
                 ServiceAccount; nothing runs as it (the locations use the keys). */}}
            ---
            apiVersion: v1
            kind: ServiceAccount
            metadata:
              name: backups-{{ $loc }}
              namespace: {{ $ns }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: backup-sa-{{ $loc }}
                gotemplating.fn.crossplane.io/ready: "True"
                platform.cndev.nl/location: {{ $loc }}
              labels:
                {{- range $k, $v := $labels }}
                {{ $k }}: {{ $v | quote }}
                {{- end }}
            automountServiceAccountToken: false
            {{- if not $granted }}{{ $ungranted = append $ungranted $loc }}{{ end }}
            {{- if or $access (not $granting) }}
            {{- if not $granted }}{{ $granting = true }}{{ end }}
            ---
            apiVersion: objectstorage.k8s.io/v1alpha1
            kind: BucketAccess
            metadata:
              name: backups-{{ $loc }}
              namespace: {{ $ns }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: backup-access-{{ $loc }}
                gotemplating.fn.crossplane.io/ready: {{ if $granted }}"True"{{ else }}"False"{{ end }}
                platform.cndev.nl/location: {{ $loc }}
              labels:
                {{- range $k, $v := $labels }}
                {{ $k }}: {{ $v | quote }}
                {{- end }}
            spec:
              bucketClaimName: backups
              bucketAccessClassName: {{ $accessClass | quote }}
              credentialsSecretName: cosi-backups-{{ $loc }}
              serviceAccountName: backups-{{ $loc }}
              protocol: S3
            {{- end }}
            {{- /* COSI's Secret holds one BucketInfo JSON document; CNPG needs the keys
                 as Secret keys of their own. */}}
            {{- with dig (printf "cosi-%s" $loc) "items" (list) $extra }}
            {{- $info := dig "resource" "data" "BucketInfo" "" (first .) | b64dec | fromJson }}
            {{- $s3 := dig "spec" "secretS3" (dict) $info }}
            {{- if and $s3.accessKeyID $s3.accessSecretKey }}
            {{- $endpoint = $s3.endpoint | default "" }}
            {{- $region = $s3.region | default "" }}
            {{- $_ := set $credentials $loc (printf "backup-s3-%s" $loc) }}
            ---
            apiVersion: v1
            kind: Secret
            metadata:
              name: backup-s3-{{ $loc }}
              namespace: {{ $ns }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: backup-s3-{{ $loc }}
                gotemplating.fn.crossplane.io/ready: "True"
                platform.cndev.nl/location: {{ $loc }}
              labels:
                {{- range $k, $v := $labels }}
                {{ $k }}: {{ $v | quote }}
                {{- end }}
            type: Opaque
            data:
              ACCESS_KEY_ID: {{ $s3.accessKeyID | b64enc }}
              ACCESS_SECRET_KEY: {{ $s3.accessSecretKey | b64enc }}
              {{- with $s3.region }}
              REGION: {{ . | b64enc }}
              {{- end }}
            {{- end }}
            {{- end }}
            {{- end }}
            {{- $bucket = dict "ready" (and $bucketReady (eq (len $credentials) (len $siteLocations)) (ne $endpoint "")) "bucket" $bucketName "endpoint" $endpoint "region" $region "namespace" $ns "credentials" $credentials }}
            {{- end }}

            {{- /* ---- inventory of the bucket's backup folders: the last status's
                 entries (inactive unless still seen), updated from the
                 PostgresClusters' ObjectStores that archive to this bucket ---- */}}
            {{- $servers := dict }}
            {{- range dig "status" "backup" "servers" (list) $xr }}{{ $_ := set $servers .serverName (merge (dict "active" false) (omit . "active")) }}{{ end }}
            {{- if $bucket.bucket }}
            {{- $bucketPath := printf "s3://%s/barman" $bucket.bucket }}
            {{- range dig "backup-stores" "items" (list) $extra }}
            {{- $o := .resource }}
            {{- $os := dig "status" "atProvider" "manifest" (dict) $o }}
            {{- $ann := dig "metadata" "annotations" (dict) $os }}
            {{- $srv := get $ann "cnpg.cndev.nl/server-name" }}
            {{- if and $srv (eq (dig "spec" "configuration" "destinationPath" "" $os) $bucketPath) }}
            {{- $window := dig "status" "serverRecoveryWindow" $srv (dict) $os }}
            {{- $e := get $servers $srv | default (dict) }}
            {{- $e = merge (dict "serverName" $srv "active" true "cluster" (dig "metadata" "labels" "cnpg.cndev.nl/postgrescluster" "" $o) "location" (dig "metadata" "annotations" "platform.cndev.nl/location" "" $o) "postgresVersion" (int (get $ann "cnpg.cndev.nl/postgres-version" | default 0)) "database" (get $ann "cnpg.cndev.nl/database") "owner" (get $ann "cnpg.cndev.nl/database-owner")) $e }}
            {{- with $window.firstRecoverabilityPoint }}{{ $_ := set $e "firstRecoverabilityPoint" . }}{{ end }}
            {{- with $window.lastSuccessfulBackupTime }}{{ $_ := set $e "lastSuccessfulBackup" . }}{{ end }}
            {{- $_ := set $servers $srv $e }}
            {{- end }}
            {{- end }}
            {{- end }}

            {{- /* ---- a ClusterUsage per registered location: no deleting a Location a Project uses ---- */}}
            {{- range $loc := keys $registered | sortAlpha }}
            ---
            apiVersion: protection.crossplane.io/v1beta1
            kind: ClusterUsage
            metadata:
              name: project-{{ $name }}-location-{{ $loc }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: usage-location-{{ $loc }}
                gotemplating.fn.crossplane.io/ready: "True"
              labels:
                {{- range $k, $v := $labels }}
                {{ $k }}: {{ $v | quote }}
                {{- end }}
            spec:
              of:
                apiVersion: platform.cndev.nl/v1alpha1
                kind: Location
                resourceRef:
                  name: {{ $loc }}
              reason: {{ printf "Project %s runs databases in this location; delete the Project first" $name | quote }}
            {{- end }}

            {{- /* ================= XR status ================= */}}
            {{- $waiting := list }}
            {{- $problems := list }}
            {{- range $st := $statuses }}
            {{- with $st.problem }}{{ $problems = append $problems . }}{{ end }}
            {{- if eq $st.location "local" }}{{ $waiting = concat $waiting $st.waiting }}
            {{- else }}{{ range $w := $st.waiting }}{{ $waiting = append $waiting (printf "%s in %s" $w $st.location) }}{{ end }}{{ end }}
            {{- end }}
            {{- if and $bucketOn (not $bucket.ready) }}{{ $waiting = append $waiting "the backup bucket (COSI)" }}
            {{- else if $ungranted }}{{ $waiting = append $waiting (printf "COSI to grant backup bucket access in %s" (join ", " $ungranted)) }}{{ end }}
            {{- $ready := not (or $waiting $problems) }}
            {{- $msg := printf "Project %s is ready" $name }}
            {{- if $problems }}{{ $msg = join "; " $problems }}
            {{- else if not $ready }}{{ $msg = printf "Waiting for %s" (join ", " $waiting) }}{{ end }}
            {{- if and $ready $hasRemote $promEnabled (not $rwUrl) }}{{ $msg = printf "Project %s is ready; metrics stay in its locations and Grafana shows none (no prometheus.remoteWrite in project-defaults)" $name }}{{ end }}
            ---
            apiVersion: platform.cndev.nl/v1alpha1
            kind: Project
            status:
              ready: {{ $ready }}
              message: {{ $msg | quote }}
              namespace: {{ $ns }}
              locations:
                {{- if not $hasRemote }} []{{ end }}
                {{- range $st := rest $statuses }}
                - location: {{ $st.location }}
                  site: {{ $st.site }}
                  ready: {{ not (or $st.waiting $st.problem) }}
                  message: {{ $st.problem | default (ternary "ready" (printf "waiting for %s" (join ", " $st.waiting)) (not $st.waiting)) | quote }}
                {{- end }}
              {{- if $bucket }}
              backup:
                ready: {{ $bucket.ready }}
                {{- with $bucket.bucket }}
                bucket: {{ . | quote }}
                destinationPath: {{ printf "s3://%s/barman" . | quote }}
                {{- end }}
                {{- with $bucket.endpoint }}
                endpoint: {{ . | quote }}
                {{- end }}
                {{- with $bucket.region }}
                region: {{ . | quote }}
                {{- end }}
                namespace: {{ $bucket.namespace }}
                {{- with $bucket.credentials }}
                credentials:
                  {{- range $loc, $secret := . }}
                  {{ $loc }}: {{ $secret }}
                  {{- end }}
                {{- end }}
                {{- /* Informational: an unreachable bucket doesn't make the Project unready. */}}
                {{- $reach := list }}
                {{- range $st := rest $statuses }}{{ with $st.backupCheck }}{{ $reach = append $reach (merge (dict "location" $st.location) .) }}{{ end }}{{ end }}
                {{- with $reach }}
                reachability:
                  {{- toYaml . | nindent 18 }}
                {{- end }}
                {{- if $servers }}
                servers:
                  {{- range $k := keys $servers | sortAlpha }}
                  - {{ toYaml (get $servers $k) | nindent 8 | trim }}
                  {{- end }}
                {{- end }}
              {{- end }}
              {{- if $promEnabled }}
              prometheus:
                url: http://prometheus-operated.{{ $ns }}.svc:9090
                {{- with $rwUrl }}
                remoteWriteUrl: {{ . | quote }}
                {{- end }}
              {{- end }}
              {{- if $grafEnabled }}
              grafana:
                {{- if $host }}
                url: {{ printf "%s://%s" $scheme $host | quote }}
                {{- end }}
                internalUrl: http://grafana-service.{{ $ns }}.svc:3000
                adminSecret: grafana-admin-credentials
                instanceSelector:
                  {{- range $k, $v := $scope }}
                  {{ $k }}: {{ $v | quote }}
                  {{- end }}
              {{- end }}
            ---
            apiVersion: meta.gotemplating.fn.crossplane.io/v1alpha1
            kind: ClaimConditions
            conditions:
              - type: ObservabilityReady
                status: {{ if $ready }}"True"{{ else }}"False"{{ end }}
                reason: {{ if $ready }}Available{{ else }}Provisioning{{ end }}
                message: {{ $msg | quote }}
                target: Composite
