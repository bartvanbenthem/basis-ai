# Project: a cluster-scoped Crossplane v2 composite resource. One Project is
# one namespace, pre-staged with everything a team needs before it deploys a
# PostgresCluster there: a Prometheus that scrapes the namespace's
# PodMonitors/PrometheusRules, a Grafana (+ "prometheus" datasource) that
# imports its GrafanaDashboards, RoleBindings for the team's groups and an
# optional quota.
#
# Cluster-scoped because it creates the Namespace; the Project name *is* the
# namespace name. The labels on that namespace are what the PostgresCluster
# composition already keys on (dashboards.paas.cndev.nl/scope=<namespace>), so
# PostgresClusters need no changes to land in a Project's Grafana.
#
# Cluster-wide settings (Grafana ingress domain, where kube-prometheus-stack
# lives) come from the EnvironmentConfig "project-defaults", not from each
# Project. See ../../README.md.
#
# Locations: the platform's control plane (where this API, the portal and
# the PostgresCluster objects live) runs no databases. A Project has a
# protected location, where its databases run, and optionally a recovery
# location, where PostgresClusters with geoReplication keep a replica cluster
# ready to take over. Both get the namespace, RoleBindings and quota, plus a
# Prometheus that forwards its metrics to the project's Prometheus on the
# control plane, so the one Grafana shows databases wherever they run.
apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: projects.platform.cndev.nl
spec:
  group: platform.cndev.nl
  scope: Cluster
  names:
    kind: Project
    plural: projects
    shortNames: [proj]
    categories: [crossplane, cnpg]
  defaultCompositionRef:
    name: project
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      additionalPrinterColumns:
        - name: Owner
          type: string
          jsonPath: .spec.owner
        - name: Grafana
          type: string
          jsonPath: .status.grafana.url
        - name: Protected
          type: string
          jsonPath: .spec.locations.protected
        - name: Recovery
          type: string
          jsonPath: .spec.locations.recovery
        - name: Deletion-Protection
          type: boolean
          jsonPath: .spec.deletionProtection
          priority: 1
        # Crossplane appends SYNCED, READY, COMPOSITION and AGE itself.
      schema:
        openAPIV3Schema:
          type: object
          description: A team's namespace with its own Prometheus and Grafana, ready for PostgresClusters.
          x-kubernetes-validations:
            # The name becomes the namespace, the Grafana host
            # (grafana-<name>.<domain>) and part of a ClusterRoleBinding name.
            - rule: "self.metadata.name.matches('^[a-z]([-a-z0-9]{0,38}[a-z0-9])?$')"
              message: Project names are lowercase letters, digits and "-", start with a letter, max 40 characters
            - rule: "!self.metadata.name.startsWith('kube-') && !(self.metadata.name in ['default', 'projects', 'locations', 'buckets', 'volumes', 'crossplane-system', 'cnpg-system', 'cnpg-locations', 'cert-manager'])"
              message: this name is reserved for a system namespace
            # The portal names catalog entities <namespace>--<cluster> for
            # databases and <project> for projects; this keeps them apart.
            - rule: "!self.metadata.name.contains('--')"
              message: Project names can't contain "--"
          required: [spec]
          properties:
            spec:
              type: object
              required: [locations]
              properties:
                owner:
                  type: string
                  description: Backstage group that owns the project (bare name, e.g. team-payments). Set as the backstage.io/owner label on the namespace.
                  pattern: '^([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9]$'
                  maxLength: 63
                description:
                  type: string
                  maxLength: 200
                locations:
                  type: object
                  description: >-
                    Locations (Kubernetes clusters registered with the platform) the project's
                    databases run in. The control plane itself runs none.
                  required: [protected]
                  x-kubernetes-validations:
                    - rule: "self.protected == oldSelf.protected"
                      message: locations.protected can't be changed; its databases run there
                    - rule: "!has(oldSelf.recovery) || (has(self.recovery) && self.recovery == oldSelf.recovery)"
                      message: locations.recovery can be added, but not changed or removed; replica clusters run there
                    - rule: "!has(self.recovery) || self.recovery != self.protected"
                      message: the recovery location must be another location than the protected one
                  properties:
                    protected:
                      type: string
                      description: Where the project's databases run (their primary, normally).
                      pattern: '^[a-z]([-a-z0-9]{0,38}[a-z0-9])?$'
                    recovery:
                      type: string
                      description: >-
                        Where PostgresClusters with geoReplication keep a replica cluster, which
                        can take over as primary. Optional; can be added later.
                      pattern: '^[a-z]([-a-z0-9]{0,38}[a-z0-9])?$'
                backup:
                  type: object
                  default: {}
                  description: >-
                    An object storage bucket for the project's database backups, provisioned
                    through COSI (Container Object Storage Interface) on the control plane, with
                    credentials of its own for each location, in the project namespace. PostgresClusters with backups and no
                    destinationPath of their own use it, which is what geo replication needs: both
                    sites archive to and recover from the same bucket. The COSI classes come from
                    project-defaults (backup.cosi) unless set here.
                  properties:
                    bucket:
                      type: boolean
                      description: Provision the bucket (only when a BucketClass and BucketAccessClass are known).
                      default: true
                    bucketClassName:
                      type: string
                      description: >-
                        An existing COSI BucketClass to use instead of the project's own
                        (project-<name>-backups, or prj-<first 16 of name>-<hash> for a
                        name over 11 characters, deletionPolicy Retain, driver from
                        project-defaults). Use one with deletionPolicy Retain: a Delete class
                        deletes the bucket, and every backup in it, with the Project.
                      x-kubernetes-validations:
                        - rule: self == oldSelf
                          message: bucketClassName can't change; it would provision a new, empty bucket
                    bucketAccessClassName:
                      type: string
                      description: >-
                        COSI BucketAccessClass. Its driver must hand out S3 keys (the locations use them,
                        not a ServiceAccount on the control plane).
                deletionProtection:
                  type: boolean
                  description: >-
                    While true, the API server refuses to delete this Project (and its
                    namespace, which would take every database in it along). Set to false
                    first to delete the project on purpose.
                  default: true
                access:
                  type: array
                  description: >-
                    Kubernetes groups (from your IdP) that get a RoleBinding in the namespace, on the
                    control plane (to manage PostgresClusters) and in each location (to see what runs there).
                  maxItems: 20
                  items:
                    type: object
                    required: [group, role]
                    properties:
                      group:
                        type: string
                        minLength: 1
                      role:
                        type: string
                        description: Built-in ClusterRole to bind. edit and admin include PostgresClusters.
                        enum: [admin, edit, view]
                quota:
                  type: object
                  description: >-
                    Caps on what the namespace may request in total, in each location. Also adds a LimitRange
                    with default requests, which a ResourceQuota on cpu/memory needs for
                    pods that don't set their own.
                  properties:
                    cpu:
                      type: string
                      description: Total CPU requests, e.g. "8".
                      pattern: '^[0-9]+(\.[0-9]+)?m?$'
                    memory:
                      type: string
                      description: Total memory requests and limits, e.g. 32Gi.
                      pattern: '^[0-9]+(Mi|Gi|Ti)$'
                    storage:
                      type: string
                      description: Total PVC storage requests, e.g. 200Gi.
                      pattern: '^[0-9]+(Mi|Gi|Ti)$'
                observability:
                  type: object
                  default: {}
                  properties:
                    prometheus:
                      type: object
                      default: {}
                      description: >-
                        Prometheus in each location that scrapes every PodMonitor and PrometheusRule in
                        the namespace there, and one on the control plane that receives their samples
                        (remote write) for Grafana. Settings apply to all of them.
                      properties:
                        enabled:
                          type: boolean
                          default: true
                        retention:
                          type: string
                          default: 7d
                          pattern: '^[0-9]+(h|d|w|y)$'
                        storage:
                          type: object
                          default: {}
                          x-kubernetes-validations:
                            - rule: "!has(self.size) || !has(oldSelf.size) || quantity(self.size).compareTo(quantity(oldSelf.size)) >= 0"
                              message: the Prometheus volume can grow but not shrink
                            - rule: "has(self.storageClass) == has(oldSelf.storageClass) && (!has(self.storageClass) || self.storageClass == oldSelf.storageClass)"
                              message: storageClass cannot be changed after creation
                          properties:
                            size:
                              type: string
                              default: 10Gi
                              pattern: '^[0-9]+(Mi|Gi|Ti)$'
                            storageClass:
                              type: string
                        resources:
                          type: object
                          default: {}
                          properties:
                            requests:
                              type: object
                              default: {}
                              properties:
                                cpu:
                                  type: string
                                  default: 100m
                                memory:
                                  type: string
                                  default: 512Mi
                            limits:
                              type: object
                              default: {}
                              properties:
                                memory:
                                  type: string
                                  default: 2Gi
                    grafana:
                      type: object
                      default: {}
                      description: >-
                        Grafana that imports the namespace's GrafanaDashboards, with a
                        "prometheus" datasource pointing at the project's Prometheus,
                        anonymous Viewer access and embedding allowed (for the portal).
                      properties:
                        enabled:
                          type: boolean
                          default: true
                        ingress:
                          type: boolean
                          description: Expose Grafana through the ingress configured in the project-defaults EnvironmentConfig.
                          default: true
            status:
              type: object
              properties:
                ready:
                  type: boolean
                message:
                  type: string
                namespace:
                  type: string
                locations:
                  type: array
                  description: Per location (protected first), whether its namespace and Prometheus are ready.
                  items:
                    type: object
                    properties:
                      location:
                        type: string
                      site:
                        type: string
                        description: protected or recovery.
                      ready:
                        type: boolean
                      message:
                        type: string
                backup:
                  type: object
                  description: The project's backup bucket; unset without one.
                  properties:
                    ready:
                      type: boolean
                      description: Provisioned, and credentials for every location are in place.
                    bucket:
                      type: string
                      description: Bucket name in the object store.
                    endpoint:
                      type: string
                    region:
                      type: string
                    destinationPath:
                      type: string
                      description: Where PostgresClusters using the bucket archive to (Barman Cloud destinationPath).
                    namespace:
                      type: string
                      description: Namespace on the control plane with the bucket's COSI objects and credentials (the project's).
                    credentials:
                      type: object
                      description: Per location, the Secret in that namespace with its S3 keys (ACCESS_KEY_ID, ACCESS_SECRET_KEY, REGION).
                      additionalProperties:
                        type: string
                    reachability:
                      type: array
                      description: >-
                        Per location, whether it reaches the bucket: a CronJob there (backup-check in
                        the project namespace) writes, reads back and deletes platform-check/<location>
                        with that location's keys every few minutes. Its last failed job's log says why.
                      items:
                        type: object
                        properties:
                          location:
                            type: string
                          state:
                            type: string
                            description: Pending (no check yet), Reachable, Unreachable (the last check failed) or Checking (one runs after a failure).
                          lastCheckTime:
                            type: string
                          lastSuccessTime:
                            type: string
                    servers:
                      type: array
                      description: >-
                        The backup folders in the bucket (Barman server names), one per PostgresCluster
                        site that archives there. Entries stay after their cluster is deleted
                        (active false): the bucket keeps the backups, and a new PostgresCluster can
                        restore from them (spec.restore.source.serverName).
                      items:
                        type: object
                        properties:
                          serverName:
                            type: string
                          cluster:
                            type: string
                            description: The PostgresCluster that archives (or archived) to it.
                          location:
                            type: string
                          active:
                            type: boolean
                            description: Whether that cluster still archives to it.
                          postgresVersion:
                            type: integer
                          database:
                            type: string
                          owner:
                            type: string
                          firstRecoverabilityPoint:
                            type: string
                          lastSuccessfulBackup:
                            type: string
                prometheus:
                  type: object
                  properties:
                    url:
                      type: string
                      description: In-cluster URL.
                    remoteWriteUrl:
                      type: string
                      description: Where the Prometheus in the project's locations sends its samples; unset without remoteWrite in project-defaults.
                grafana:
                  type: object
                  properties:
                    url:
                      type: string
                      description: URL for browsers (the ingress host); unset without ingress.
                    internalUrl:
                      type: string
                    adminSecret:
                      type: string
                      description: Secret in the namespace with GF_SECURITY_ADMIN_USER / GF_SECURITY_ADMIN_PASSWORD.
                    instanceSelector:
                      type: object
                      additionalProperties:
                        type: string
                      description: Labels a GrafanaDashboard/GrafanaDatasource must select to land in this Grafana.
