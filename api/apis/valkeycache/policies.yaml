# Guardrails for ValkeyCaches (ValidatingAdmissionPolicy, Kubernetes >= 1.30),
# the same as PostgresClusters': caches run in one of their Project's
# locations, never on the control plane. A new one needs a namespace whose
# Project has a location for its spec.site (namespace annotation
# platform.cndev.nl/protected-location or platform.cndev.nl/recovery-location,
# set by the Project composition) that is open to new workloads (not in
# platform.cndev.nl/unschedulable-locations). Existing caches there stay
# editable; spec.site itself is immutable (the XRD).
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: cache.cndev.nl-valkeycache-locations
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [cache.cndev.nl]
        apiVersions: ["*"]
        resources: [valkeycaches]
        operations: [CREATE]
  variables:
    - name: annotations
      expression: "has(namespaceObject.metadata.annotations) ? namespaceObject.metadata.annotations : {}"
    - name: site
      expression: "has(object.spec.site) ? object.spec.site : 'protected'"
    - name: location
      expression: >-
        'platform.cndev.nl/' + variables.site + '-location' in variables.annotations
        ? variables.annotations['platform.cndev.nl/' + variables.site + '-location'] : ''
    - name: closed
      expression: >-
        'platform.cndev.nl/unschedulable-locations' in variables.annotations
        ? variables.annotations['platform.cndev.nl/unschedulable-locations'].split(',')
        : []
  validations:
    - expression: "variables.location != ''"
      messageExpression: >-
        'namespace ' + namespaceObject.metadata.name + ' is not a Project with a ' + variables.site
        + ' location; ValkeyCaches run in a Project\'s location, never on the control plane'
        + (variables.site == 'recovery' ? ' (set spec.locations.recovery on the Project, or use site protected)' : '')
      reason: Forbidden
    - expression: "!(variables.location in variables.closed)"
      messageExpression: >-
        'location ' + variables.location + ' (' + variables.site + ') is closed to new workloads (Location spec.schedulable: false)'
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: cache.cndev.nl-valkeycache-locations
spec:
  policyName: cache.cndev.nl-valkeycache-locations
  validationActions: [Deny]
