# ValkeyCache: a namespaced Crossplane v2 composite resource for the cache
# layer of an AI service -- an exact cache (normalised prompt + context hash ->
# response, tool/SQL/search results) or a semantic cache (embedding -> response,
# KNN through the valkey-search module) -- on Valkey, run by the official
# valkey-io operator (ValkeyCluster, valkey.io/v1alpha1) in the Project's
# protected location.
#
# Like PostgresCluster, the XR lives in its Project's namespace on the
# control plane, which runs no caches, and is composed by function-basis. The
# composition places a ValkeyCluster, a copy of its password Secret, a
# PodMonitor and a PrometheusRule (the cache alerts) in the Project's protected
# location through provider-kubernetes Objects, and a GrafanaDashboard in the
# Project's Grafana. The password is generated once
# into Secret <name>-valkey on the control plane (with host, port and uri for
# clients), so the portal and tenants read it without the location's
# kubeconfig.
#
# A cache, not a database: no persistence (memory only, lost when a pod
# restarts unless a replica takes over), maxmemory below the container limit
# with an eviction policy. Keep the primary vector store in PostgreSQL
# (PostgresCluster, profile vector); use the semantic mode for cached answers.
apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: valkeycaches.cache.cndev.nl
spec:
  group: cache.cndev.nl
  scope: Namespaced
  names:
    kind: ValkeyCache
    plural: valkeycaches
    shortNames: [vcache]
    categories: [crossplane, cache]
  defaultCompositionRef:
    name: valkeycache
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      additionalPrinterColumns:
        - name: Mode
          type: string
          jsonPath: .spec.mode
        - name: Shards
          type: integer
          jsonPath: .spec.shards
        - name: Replicas
          type: integer
          jsonPath: .spec.replicas
        - name: State
          type: string
          jsonPath: .status.state
        - name: Location
          type: string
          jsonPath: .status.location
        - name: Endpoint
          type: string
          jsonPath: .status.endpoint
          priority: 1
        # Crossplane appends SYNCED, READY, COMPOSITION and AGE itself.
      schema:
        openAPIV3Schema:
          type: object
          description: A Valkey cache (exact or semantic) for an AI service, in its Project's location.
          x-kubernetes-validations:
            # The ValkeyCluster is <name>, its Service valkey-<name>, its pods
            # <name>-<shard>-<node>-0: keep them within Kubernetes' limits.
            - rule: "self.metadata.name.matches('^[a-z]([-a-z0-9]{0,38}[a-z0-9])?$')"
              message: ValkeyCache names are lowercase letters, digits and "-", start with a letter, max 40 characters
          properties:
            spec:
              type: object
              x-kubernetes-validations:
                - rule: "self.mode == oldSelf.mode"
                  message: mode can't change; create a new cache
              properties:
                mode:
                  type: string
                  description: >-
                    exact: plain key/value with TTLs (hashed prompt plus context, tool, SQL and
                    search results). semantic: also loads the valkey-search module (FT.CREATE /
                    FT.SEARCH, HNSW/KNN vector search) for embedding-based hits, e.g. LiteLLM's
                    valkey-semantic cache. Fixed after creation.
                  enum: [exact, semantic]
                  default: exact
                shards:
                  type: integer
                  description: >-
                    Primaries the keyspace is spread over (Valkey cluster mode). Grow for more
                    memory or write throughput, with a cluster-aware client. Clients without
                    cluster support (e.g. LiteLLM's valkey-semantic cache) need 1 shard and
                    0 replicas, so the Service always reaches the primary.
                  minimum: 1
                  maximum: 16
                  default: 1
                replicas:
                  type: integer
                  description: >-
                    Replicas per shard. A replica takes over when its primary fails, so the
                    cache stays warm; 0 loses that shard's keys on every pod restart.
                  minimum: 0
                  maximum: 5
                  default: 1
                resources:
                  type: object
                  description: CPU and memory for each Valkey pod (memory is request and limit).
                  default: {}
                  properties:
                    cpu:
                      type: string
                      pattern: '^[0-9]+(\.[0-9]+)?m?$'
                      default: 500m
                    memory:
                      type: string
                      description: Mi or Gi; maxmemory is maxMemoryPercent of this.
                      pattern: '^[0-9]+(Mi|Gi)$'
                      default: 1Gi
                maxMemoryPercent:
                  type: integer
                  description: >-
                    Share of the pod's memory Valkey fills with keys before evicting (maxmemory).
                    The rest is for replication buffers, fragmentation and, in semantic mode,
                    index building.
                  minimum: 10
                  maximum: 90
                  default: 75
                evictionPolicy:
                  type: string
                  description: >-
                    What goes when maxmemory is reached (maxmemory-policy). allkeys-lru suits a
                    cache; volatile-* only evicts keys with a TTL; noeviction refuses writes instead.
                  enum: [allkeys-lru, allkeys-lfu, allkeys-random, volatile-lru, volatile-lfu, volatile-random, volatile-ttl, noeviction]
                  default: allkeys-lru
                monitoring:
                  type: object
                  default: {}
                  properties:
                    enabled:
                      type: boolean
                      description: >-
                        Run the redis_exporter sidecar and a PodMonitor for it, scraped by the Project's
                        Prometheus (semantic caches add valkey-search's module metrics).
                      default: true
                    podMonitorLabels:
                      type: object
                      description: Extra labels on the PodMonitor/PrometheusRule, to match your Prometheus' selectors.
                      additionalProperties:
                        type: string
                    prometheusRule:
                      type: object
                      default: {}
                      properties:
                        enabled:
                          type: boolean
                          description: >-
                            Create a PrometheusRule with the cache alerts (node down, cluster state, slots,
                            replica link, restarts, rejected writes, connections, eviction, hit ratio).
                          default: true
                        excludeRules:
                          type: array
                          description: Alert names to leave out, e.g. [ValkeyCacheLowHitRatio].
                          items:
                            type: string
                    grafanaDashboard:
                      type: object
                      default: {}
                      properties:
                        enabled:
                          type: boolean
                          description: Create a grafana-operator GrafanaDashboard with the Valkey cache dashboard, preselected on this cache.
                          default: true
                        instanceSelector:
                          type: object
                          description: matchLabels selecting the Grafana instance(s). Defaults to dashboards.paas.cndev.nl/scope=<namespace>.
                          additionalProperties:
                            type: string
                        allowCrossNamespaceImport:
                          type: boolean
                          description: Allow a Grafana in another namespace to import this dashboard.
                          default: false
                        folder:
                          type: string
                          default: Valkey
                        datasourceName:
                          type: string
                          description: Name of the Prometheus datasource in Grafana.
                          default: prometheus
            status:
              type: object
              properties:
                ready:
                  type: boolean
                state:
                  type: string
                  description: The ValkeyCluster's state (Initializing, Reconciling, Ready, Degraded, Failed).
                message:
                  type: string
                shards:
                  type: integer
                readyShards:
                  type: integer
                location:
                  type: string
                  description: The Project's location the cache runs in, pinned on first use.
                endpoint:
                  type: string
                  description: host:port of the cluster's Service in the location (any node; cluster-mode clients follow redirects).
                secret:
                  type: string
                  description: >-
                    Secret in this namespace on the control plane with username, password, host,
                    port and uri (valkey://). A copy is in the location for workloads there.
                modules:
                  type: array
                  description: Modules loaded (search in semantic mode).
                  items:
                    type: string
                monitoring:
                  type: object
                  properties:
                    dashboardUid:
                      type: string
                      description: uid of the GrafanaDashboard in the Project's Grafana.
