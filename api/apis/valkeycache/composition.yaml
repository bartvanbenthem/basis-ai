# The ValkeyCache composition is Rust: function-basis
# (../../function/src/valkeycache.rs), like PostgresCluster's. See its module
# documentation for what gets composed: the password Secret, the ValkeyCluster,
# PodMonitor and PrometheusRule in the Project's protected location, and the
# GrafanaDashboard in the Project's Grafana.
apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: valkeycache
  labels:
    cache.cndev.nl/api: valkeycache
spec:
  compositeTypeRef:
    apiVersion: cache.cndev.nl/v1alpha1
    kind: ValkeyCache
  mode: Pipeline
  pipeline:
    - step: compose
      functionRef:
        name: function-basis
