# The MCPServer composition is Go code: function-basis
# (../../function/mcpserver). See its package documentation for what gets
# composed: the clients' keys on the control plane, and basis-mcp's
# Deployment, Service, config, PodMonitor and PrometheusRule in each of the
# Project's sites, plus the GrafanaDashboard in the Project's Grafana.
apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: mcpserver
  labels:
    ai.cndev.nl/api: mcpserver
spec:
  compositeTypeRef:
    apiVersion: ai.cndev.nl/v1alpha1
    kind: MCPServer
  mode: Pipeline
  pipeline:
    - step: compose
      functionRef:
        name: function-basis
