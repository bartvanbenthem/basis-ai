# GenAIStack: a namespaced Crossplane v2 composite resource that wires up the
# platform side of a generative AI service in a Project, in one object:
#
#   retrieval  a PostgresCluster (profile vector: pgvector, VectorChord,
#              pg_search) with a role the stack owns, geo-replicated to the
#              Project's recovery location when spec.recovery.enabled
#   cache      a ValkeyCache per site (exact or semantic), used by the app
#   gateway    a ModelGateway (Agent Router) per stack, <name>-gateway: one
#              internal, OpenAI-compatible endpoint for the models in
#              spec.gateway.models, provider keys kept in the platform -- or a
#              shared ModelGateway (spec.gateway.ref) the stack is a client of
#   wiring     a Secret <name>-connection per site in the location with every
#              endpoint and credential (DATABASE_URL, VALKEY_URL, OPENAI_BASE_URL,
#              OPENAI_API_KEY, ...), the same keys in both sites
#
# Everything is internal to the location by default; spec.retrieval.expose
# and spec.gateway.expose put the database and the gateway behind a
# LoadBalancer for clients outside it (the cache stays internal: no TLS).
#
# Sites: the Project's protected location, plus its recovery location with
# spec.recovery.enabled (warm standby). The active site is where the
# database's primary runs (PostgresCluster status.primarySite): it gets the
# full-size cache and gateway; the other site a small cache and a minimal
# gateway. spec.recovery.activeSite switches the stack over: the database
# moves its primary, and the rest follows once it has.
#
# The stack composes the child XRs (PostgresCluster, ValkeyCache,
# ModelGateway) next to it in the namespace, named <name>-db, <name>-cache,
# <name>-cache-dr, <name>-gateway, and labelled ai.cndev.nl/genaistack:
# <name>. They are the stack's: an admission policy (policies.yaml) refuses
# changing or deleting them directly. Composed by function-basis
# (../../function/genaistack).
apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: genaistacks.ai.cndev.nl
spec:
  group: ai.cndev.nl
  scope: Namespaced
  names:
    kind: GenAIStack
    plural: genaistacks
    shortNames: [gstack]
    categories: [crossplane, ai]
  defaultCompositionRef:
    name: genaistack
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      additionalPrinterColumns:
        - name: Recovery
          type: boolean
          jsonPath: .spec.recovery.enabled
        - name: Active-Site
          type: string
          jsonPath: .status.activeSite
        - name: Models
          type: integer
          jsonPath: .status.models
        - name: Message
          type: string
          jsonPath: .status.message
          priority: 1
        # Crossplane appends SYNCED, READY, COMPOSITION and AGE itself.
      schema:
        openAPIV3Schema:
          type: object
          description: A generative AI stack (retrieval, cache, gateway, wiring) in a Project's site(s).
          x-kubernetes-validations:
            # Child names: <name>-cache-dr must fit ValkeyCache's 40 characters.
            - rule: "self.metadata.name.matches('^[a-z]([-a-z0-9]{0,26}[a-z0-9])?$')"
              message: GenAIStack names are lowercase letters, digits and "-", start with a letter, max 28 characters
          properties:
            spec:
              type: object
              x-kubernetes-validations:
                - rule: "!has(self.recovery) || !has(self.recovery.activeSite) || self.recovery.activeSite == 'protected' || (has(self.recovery.enabled) && self.recovery.enabled)"
                  message: recovery.activeSite can only be recovery with recovery.enabled; switch back to protected before turning recovery off
                - rule: "!has(self.gateway) || !has(self.gateway.ref) || !has(self.gateway.models) || size(self.gateway.models) == 0"
                  message: gateway.models belong to the stack's own gateway; with gateway.ref, add them to the shared ModelGateway
                - rule: "!has(self.gateway) || !has(self.gateway.ref) || !has(self.gateway.expose)"
                  message: gateway.expose belongs to the stack's own gateway; with gateway.ref, set expose on the shared ModelGateway
              properties:
                deletionProtection:
                  type: boolean
                  description: >-
                    Refuse deleting the stack (and with it its database). Set to false before
                    deleting it.
                  default: true
                recovery:
                  type: object
                  description: >-
                    A warm standby in the Project's recovery location (the Project needs one): a
                    replica of the database, a small cold cache and a minimal gateway. activeSite
                    switches the stack over. Turning it off needs activeSite protected; the database
                    switches back first (nothing is lost), then the standby goes.
                  default: {}
                  properties:
                    enabled:
                      type: boolean
                      default: false
                    activeSite:
                      type: string
                      description: >-
                        Where the stack serves from. Setting it to recovery switches the database's
                        primary over to the recovery site (and back with protected); the cache and
                        gateway follow once it has moved (status.activeSite).
                      enum: [protected, recovery]
                      default: protected
                    promotion:
                      type: string
                      description: >-
                        How an activeSite change is carried out (the database's
                        geoReplication.promotion): Switchover waits for the current primary and loses
                        nothing; Failover promotes the other site right away, for when the active
                        site is down, and loses what it had not archived yet.
                      enum: [Switchover, Failover]
                      default: Switchover
                    cacheMemory:
                      type: string
                      description: Memory of the standby site's cache pod; it gets cache.memory once active.
                      pattern: '^[0-9]+(Mi|Gi)$'
                      default: 512Mi
                    gatewayReplicas:
                      type: integer
                      description: Gateway (Envoy) replicas in the standby site; it gets gateway.replicas once active.
                      minimum: 0
                      maximum: 10
                      default: 1
                retrieval:
                  type: object
                  description: The RAG database, a PostgresCluster (profile vector, PostgreSQL 18) named <name>-db.
                  default: {}
                  properties:
                    size:
                      type: string
                      description: A size from the postgres-sizes catalog (e.g. s, m). Unset, 500m CPU and 1Gi memory.
                    instances:
                      type: integer
                      minimum: 1
                      maximum: 9
                      default: 3
                    storageSize:
                      type: string
                      pattern: '^[0-9]+(Mi|Gi|Ti)$'
                      default: 20Gi
                    backup:
                      type: boolean
                      description: >-
                        Continuous backups to the Project's bucket (point-in-time restore). Always on with
                        recovery, whose replica is fed from them.
                      default: false
                    extensions:
                      type: array
                      description: Extensions in the database (from the postgres-extensions catalog).
                      default: [vector]
                      items:
                        type: string
                    auditLog:
                      type: string
                      description: >-
                        Audit logging with pgaudit: the statement classes to record, e.g. "ddl, role" or
                        "write, ddl, role" (pgaudit.log). Unset, off. The project's Audit logs page shows the
                        records. Turning it on or off restarts the database's instances, one at a time.
                      pattern: '^\s*-?(read|write|function|role|ddl|misc|misc_set|all|READ|WRITE|FUNCTION|ROLE|DDL|MISC|MISC_SET|ALL)(\s*,\s*-?(read|write|function|role|ddl|misc|misc_set|all|READ|WRITE|FUNCTION|ROLE|DDL|MISC|MISC_SET|ALL))*\s*$'
                      maxLength: 200
                    expose:
                      type: object
                      description: >-
                        External access to the database's primary (read-write) as <name>-db-external, a
                        LoadBalancer Service with TLS, for clients outside the location (ingestion jobs,
                        admin and BI tools). Off: the app in the location uses DATABASE_URL. The
                        database's spec.expose.
                      x-kubernetes-validations:
                        - rule: "!has(self.enabled) || !self.enabled || (has(self.loadBalancerSourceRanges) && size(self.loadBalancerSourceRanges) > 0)"
                          message: retrieval.expose.enabled needs loadBalancerSourceRanges (the clients' CIDRs); a database is never open to everyone
                      properties:
                        enabled:
                          type: boolean
                          default: false
                        annotations:
                          type: object
                          additionalProperties:
                            type: string
                        loadBalancerSourceRanges:
                          type: array
                          description: CIDRs allowed to connect, e.g. [203.0.113.10/32]. Required when enabled.
                          maxItems: 50
                          items:
                            type: string
                            pattern: '^[0-9a-fA-F:.]+/[0-9]{1,3}$'
                cache:
                  type: object
                  description: A ValkeyCache per site (<name>-cache, <name>-cache-dr), used by the app for exact or semantic lookups.
                  default: {}
                  properties:
                    enabled:
                      type: boolean
                      default: true
                    mode:
                      type: string
                      enum: [exact, semantic]
                      default: semantic
                    cpu:
                      type: string
                      pattern: '^[0-9]+(\.[0-9]+)?m?$'
                      default: 500m
                    memory:
                      type: string
                      description: Memory of the active site's cache pod.
                      pattern: '^[0-9]+(Mi|Gi)$'
                      default: 1Gi
                    evictionPolicy:
                      type: string
                      enum: [allkeys-lru, allkeys-lfu, allkeys-random, volatile-lru, volatile-lfu, volatile-random, volatile-ttl, noeviction]
                      default: allkeys-lru
                gateway:
                  type: object
                  description: >-
                    The stack's ModelGateway (<name>-gateway, Agent Router in each site's location,
                    deps/README.md): one internal, OpenAI-compatible endpoint (OPENAI_BASE_URL)
                    routing on the request's model to the models below, with their provider keys
                    kept in the platform. Or, with ref, a ModelGateway shared with others. Apps
                    authenticate with OPENAI_API_KEY from the connection Secret.
                  default: {}
                  properties:
                    enabled:
                      type: boolean
                      default: true
                    retry:
                      type: object
                      description: The stack's own gateway's retry (its ModelGateway's spec.retry, as it is).
                      x-kubernetes-preserve-unknown-fields: true
                    rateLimit:
                      type: object
                      description: The stack's own gateway's per-minute caps (its ModelGateway's spec.rateLimit, as it is).
                      x-kubernetes-preserve-unknown-fields: true
                    alerts:
                      type: object
                      description: The stack's own gateway's alert thresholds (its ModelGateway's spec.alerts, as it is).
                      x-kubernetes-preserve-unknown-fields: true
                    monthlyTokens:
                      type: integer
                      description: >-
                        Tokens the stack's own gateway may pass per calendar month in each site (its
                        ModelGateway's monthlyTokens); past it, 429 until the month ends.
                      minimum: 1
                    ref:
                      type: string
                      description: >-
                        A ModelGateway in this namespace to use instead of one of the stack's own;
                        models are then the gateway's. It needs a client for the stack (client) and,
                        with recovery, a recovery site of its own.
                      pattern: '^[a-z]([-a-z0-9]{0,38}[a-z0-9])?$'
                    client:
                      type: string
                      description: The stack's client in the shared gateway (spec.clients); the stack's name by default.
                      pattern: '^[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?$'
                    replicas:
                      type: integer
                      description: Gateway (Envoy) replicas in the active site.
                      minimum: 1
                      maximum: 10
                      default: 2
                    models:
                      type: array
                      maxItems: 30
                      x-kubernetes-list-type: map
                      x-kubernetes-list-map-keys: [name]
                      items:
                        type: object
                        required: [name, endpoint]
                        properties:
                          name:
                            type: string
                            description: The model name apps send (the request's "model").
                            minLength: 1
                            maxLength: 200
                          endpoint:
                            type: string
                            description: >-
                              Base URL of the provider's API, its path the API prefix, e.g.
                              https://api.openai.com/v1, https://api.anthropic.com/v1 or
                              http://vllm.models.svc:8000/v1 (self-hosted, OpenAI-compatible).
                            pattern: '^https?://[^/:]+(:[0-9]+)?(/.*)?$'
                          schema:
                            type: string
                            description: >-
                              The provider's API: OpenAI (and every OpenAI-compatible server: vLLM,
                              KServe, Ollama, Mistral, ...) or Anthropic.
                            enum: [OpenAI, Anthropic]
                            default: OpenAI
                          upstreamModel:
                            type: string
                            description: The model name at the provider, when it differs from name.
                            maxLength: 200
                          fallbacks:
                            type: array
                            description: >-
                              Other models of this gateway (by name) to try, in order, when this one fails after
                              retry.attempts: the request goes to the next one, with that model's name and key.
                            maxItems: 5
                            items:
                              type: string
                          apiKeySecretRef:
                            type: object
                            description: Secret in this namespace holding the provider's API key; none for an endpoint without auth.
                            required: [name]
                            properties:
                              name:
                                type: string
                              key:
                                type: string
                                default: apiKey
                                pattern: '^[-._a-zA-Z0-9]+$'
                    expose:
                      type: object
                      description: >-
                        The stack's own gateway for clients outside the location too, at
                        https://<hostname>/v1 (a LoadBalancer, a cert-manager certificate); its
                        spec.expose. Apps in the location keep OPENAI_BASE_URL.
                      x-kubernetes-validations:
                        - rule: "!has(self.enabled) || !self.enabled || (has(self.hostname) && has(self.loadBalancerSourceRanges) && size(self.loadBalancerSourceRanges) > 0)"
                          message: gateway.expose.enabled needs a hostname (the certificate's) and loadBalancerSourceRanges (the clients' CIDRs; 0.0.0.0/0 for everyone)
                      properties:
                        enabled:
                          type: boolean
                          default: false
                        hostname:
                          type: string
                          description: The DNS name clients use, e.g. bot.example.com. Its DNS record is yours.
                          maxLength: 253
                          pattern: '^[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?(\.[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?)+$'
                        issuer:
                          type: string
                          description: The cert-manager ClusterIssuer in each location.
                          default: basis
                          pattern: '^[a-z0-9]([-.a-z0-9]{0,251}[a-z0-9])?$'
                        annotations:
                          type: object
                          additionalProperties:
                            type: string
                        loadBalancerSourceRanges:
                          type: array
                          description: CIDRs allowed to connect. Required when enabled.
                          maxItems: 50
                          items:
                            type: string
                            pattern: '^[0-9a-fA-F:.]+/[0-9]{1,3}$'
            status:
              type: object
              properties:
                ready:
                  type: boolean
                message:
                  type: string
                activeSite:
                  type: string
                  description: The site that serves (where the database's primary runs).
                models:
                  type: integer
                gatewayExternalEndpoint:
                  type: string
                  description: The gateway's base URL outside the location, when it is exposed.
                connectionSecret:
                  type: string
                  description: The Secret with every endpoint and credential, in the project namespace of each site's location.
                components:
                  type: object
                  description: Names of the composed APIs in this namespace.
                  properties:
                    database:
                      type: string
                    cache:
                      type: string
                    recoveryCache:
                      type: string
                    gateway:
                      type: string
                sites:
                  type: array
                  items:
                    type: object
                    properties:
                      site:
                        type: string
                      location:
                        type: string
                      active:
                        type: boolean
                      gatewayEndpoint:
                        type: string
                      databaseEndpoint:
                        type: string
                      cacheEndpoint:
                        type: string
