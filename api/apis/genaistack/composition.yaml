# The GenAIStack composition is Go code: function-basis
# (../../function/genaistack). See its package documentation for what gets
# composed: the child PostgresCluster and ValkeyCaches next to the stack, and
# per site the gateway (Agent Router) and the connection Secret in the location.
apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: genaistack
  labels:
    ai.cndev.nl/api: genaistack
spec:
  compositeTypeRef:
    apiVersion: ai.cndev.nl/v1alpha1
    kind: GenAIStack
  mode: Pipeline
  pipeline:
    - step: compose
      functionRef:
        name: function-basis
