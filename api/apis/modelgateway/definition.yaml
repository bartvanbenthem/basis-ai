# ModelGateway: a namespaced Crossplane v2 composite resource for one
# OpenAI-compatible entry point to a Project's models: hosted providers
# (OpenAI, Anthropic, Mistral, ...) and self-hosted servers (vLLM, KServe,
# Ollama), with the provider keys kept in the platform and an API key of its
# own for every client (app, agent, coding assistant).
#
# Agent Router (formerly Envoy AI Gateway; on Envoy Gateway, CNCF) runs it in
# the Project's protected location, plus a standby in its recovery location
# with spec.recovery.enabled. Clients in a location reach it at
# http://<name>.<namespace>.svc/v1 with Authorization: Bearer <key>; it routes
# on the request's model to the model's backend and swaps the client key for
# the provider's. spec.expose adds https://<hostname>/v1 for clients outside
# the location: a LoadBalancer of its own, with a cert-manager certificate.
#
# A GenAIStack composes one (<stack>-gateway) unless spec.gateway.ref names
# a ModelGateway to share. Composed by function-basis (../../function/modelgateway).
apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: modelgateways.ai.cndev.nl
spec:
  group: ai.cndev.nl
  scope: Namespaced
  names:
    kind: ModelGateway
    plural: modelgateways
    shortNames: [mgw]
    categories: [crossplane, basis, ai]
  defaultCompositionRef:
    name: modelgateway
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      additionalPrinterColumns:
        - name: Models
          type: integer
          jsonPath: .status.models
        - name: Clients
          type: integer
          jsonPath: .status.clients
        - name: Recovery
          type: boolean
          jsonPath: .spec.recovery.enabled
        - name: Active-Site
          type: string
          jsonPath: .status.activeSite
        - name: Endpoint
          type: string
          jsonPath: .status.endpoint
          priority: 1
        - name: External
          type: string
          jsonPath: .status.externalEndpoint
          priority: 1
        # Crossplane appends SYNCED, READY, COMPOSITION and AGE itself.
      schema:
        openAPIV3Schema:
          type: object
          description: An OpenAI-compatible gateway to a Project's models (Agent Router), in its site(s).
          x-kubernetes-validations:
            # The Gateway and its Service are <name>; Envoy Gateway names its
            # Deployment envoy-<namespace>-<name>-<hash>.
            - rule: "self.metadata.name.matches('^[a-z]([-a-z0-9]{0,38}[a-z0-9])?$')"
              message: ModelGateway names are lowercase letters, digits and "-", start with a letter, max 40 characters
          properties:
            spec:
              type: object
              x-kubernetes-validations:
                - rule: "!has(self.activeSite) || self.activeSite == 'protected' || (has(self.recovery) && has(self.recovery.enabled) && self.recovery.enabled)"
                  message: activeSite can only be recovery with recovery.enabled
                # Two rules: as one, its estimated cost exceeds the API server's budget.
                - rule: "!has(self.models) || self.models.all(m, !has(m.fallbacks) || m.fallbacks.all(f, f != m.name))"
                  message: a model's fallbacks must name other models of this gateway
                - rule: "!has(self.models) || self.models.all(m, !has(m.fallbacks) || m.fallbacks.all(f, self.models.exists(o, o.name == f)))"
                  message: a model's fallbacks must name other models of this gateway
              properties:
                replicas:
                  type: integer
                  description: Gateway (Envoy) replicas in the active site.
                  minimum: 1
                  maximum: 10
                  default: 2
                recovery:
                  type: object
                  description: >-
                    A standby gateway in the Project's recovery location (the Project needs one),
                    with the same models and client keys.
                  default: {}
                  properties:
                    enabled:
                      type: boolean
                      default: false
                    replicas:
                      type: integer
                      description: Gateway replicas in the standby site; it gets replicas once active.
                      minimum: 0
                      maximum: 10
                      default: 1
                activeSite:
                  type: string
                  description: >-
                    The site that serves, with the full replicas: protected (default) or recovery.
                    A GenAIStack sets it to where its database's primary runs.
                  enum: [protected, recovery]
                  default: protected
                clients:
                  type: array
                  description: >-
                    Who may call the gateway: each client gets an API key of its own, generated
                    once into Secret <name>-keys (the client's name is the key). Removing a client
                    revokes its key, and so does passing its expiresAt.
                  maxItems: 100
                  default: [{name: apps}]
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys: [name]
                  items:
                    type: object
                    required: [name]
                    properties:
                      name:
                        type: string
                        description: The client, e.g. an app, an agent or a team.
                        pattern: '^[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?$'
                      owner:
                        type: string
                        description: Who to ask about this key, a person or a group.
                        maxLength: 100
                      monthlyTokens:
                        type: integer
                        description: >-
                          Tokens (input and output) this client may use per calendar month in each site;
                          past it, the gateway answers 429 until the month ends. Needs Envoy Gateway's
                          rate limit service in the location (deps/README.md).
                        minimum: 1
                      requestsPerMinute:
                        type: integer
                        description: Requests this client may send per minute in each site; past it, 429.
                        minimum: 1
                      tokensPerMinute:
                        type: integer
                        description: Tokens (input and output) this client may use per minute in each site; past it, 429.
                        minimum: 1
                      expiresAt:
                        type: string
                        format: date
                        description: >-
                          The key's last day (YYYY-MM-DD). After it the key is revoked; a later date makes
                          a new key.
                retry:
                  type: object
                  description: >-
                    How a failed request is retried: attempts per model on the provider's retried
                    statuses and on connection failures (with backoff), then the model's fallbacks, the
                    same number each. Before anything is sent back, so not halfway a streamed answer.
                  properties:
                    attempts:
                      type: integer
                      description: Attempts per model, the first included; 1 retries nothing.
                      minimum: 1
                      maximum: 5
                      default: 2
                    retryOn:
                      type: array
                      description: The provider's HTTP statuses that are retried.
                      default: [429, 500, 502, 503, 504]
                      maxItems: 10
                      items:
                        type: integer
                        minimum: 400
                        maximum: 599
                    perTryTimeout:
                      type: string
                      description: How long one attempt may take, e.g. 60s; unset, as long as the request may.
                      pattern: '^[0-9]+(ms|s|m)$'
                rateLimit:
                  type: object
                  description: >-
                    Per-minute caps for all clients together, in each site; past one, 429. Per client:
                    clients[].requestsPerMinute and tokensPerMinute. Need Envoy Gateway's rate limit
                    service in the location (deps/README.md).
                  properties:
                    requestsPerMinute:
                      type: integer
                      minimum: 1
                    tokensPerMinute:
                      type: integer
                      description: Input and output tokens.
                      minimum: 1
                alerts:
                  type: object
                  description: >-
                    Thresholds of the gateway's alerts in the Project's Prometheus (per site, per
                    model): the 95th percentile of the request duration and of the time to first token
                    (streamed requests), and the share of failed requests.
                  properties:
                    latencySeconds:
                      type: number
                      minimum: 0
                      default: 60
                    timeToFirstTokenSeconds:
                      type: number
                      minimum: 0
                      default: 10
                    errorRatePercent:
                      type: number
                      minimum: 0
                      maximum: 100
                      default: 5
                    disabled:
                      type: boolean
                      description: No alerts for this gateway.
                      default: false
                monthlyTokens:
                  type: integer
                  description: >-
                    Tokens (input and output) all clients together may use per calendar month in each site;
                    past it, the gateway answers 429 until the month ends. Needs Envoy Gateway's rate limit
                    service in the location (deps/README.md).
                  minimum: 1
                models:
                  type: array
                  maxItems: 30
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys: [name]
                  items:
                    type: object
                    required: [name]
                    x-kubernetes-validations:
                      - rule: "has(self.endpoint) != has(self.server)"
                        message: a model has an endpoint (a provider's API) or a server (a ModelServer in this namespace), not both
                      - rule: "!has(self.server) || (!has(self.apiKeySecretRef) && !has(self.upstreamModel) && self.schema == 'OpenAI')"
                        message: a self-hosted model (server) takes no apiKeySecretRef, upstreamModel or schema; its ModelServer serves it
                    properties:
                      name:
                        type: string
                        description: The model name clients send (the request's "model").
                        minLength: 1
                        maxLength: 200
                      endpoint:
                        type: string
                        description: >-
                          Base URL of the provider's API, its path the API prefix, e.g.
                          https://api.openai.com/v1, https://api.anthropic.com/v1 or
                          http://vllm.models.svc:8000/v1 (self-hosted, OpenAI-compatible).
                        pattern: '^https?://[^/:]+(:[0-9]+)?(/.*)?$'
                      server:
                        type: string
                        description: >-
                          A ModelServer in this namespace (self-hosted: vLLM on KServe) instead of an endpoint. The
                          gateway routes to it with prefix-cache-aware routing when the model's name is the one
                          the server serves (its spec.model.name) and it has no fallbacks, nor is one; otherwise
                          round robin over its replicas. Only in the sites the server runs in.
                        pattern: '^[a-z]([-a-z0-9]{0,38}[a-z0-9])?$'
                      schema:
                        type: string
                        description: >-
                          The provider's API: OpenAI (and every OpenAI-compatible server: vLLM,
                          KServe, Ollama, Mistral, ...) or Anthropic.
                        enum: [OpenAI, Anthropic]
                        default: OpenAI
                      upstreamModel:
                        type: string
                        description: The model name at the provider, when it differs from name.
                        maxLength: 200
                      fallbacks:
                        type: array
                        description: >-
                          Other models of this gateway (by name) to try, in order, when this one fails after
                          retry.attempts: the request goes to the next one, with that model's name and key.
                        maxItems: 5
                        items:
                          type: string
                          maxLength: 200
                      apiKeySecretRef:
                        type: object
                        description: Secret in this namespace holding the provider's API key; none for an endpoint without auth.
                        required: [name]
                        properties:
                          name:
                            type: string
                          key:
                            type: string
                            default: apiKey
                            pattern: '^[-._a-zA-Z0-9]+$'
                expose:
                  type: object
                  description: >-
                    The gateway for clients outside its location too, at https://<hostname>/v1: a
                    Gateway <name>-external of its own on a LoadBalancer Service, HTTPS only, with a
                    certificate from cert-manager. The internal endpoint stays as it is. Clients
                    still need a key (spec.clients); the source ranges limit who reaches it at all.
                    With recovery each site gets a LoadBalancer of its own: point the hostname's
                    DNS at the active site's (status.sites[].address).
                  default: {}
                  x-kubernetes-validations:
                    - rule: "!has(self.enabled) || !self.enabled || (has(self.hostname) && has(self.loadBalancerSourceRanges) && size(self.loadBalancerSourceRanges) > 0)"
                      message: expose.enabled needs a hostname (the certificate's) and loadBalancerSourceRanges (the clients' CIDRs; 0.0.0.0/0 for everyone)
                  properties:
                    enabled:
                      type: boolean
                      default: false
                    hostname:
                      type: string
                      description: The DNS name clients use, e.g. llm.example.com; the certificate is for it. Its DNS record is yours.
                      maxLength: 253
                      pattern: '^[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?(\.[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?)+$'
                    issuer:
                      type: string
                      description: >-
                        The cert-manager ClusterIssuer in each location that issues the certificate
                        (the platform team sets it up; deps/README.md). With recovery, one that can
                        issue in a site the hostname doesn't point at (ACME DNS-01, a private CA).
                      default: basis
                      pattern: '^[a-z0-9]([-.a-z0-9]{0,251}[a-z0-9])?$'
                    annotations:
                      type: object
                      description: On the LoadBalancer Service, e.g. for the cloud's load balancer settings.
                      additionalProperties:
                        type: string
                    loadBalancerSourceRanges:
                      type: array
                      description: CIDRs allowed to connect, e.g. [203.0.113.0/24]. Required when enabled.
                      maxItems: 50
                      items:
                        type: string
                        pattern: '^[0-9a-fA-F:.]+/[0-9]{1,3}$'
            status:
              type: object
              properties:
                ready:
                  type: boolean
                message:
                  type: string
                activeSite:
                  type: string
                models:
                  type: integer
                clients:
                  type: integer
                endpoint:
                  type: string
                  description: Base URL for OpenAI clients in each site's location (OPENAI_BASE_URL).
                externalEndpoint:
                  type: string
                  description: Base URL for clients outside the location (spec.expose).
                keysSecret:
                  type: string
                  description: Secret in this namespace with an API key per client.
                dashboardUid:
                  type: string
                  description: The gateway's dashboard in the Project's Grafana, at <grafana>/d/<uid>.
                expiredClients:
                  type: array
                  description: Clients past their expiresAt; their keys are revoked.
                  items:
                    type: string
                sites:
                  type: array
                  items:
                    type: object
                    properties:
                      site:
                        type: string
                      location:
                        type: string
                      active:
                        type: boolean
                      replicas:
                        type: integer
                      address:
                        type: string
                        description: The site's external LoadBalancer address (spec.expose), once it has one.
