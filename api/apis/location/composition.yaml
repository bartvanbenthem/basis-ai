# The Location composition is Go code: function-basis
# (../../function/location). See its package documentation for what gets
# composed: the ClusterProviderConfig everything is placed through, the
# ClusterRole the Projects' Prometheus bind to, and observe-only Objects that
# tell which operators the cluster has.
apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: location
  labels:
    platform.cndev.nl/api: location
spec:
  compositeTypeRef:
    apiVersion: platform.cndev.nl/v1alpha1
    kind: Location
  mode: Pipeline
  pipeline:
    - step: compose
      functionRef:
        name: function-basis
