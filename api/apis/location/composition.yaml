# Composition for platform.cndev.nl/v1alpha1 Location (see definition.yaml).
#
# Composes, for Location <name>:
#   ClusterProviderConfig <name>          provider-kubernetes, credentials from
#                                         spec.credentials.secretRef; what the
#                                         Project and PostgresCluster
#                                         compositions place objects through
#   Object <name>-prometheus-role         ClusterRole cnpg-platform:project-prometheus
#                                         in the location (same as
#                                         ../../install/project-prometheus-role.yaml),
#                                         which every project's Prometheus there
#                                         binds to. Never deleted by Crossplane:
#                                         removing the Location leaves it.
#   Object <name>-cnpg                    observe only: APIService
#   Object <name>-prometheus-operator       v1.postgresql.cnpg.io / v1.monitoring.coreos.com
#   Object <name>-valkey                    / v1alpha1.valkey.io, which the API
#                                         server registers for every CRD group
#                                         -- small, unlike the CRDs themselves,
#                                         whose schemas would land in the
#                                         Object's status. The Valkey operator
#                                         is optional (only for ValkeyCaches):
#                                         it never makes a Location unready.
#
# The Objects live in the namespace of the kubeconfig Secret. Whether the
# role Object syncs says whether Crossplane can reach the cluster
# (status.connected); the observe-only Objects say which operators are
# installed. A missing operator is noticed on provider-kubernetes' next poll.
apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: location
  labels:
    platform.cndev.nl/api: location
spec:
  compositeTypeRef:
    apiVersion: platform.cndev.nl/v1alpha1
    kind: Location
  mode: Pipeline
  pipeline:
    - step: render
      functionRef:
        name: function-go-templating
      input:
        apiVersion: gotemplating.fn.crossplane.io/v1beta1
        kind: GoTemplate
        source: Inline
        inline:
          template: |
            {{- $xr := .observed.composite.resource }}
            {{- $spec := $xr.spec | default (dict) }}
            {{- $name := $xr.metadata.name }}
            {{- $ref := dig "credentials" "secretRef" (dict) $spec }}
            {{- $ns := $ref.namespace }}
            {{- $observed := .observed.resources | default (dict) }}
            {{- $labels := dict "app.kubernetes.io/managed-by" "crossplane" "app.kubernetes.io/part-of" "cnpg-platform" "platform.cndev.nl/location" $name }}

            {{- /* ---- observed state ---- */}}
            {{- $pc := dig "providerconfig" "resource" (dict) $observed }}
            {{- $role := dig "prometheus-role" "resource" (dict) $observed }}
            {{- $synced := dict }}
            {{- range dig "status" "conditions" (list) $role }}{{ if eq .type "Synced" }}{{ $synced = . }}{{ end }}{{ end }}
            {{- $roleReady := false }}
            {{- range dig "status" "conditions" (list) $role }}{{ if and (eq .type "Ready") (eq .status "True") }}{{ $roleReady = true }}{{ end }}{{ end }}
            {{- $connected := and (eq ($synced.status | default "") "True") $roleReady }}
            {{- $operators := dict }}
            {{- range $key := list "cnpg" "prometheus-operator" "valkey" }}
            {{- $_ := set $operators $key (not (empty (dig $key "resource" "status" "atProvider" "manifest" (dict) $observed))) }}
            {{- end }}
            ---
            apiVersion: kubernetes.m.crossplane.io/v1alpha1
            kind: ClusterProviderConfig
            metadata:
              name: {{ $name }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: providerconfig
                gotemplating.fn.crossplane.io/ready: {{ if $pc }}"True"{{ else }}"False"{{ end }}
              labels:
                {{- range $k, $v := $labels }}
                {{ $k }}: {{ $v | quote }}
                {{- end }}
            spec:
              credentials:
                source: Secret
                secretRef:
                  namespace: {{ $ns }}
                  name: {{ $ref.name }}
                  key: {{ $ref.key | default "kubeconfig" }}
            ---
            apiVersion: kubernetes.m.crossplane.io/v1alpha1
            kind: Object
            metadata:
              name: {{ $name }}-prometheus-role
              namespace: {{ $ns }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: prometheus-role
                gotemplating.fn.crossplane.io/ready: {{ if $roleReady }}"True"{{ else }}"False"{{ end }}
              labels:
                {{- range $k, $v := $labels }}
                {{ $k }}: {{ $v | quote }}
                {{- end }}
            spec:
              providerConfigRef:
                kind: ClusterProviderConfig
                name: {{ $name }}
              # Projects' Prometheus ClusterRoleBindings there point at it:
              # leave it when the Location goes (no Delete), which also lets
              # the Location be removed while the cluster is unreachable.
              managementPolicies: [Observe, Create, Update, LateInitialize]
              forProvider:
                manifest:
                  apiVersion: rbac.authorization.k8s.io/v1
                  kind: ClusterRole
                  metadata:
                    name: cnpg-platform:project-prometheus
                    labels:
                      app.kubernetes.io/managed-by: crossplane
                      app.kubernetes.io/part-of: cnpg-platform
                  rules:
                    - apiGroups: [""]
                      resources: [nodes, nodes/metrics, nodes/proxy, services, endpoints, pods]
                      verbs: [get, list, watch]
                    - apiGroups: [discovery.k8s.io]
                      resources: [endpointslices]
                      verbs: [get, list, watch]
                    - nonResourceURLs: [/metrics, /metrics/cadvisor]
                      verbs: [get]
            {{- range $key, $apiService := dict "cnpg" "v1.postgresql.cnpg.io" "prometheus-operator" "v1.monitoring.coreos.com" "valkey" "v1alpha1.valkey.io" }}
            ---
            apiVersion: kubernetes.m.crossplane.io/v1alpha1
            kind: Object
            metadata:
              name: {{ $name }}-{{ $key }}
              namespace: {{ $ns }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: {{ $key }}
                gotemplating.fn.crossplane.io/ready: {{ if or (index $operators $key) (eq $key "valkey") }}"True"{{ else }}"False"{{ end }}
              labels:
                {{- range $k, $v := $labels }}
                {{ $k }}: {{ $v | quote }}
                {{- end }}
            spec:
              providerConfigRef:
                kind: ClusterProviderConfig
                name: {{ $name }}
              managementPolicies: [Observe]
              forProvider:
                manifest:
                  apiVersion: apiregistration.k8s.io/v1
                  kind: APIService
                  metadata:
                    name: {{ $apiService }}
            {{- end }}

            {{- /* ================= XR status ================= */}}
            {{- $cnpg := index $operators "cnpg" }}
            {{- $promOp := index $operators "prometheus-operator" }}
            {{- $missing := list }}
            {{- if not $cnpg }}{{ $missing = append $missing "CloudNativePG" }}{{ end }}
            {{- if not $promOp }}{{ $missing = append $missing "the Prometheus Operator CRDs" }}{{ end }}
            {{- $ready := and $connected (not $missing) }}
            {{- $msg := printf "Location %s is ready" $name }}
            {{- if not $pc }}{{ $msg = "Creating the ClusterProviderConfig" }}
            {{- else if not $role }}{{ $msg = "Connecting" }}
            {{- else if not $connected }}{{ $msg = printf "Can't reach the cluster: %s" ($synced.message | default "waiting for provider-kubernetes") }}
            {{- else if $missing }}{{ $msg = printf "Connected; %s not installed (run operator/install.sh against it)" (join " and " $missing) }}
            {{- end }}
            ---
            apiVersion: platform.cndev.nl/v1alpha1
            kind: Location
            status:
              ready: {{ $ready }}
              message: {{ $msg | quote }}
              connected: {{ $connected }}
              {{- if $pc }}
              providerConfig: {{ $name }}
              {{- end }}
              {{- if $connected }}
              operators:
                cloudnativepg: {{ $cnpg }}
                prometheusOperator: {{ $promOp }}
                valkey: {{ index $operators "valkey" }}
              {{- end }}
            ---
            apiVersion: meta.gotemplating.fn.crossplane.io/v1alpha1
            kind: ClaimConditions
            conditions:
              - type: LocationReady
                status: {{ if $ready }}"True"{{ else }}"False"{{ end }}
                reason: {{ if $ready }}Available{{ else if $connected }}OperatorsMissing{{ else }}Connecting{{ end }}
                message: {{ $msg | quote }}
                target: Composite
