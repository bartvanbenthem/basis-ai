[package]
name = "basis-crdgen"
version = "0.5.0"
description = "Generates crds/ (basis-crds) with kopium (make crds); on its own so that it never builds what it generates"
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "crdgen"
path = "src/main.rs"

[dependencies]
serde = "1"
serde_yaml = "0.9"
