[package]
name = "basis-crds"
version = "0.5.0"
description = "Rust types for the operator kinds BASIS's compositions write, generated by kopium from their CRDs (make crds)"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# Generated types only: no tests or examples to build, and a second build of
# this crate (it takes ~6 GB) for the test harness is one too many.
doctest = false
test = false

[dependencies]
# derive only: CustomResource and the kinds' types, no client.
kube = { version = "4.2", default-features = false, features = ["derive"] }
k8s-openapi = { version = "0.28", default-features = false, features = ["std", "latest"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
