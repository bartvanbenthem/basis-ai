# The api's Rust workspace: function-basis (every API's composition) and the
# tools around it (tools/: assets and OpenAPI generation, render-test
# assertions, fixtures, the package cache for e2e).
[workspace]
resolver = "3"
members = ["crdgen", "crds", "function", "tools"]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
publish = false

# basis-crds is ~60k lines of generated serde types: without debuginfo it
# builds in far less memory, and nobody steps through it.
[profile.dev.package.basis-crds]
debug = false

[profile.test.package.basis-crds]
debug = false

# A small, static function image.
[profile.release]
strip = true
lto = true
codegen-units = 1
