[package]
name = "function-basis"
version = "0.5.0"
description = "The Crossplane composition function behind BASIS's APIs"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"
# The module docs are tables, not examples.
doctest = false

[[bin]]
name = "function-basis"
path = "src/main.rs"

[dependencies]
# The operator kinds the compositions write (kopium, make crds).
basis-crds = { path = "../crds" }
k8s-openapi = { version = "0.28", default-features = false, features = ["std", "latest"] }
function-sdk-rust = "0.4"
tonic = "0.14"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha1 = "0.10"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
rand = "0.9"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
regex = "1"
tracing = "0.1"
