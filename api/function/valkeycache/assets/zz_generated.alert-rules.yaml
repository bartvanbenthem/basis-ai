# GENERATED by hack/generate from src/alerts -- DO NOT EDIT.
- alert: ValkeyCacheDown
  annotations:
    summary: Valkey node down
    description: |-
      Valkey node {{ $labels.pod }} of cache "zznamespacezz/zzclusterzz" (shard {{ $labels.shard }})
      doesn't answer its exporter. Clients hitting its slots get errors until a replica takes over.
  expr: |
    redis_up{namespace="zznamespacezz",cluster="zzclusterzz"} == 0
  for: 5m
  labels:
    severity: critical
    namespace: zznamespacezz
- alert: ValkeyCacheClusterStateNotOk
  annotations:
    summary: Valkey cluster state is fail
    description: |-
      Node {{ $labels.pod }} of cache "zznamespacezz/zzclusterzz" reports cluster_state:fail: not every
      hash slot is served, so commands on those keys are refused. A shard has lost its primary and has
      no replica to promote, or the nodes can't reach each other.
  expr: |
    redis_cluster_state{namespace="zznamespacezz",cluster="zzclusterzz"} == 0
  for: 5m
  labels:
    severity: critical
    namespace: zznamespacezz
- alert: ValkeyCacheSlotsFailing
  annotations:
    summary: Valkey hash slots in FAIL or PFAIL state
    description: |-
      {{ $value }} hash slots of cache "zznamespacezz/zzclusterzz" map to a node in FAIL or PFAIL state
      (seen by {{ $labels.pod }}).
  expr: |
    max by (namespace, cluster, pod) (
      redis_cluster_slots_fail{namespace="zznamespacezz",cluster="zzclusterzz"}
      + redis_cluster_slots_pfail{namespace="zznamespacezz",cluster="zzclusterzz"}
    ) > 0
  for: 5m
  labels:
    severity: warning
    namespace: zznamespacezz
- alert: ValkeyCacheReplicaLinkDown
  annotations:
    summary: Valkey replica lost its primary
    description: |-
      Replica {{ $labels.pod }} of cache "zznamespacezz/zzclusterzz" (shard {{ $labels.shard }}) has no
      link to its primary: it can't take over with current data.
  expr: |
    redis_master_link_up{namespace="zznamespacezz",cluster="zzclusterzz"} == 0
  for: 5m
  labels:
    severity: warning
    namespace: zznamespacezz
- alert: ValkeyCacheRestarting
  annotations:
    summary: Valkey node keeps restarting
    description: |-
      Valkey node {{ $labels.pod }} of cache "zznamespacezz/zzclusterzz" restarted {{ $value }} times in
      30 minutes. Each restart of a node without persistence starts it empty (a primary then fails over).
  expr: |
    changes(redis_start_time_seconds{namespace="zznamespacezz",cluster="zzclusterzz"}[30m]) > 2
  labels:
    severity: warning
    namespace: zznamespacezz
- alert: ValkeyCacheWritesRejected
  annotations:
    summary: Valkey rejects writes at maxmemory
    description: |-
      Node {{ $labels.pod }} of cache "zznamespacezz/zzclusterzz" answered {{ $value | humanize }} writes
      with OOM in 5 minutes: it is at maxmemory and the eviction policy (noeviction, or volatile-* with
      too few keys that have a TTL) can't make room. Give the cache more memory or shards, or an
      allkeys-* policy.
  expr: |
    increase(redis_errors_total{namespace="zznamespacezz",cluster="zzclusterzz",err="OOM"}[5m]) > 0
  labels:
    severity: warning
    namespace: zznamespacezz
- alert: ValkeyCacheTooManyConnections
  annotations:
    summary: Valkey close to maxclients
    description: |-
      Node {{ $labels.pod }} of cache "zznamespacezz/zzclusterzz" uses {{ $value | humanizePercentage }}
      of maxclients. New connections are refused at the limit; check for clients without a pool.
  expr: |
    redis_connected_clients{namespace="zznamespacezz",cluster="zzclusterzz"}
      / redis_config_maxclients{namespace="zznamespacezz",cluster="zzclusterzz"} > 0.8
  for: 10m
  labels:
    severity: warning
    namespace: zznamespacezz
- alert: ValkeyCacheEvicting
  annotations:
    summary: Valkey evicts keys continuously
    description: |-
      Cache "zznamespacezz/zzclusterzz" has evicted {{ $value | humanize }} keys per second for an hour:
      entries leave before they expire. Fine for an LRU cache, but if the hit ratio drops with it, the
      working set doesn't fit: add memory or shards.
  expr: |
    sum by (namespace, cluster) (rate(redis_evicted_keys_total{namespace="zznamespacezz",cluster="zzclusterzz"}[10m])) > 1
  for: 1h
  labels:
    severity: info
    namespace: zznamespacezz
- alert: ValkeyCacheLowHitRatio
  annotations:
    summary: Valkey cache hit ratio is low
    description: |-
      Only {{ $value | humanizePercentage }} of the lookups on cache "zznamespacezz/zzclusterzz" hit in the
      last hour. Check the keys (normalisation, model and prompt versions in the key), the TTLs, the
      semantic threshold, and whether evictions push entries out.
  expr: |
    (
      sum by (namespace, cluster) (rate(redis_keyspace_hits_total{namespace="zznamespacezz",cluster="zzclusterzz"}[1h]))
      / (
        sum by (namespace, cluster) (rate(redis_keyspace_hits_total{namespace="zznamespacezz",cluster="zzclusterzz"}[1h]))
        + sum by (namespace, cluster) (rate(redis_keyspace_misses_total{namespace="zznamespacezz",cluster="zzclusterzz"}[1h]))
      )
    ) < 0.2
      and on (namespace, cluster)
    sum by (namespace, cluster) (rate(redis_keyspace_misses_total{namespace="zznamespacezz",cluster="zzclusterzz"}[1h])) > 1
  for: 1h
  labels:
    severity: info
    namespace: zznamespacezz
