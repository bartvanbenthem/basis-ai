app:
  title: BASIS
  baseUrl: http://localhost:3000

  # CNPG-only portal: load just the catalog (for the PostgresCluster entities),
  # the basis plugin, and the platform's documentation (TechDocs) and API
  # reference (API docs) instead of every plugin in packages/app/package.json.
  # Search provides the search API the TechDocs reader's search bar needs.
  packages:
    include:
      - '@backstage/plugin-catalog'
      - '@backstage/plugin-techdocs'
      - '@backstage/plugin-api-docs'
      - '@backstage/plugin-search'
      - '@internal/backstage-plugin-basis'

  extensions:
    # The BASIS theme (packages/app/src/modules/theme) is the only theme.
    - theme:app/light: false
    - theme:app/dark: false

organization:
  name: CNPG Platform

backend:
  # Used for enabling authentication, secret is shared by all backend plugins
  # See https://backstage.io/docs/auth/service-to-service-auth for
  # information on the format
  # auth:
  #   keys:
  #     - secret: ${BACKEND_SECRET}
  baseUrl: http://localhost:7007
  listen:
    port: 7007
    # Uncomment the following host directive to bind to specific interfaces
    # host: 127.0.0.1
  csp:
    connect-src: ["'self'", 'http:', 'https:']
    # The cluster pages embed the CNPG Grafana dashboards in an iframe.
    frame-src: ["'self'", 'http:', 'https:']
    # Content-Security-Policy directives follow the Helmet format: https://helmetjs.github.io/#reference
    # Default Helmet Content-Security-Policy values can be removed by setting the key to false
  cors:
    origin: http://localhost:3000
    methods: [GET, HEAD, PATCH, POST, PUT, DELETE]
    credentials: true
  # This is for local development only, it is not recommended to use this in production
  # The production database configuration is stored in app-config.production.yaml
  database:
    client: better-sqlite3
    connection: ':memory:'
  # see https://backstage.io/docs/ai/mcp-actions#actions-configuration for more details
  actions:
    pluginSources:
      - auth
      - catalog
      - scaffolder
      # The platform's own tools: projects, GenAI stacks, model gateways (plugins/basis-backend/src/actions.ts)
      - basis
  # workingDirectory: /tmp # Use this to configure a working directory for the scaffolder, defaults to the OS temp-dir

integrations:
  github:
    - host: github.com
      # This is a Personal Access Token or PAT from GitHub. You can find out how to generate this token, and more information
      # about setting up the GitHub integration here: https://backstage.io/docs/integrations/github/locations#configuration
      token: ${GITHUB_TOKEN}
    ### Example for how to add your GitHub Enterprise instance using the API:
    # - host: ghe.example.net
    #   apiBaseUrl: https://ghe.example.net/api/v3
    #   token: ${GHE_TOKEN}

proxy:
  ### Example for how to add a proxy endpoint for the frontend.
  ### A typical reason to do this is to handle HTTPS and CORS for internal services.
  # endpoints:
  #   '/test':
  #     target: 'https://example.com'
  #     changeOrigin: true

# Reference documentation http://backstage.io/docs/features/techdocs/configuration
# Note: After experimenting with basic setup, use CI/CD to generate docs
# and an external cloud storage when deploying TechDocs for production use-case.
# https://backstage.io/docs/features/techdocs/how-to-guides#how-to-migrate-from-techdocs-basic-to-recommended-deployment-approach
techdocs:
  builder: 'local' # Alternatives - 'external'
  generator:
    # MkDocs from PATH, as in the image (see README: .techdocs-venv). 'docker'
    # doesn't work with rootless podman: Backstage runs the container as the
    # host uid, which can't read its own bind mounts there.
    runIn: 'local'
  publisher:
    type: 'local' # Alternatives - 'googleGcs' or 'awsS3'. Read documentation for using alternatives.

auth:
  # see https://backstage.io/docs/auth/ to learn about auth providers
  providers:
    # See https://backstage.io/docs/auth/guest/provider
    guest: {}
  # see https://backstage.io/docs/ai/mcp-actions#client-id-metadata-documents
  # to learn more about client id metadata documents
  clientIdMetadataDocuments:
    enabled: false
    # Optional: restrict which `client_id` URLs are allowed (defaults to ['*'])
    # allowedClientIdPatterns:
    #   - 'https://example.com/*'
    #   - 'https://*.trusted-domain.com/*'
    # Optional: restrict which redirect URIs are allowed (defaults to ['*'])
    # allowedRedirectUriPatterns:
    #   - 'http://localhost:*'
    #   - 'https://*.example.com/*'

scaffolder:
  # see https://backstage.io/docs/features/software-templates/configuration for software template options

catalog:
  import:
    entityFilename: catalog-info.yaml
    pullRequestBranchName: backstage-integration
  rules:
    - allow: [Component, System, API, Resource, Location]
  locations:
    # Local example data, file locations are relative to the backend process, typically `packages/backend`
    - type: file
      target: ../../examples/entities.yaml

    # Software Template: provision a PostgresCluster
    - type: file
      target: ../../templates/postgres-cluster/template.yaml
      rules:
        - allow: [Template]

    # Software Template: create a Project (namespace + Prometheus + Grafana)
    - type: file
      target: ../../templates/project/template.yaml
      rules:
        - allow: [Template]

    # Software Template: provision a ValkeyCache (exact or semantic cache)
    - type: file
      target: ../../templates/valkey-cache/template.yaml
      rules:
        - allow: [Template]

    # Software Template: provision a GenAIStack (retrieval, cache, gateway, wiring)
    - type: file
      target: ../../templates/genai-stack/template.yaml
      rules:
        - allow: [Template]

    # Software Template: provision a ModelGateway (shared gateway to a project's models)
    - type: file
      target: ../../templates/model-gateway/template.yaml
      rules:
        - allow: [Template]

    # The platform itself: its docs (TechDocs) and API reference (API docs)
    - type: file
      target: ../../catalog/catalog-info.yaml
      rules:
        - allow: [System]
    - type: file
      target: ../../catalog/apis.yaml
      rules:
        - allow: [API]

    # Local example organizational data
    - type: file
      target: ../../examples/org.yaml
      rules:
        - allow: [User, Group]

    ## Uncomment these lines to add more example data
    # - type: url
    #   target: https://github.com/backstage/backstage/blob/master/packages/catalog-model/examples/all.yaml

    ## Uncomment these lines to add an example org
    # - type: url
    #   target: https://github.com/backstage/backstage/blob/master/packages/catalog-model/examples/acme-corp.yaml
    #   rules:
    #     - allow: [User, Group]

kubernetes:
  # see https://backstage.io/docs/features/kubernetes/configuration for kubernetes configuration options

# CNPG portal (plugins/basis, plugins/basis-backend)
basis:
  kubernetes:
    # Locally the backend uses your current kubeconfig context; pin one here
    # (or set BASIS_KUBE_CONTEXT) so the portal never points at the wrong cluster.
    context: ${BASIS_KUBE_CONTEXT}
  # Base URL of the Grafana that imports the per-cluster dashboards. Enables
  # the embedded dashboards and "Open in Grafana" links; empty hides them.
  # "{namespace}" is replaced by the cluster's namespace, for setups with one
  # Grafana per namespace (the composition's default instanceSelector).
  # Grafana needs security.allow_embedding=true and a session the browser can
  # use inside an iframe (anonymous viewer, or the same SSO as the portal).
  grafanaUrl: ${BASIS_GRAFANA_URL}
  defaultNamespace: demo
  storageClasses: []
  locations:
    # One Secret per location (Kubernetes cluster), with its kubeconfig.
    namespace: basis-locations
  catalog:
    defaultOwner: group:default/guests
    refreshSeconds: 30
  # The Buckets page: every bucket on the object store account COSI provisions
  # with, read with the COSI driver's keys (deps/cosi/install.sh). The endpoint
  # is the driver's COSI_S3_ENDPOINT; without BASIS_BUCKETS_ENDPOINT the page says
  # no object store is configured.
  buckets:
    endpoint: ${BASIS_BUCKETS_ENDPOINT}
    region: us-east-01
    credentialsSecret:
      namespace: cloudian-cosi
      name: cloudian-cosi-secret

# see https://backstage.io/docs/permissions/getting-started for more on the permission framework
permission:
  # setting this to `false` will disable permissions
  enabled: true

# see https://backstage.io/docs/ai/mcp-actions for more details
mcpActions:
  name: 'BASIS'
  description: >-
    Tools for the BASIS platform: find projects, see their GenAI stacks and model gateways, and create
    new ones (validated first). The catalog and the software templates are tools too.
