info:
  description: |-
    A production-ready PostgreSQL cluster managed by CloudNativePG.

    A Crossplane composite resource on the platform's control plane, namespaced: it lives in its Project's namespace. Use it with `kubectl` (short name `pgc`), GitOps, or the Kubernetes API below; the portal and its software templates create it the same way. This is the CRD Crossplane makes of the XRD (api/apis): the platform's fields plus Crossplane's own (spec.crossplane, status.conditions), so it is what the API server validates: the schema, its defaults and the rules listed under each field.
  title: PostgresCluster (postgres.cndev.nl/v1alpha1)
  version: v1alpha1
openapi: 3.0.3
paths:
  /apis/postgres.cndev.nl/v1alpha1/namespaces/{namespace}/postgresclusters:
    get:
      operationId: listPostgresCluster
      responses:
        "200":
          content:
            application/json:
              schema:
                properties:
                  items:
                    items:
                      $ref: '#/components/schemas/PostgresCluster'
                    type: array
                type: object
          description: OK
        "401":
          description: Not authenticated
        "403":
          description: Not allowed (RBAC), or refused by an admission policy
        "404":
          description: Not found
        "422":
          description: 'Invalid: the schema or one of its rules rejects it'
      summary: List postgresclusters in a namespace
      tags:
        - PostgresCluster
    parameters:
      - description: The Project's namespace
        in: path
        name: namespace
        required: true
        schema:
          type: string
    post:
      operationId: createPostgresCluster
      parameters:
        - description: 'All: validate (schema, rules, admission policies) without persisting'
          in: query
          name: dryRun
          schema:
            enum:
              - All
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostgresCluster'
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostgresCluster'
          description: Created
        "401":
          description: Not authenticated
        "403":
          description: Not allowed (RBAC), or refused by an admission policy
        "404":
          description: Not found
        "409":
          description: Already exists
        "422":
          description: 'Invalid: the schema or one of its rules rejects it'
      summary: Create a PostgresCluster
      tags:
        - PostgresCluster
  /apis/postgres.cndev.nl/v1alpha1/namespaces/{namespace}/postgresclusters/{name}:
    delete:
      operationId: deletePostgresCluster
      responses:
        "200":
          description: Deletion started
        "401":
          description: Not authenticated
        "403":
          description: Not allowed (RBAC), or refused by an admission policy
