apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  description: A Kubernetes cluster the platform runs workloads in (platform.cndev.nl/v1alpha1)
  name: location
  tags:
    - kubernetes
    - crossplane
  title: Location API
spec:
  definition: |
    components:
      schemas:
        Location:
          description: |-
            A Kubernetes cluster the platform can run Projects' databases in.

            Rules:
            - Location names are lowercase letters, digits and "-", start with a letter, max 40 characters
            - "local" is reserved; pick another name
          properties:
            apiVersion:
              enum:
                - platform.cndev.nl/v1alpha1
              type: string
            kind:
              enum:
                - Location
              type: string
            metadata:
              $ref: '#/components/schemas/ObjectMeta'
            spec:
              properties:
                credentials:
                  properties:
                    secretRef:
                      description: 'Secret with a kubeconfig for the cluster: one context, certificates inlined, no exec plugin (provider-kubernetes runs it from inside the control plane). Its identity needs cluster-admin or equivalent.'
                      properties:
                        key:
                          default: kubeconfig
                          type: string
                        name:
                          type: string
                        namespace:
                          type: string
                      required:
                        - namespace
                        - name
                      type: object
                  required:
                    - secretRef
                  type: object
                crossplane:
                  description: 'Set by Crossplane: how it composes this resource. Leave it out; the platform''s composition (location) is the only one, and Crossplane fills in the rest.'
                  properties:
                    compositionRef:
                      description: 'The Composition that composes this resource (default: location).'
                      properties:
                        name:
                          type: string
                      required:
                        - name
                      type: object
                    compositionRevisionRef:
                      description: The Composition revision in use; Crossplane sets it.
                      properties:
                        name:
                          type: string
                      required:
                        - name
                      type: object
                    compositionRevisionSelector:
                      description: Selects the Composition revision by labels (with compositionUpdatePolicy Manual).
                      properties:
                        matchLabels:
                          additionalProperties:
                            type: string
                          type: object
                      required:
                        - matchLabels
                      type: object
                    compositionSelector:
                      description: Selects a Composition by labels instead of compositionRef.
                      properties:
                        matchLabels:
                          additionalProperties:
                            type: string
                          type: object
                      required:
                        - matchLabels
                      type: object
                    compositionUpdatePolicy:
                      default: Automatic
                      description: 'Automatic: move to a new Composition revision as soon as there is one. Manual: stay on compositionRevisionRef.'
                      enum:
                        - Automatic
                        - Manual
                      type: string
                    resourceRefs:
                      description: The resources Crossplane composed for this one (read-only).
                      items:
                        properties:
                          apiVersion:
                            description: ""
                            type: string
                          kind:
                            description: ""
                            type: string
                          name:
                            description: ""
                            type: string
                          namespace:
                            description: ""
                            type: string
                        required:
                          - apiVersion
                          - kind
                        type: object
                      type: array
                  type: object
                description:
                  maxLength: 500
                  type: string
                displayName:
                  maxLength: 100
                  type: string
                environment:
                  enum:
                    - production
                    - acceptance
                    - test
                    - development
                  type: string
                owner:
                  description: Team responsible for the cluster (Backstage group, bare name or entity ref).
                  maxLength: 253
                  type: string
                provider:
                  description: Where the cluster runs.
                  enum:
                    - on-premises
                    - aks
                    - eks
                    - gke
                    - ske
                    - openshift
                    - kind
                    - other
                  type: string
                region:
                  description: Region or data center, e.g. westeurope or dc-amsterdam-2.
                  maxLength: 100
                  type: string
                schedulable:
                  default: true
                  description: Whether new databases may be placed here. False keeps what runs there (and lets it be edited) but refuses PostgresClusters that add this location.
                  type: boolean
