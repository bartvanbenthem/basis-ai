apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  description: 'A generative AI stack in a Project''s site(s): RAG database, cache, model gateway and wiring (ai.cndev.nl/v1alpha1)'
  name: genaistack
  tags:
    - kubernetes
    - crossplane
  title: GenAIStack API
spec:
  definition: |
    components:
      schemas:
        GenAIStack:
          description: |-
            A generative AI stack (retrieval, cache, gateway, wiring) in a Project's site(s).

            Rules:
            - GenAIStack names are lowercase letters, digits and "-", start with a letter, max 28 characters
          properties:
            apiVersion:
              enum:
                - ai.cndev.nl/v1alpha1
              type: string
            kind:
              enum:
                - GenAIStack
              type: string
            metadata:
              $ref: '#/components/schemas/ObjectMeta'
            spec:
              description: |-
                Rules:
                - recovery.activeSite can only be recovery with recovery.enabled; switch back to protected before turning recovery off
                - gateway.models belong to the stack's own gateway; with gateway.ref, add them to the shared ModelGateway
              properties:
                cache:
                  default: {}
                  description: A ValkeyCache per site (<name>-cache, <name>-cache-dr), used by the app for exact or semantic lookups.
                  properties:
                    cpu:
                      default: 500m
                      pattern: ^[0-9]+(\.[0-9]+)?m?$
                      type: string
                    enabled:
                      default: true
                      type: boolean
                    evictionPolicy:
                      default: allkeys-lru
                      enum:
                        - allkeys-lru
                        - allkeys-lfu
                        - allkeys-random
                        - volatile-lru
                        - volatile-lfu
                        - volatile-random
                        - volatile-ttl
                        - noeviction
                      type: string
                    memory:
                      default: 1Gi
                      description: Memory of the active site's cache pod.
                      pattern: ^[0-9]+(Mi|Gi)$
                      type: string
                    mode:
                      default: semantic
                      enum:
                        - exact
                        - semantic
                      type: string
                  type: object
                crossplane:
                  description: 'Set by Crossplane: how it composes this resource. Leave it out; the platform''s composition (genaistack) is the only one, and Crossplane fills in the rest.'
                  properties:
                    compositionRef:
                      description: 'The Composition that composes this resource (default: genaistack).'
                      properties:
                        name:
                          type: string
                      required:
                        - name
                      type: object
                    compositionRevisionRef:
                      description: The Composition revision in use; Crossplane sets it.
                      properties:
                        name:
                          type: string
                      required:
                        - name
                      type: object
                    compositionRevisionSelector:
                      description: Selects the Composition revision by labels (with compositionUpdatePolicy Manual).
                      properties:
                        matchLabels:
                          additionalProperties:
                            type: string
                          type: object
                      required:
                        - matchLabels
                      type: object
                    compositionSelector:
                      description: Selects a Composition by labels instead of compositionRef.
                      properties:
                        matchLabels:
                          additionalProperties:
                            type: string
                          type: object
                      required:
                        - matchLabels
                      type: object
                    compositionUpdatePolicy:
                      default: Automatic
                      description: 'Automatic: move to a new Composition revision as soon as there is one. Manual: stay on compositionRevisionRef.'
                      enum:
                        - Automatic
                        - Manual
                      type: string
                    resourceRefs:
                      description: The resources Crossplane composed for this one (read-only).
                      items:
                        properties:
                          apiVersion:
                            description: ""
                            type: string
                          kind:
                            description: ""
                            type: string
                          name:
                            description: ""
                            type: string
                        required:
                          - apiVersion
                          - kind
                        type: object
                      type: array
                  type: object
                deletionProtection:
                  default: true
                  description: Refuse deleting the stack (and with it its database). Set to false before deleting it.
                  type: boolean
                gateway:
                  default: {}
                  description: 'The stack''s ModelGateway (<name>-gateway, Agent Router in each site''s location, deps/README.md): one internal, OpenAI-compatible endpoint (OPENAI_BASE_URL) routing on the request''s model to the models below, with their provider keys kept in the platform. Or, with ref, a ModelGateway shared with others. Apps authenticate with OPENAI_API_KEY from the connection Secret.'
                  properties:
                    client:
                      description: The stack's client in the shared gateway (spec.clients); the stack's name by default.
                      pattern: ^[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?$
                      type: string
                    enabled:
                      default: true
                      type: boolean
                    models:
                      items:
                        properties:
                          apiKeySecretRef:
                            description: Secret in this namespace holding the provider's API key; none for an endpoint without auth.
                            properties:
                              key:
                                default: apiKey
                                pattern: ^[-._a-zA-Z0-9]+$
                                type: string
                              name:
                                type: string
                            required:
                              - name
                            type: object
                          endpoint:
                            description: Base URL of the provider's API, its path the API prefix, e.g. https://api.openai.com/v1, https://api.anthropic.com/v1 or http://vllm.models.svc:8000/v1 (self-hosted, OpenAI-compatible).
                            pattern: ^https?://[^/:]+(:[0-9]+)?(/.*)?$
                            type: string
                          name:
                            description: The model name apps send (the request's "model").
                            maxLength: 200
                            minLength: 1
                            type: string
                          schema:
                            default: OpenAI
                            description: 'The provider''s API: OpenAI (and every OpenAI-compatible server: vLLM, KServe, Ollama, Mistral, ...) or Anthropic.'
                            enum:
                              - OpenAI
                              - Anthropic
                            type: string
                          upstreamModel:
                            description: The model name at the provider, when it differs from name.
                            maxLength: 200
                            type: string
                        required:
                          - name
                          - endpoint
                        type: object
                      maxItems: 30
                      type: array
                    ref:
                      description: A ModelGateway in this namespace to use instead of one of the stack's own; models are then the gateway's. It needs a client for the stack (client) and, with recovery, a recovery site of its own.
                      pattern: ^[a-z]([-a-z0-9]{0,38}[a-z0-9])?$
                      type: string
                    replicas:
                      default: 2
                      description: Gateway (Envoy) replicas in the active site.
                      maximum: 10
                      minimum: 1
                      type: integer
                  type: object
                recovery:
                  default: {}
                  description: 'A warm standby in the Project''s recovery location (the Project needs one): a replica of the database, a small cold cache and a minimal gateway. activeSite switches the stack over. Turning it off needs activeSite protected; the database switches back first (nothing is lost), then the standby goes.'
                  properties:
                    activeSite:
                      default: protected
                      description: Where the stack serves from. Setting it to recovery switches the database's primary over to the recovery site (and back with protected); the cache and gateway follow once it has moved (status.activeSite).
                      enum:
                        - protected
                        - recovery
                      type: string
                    cacheMemory:
                      default: 512Mi
                      description: Memory of the standby site's cache pod; it gets cache.memory once active.
                      pattern: ^[0-9]+(Mi|Gi)$
                      type: string
                    enabled:
                      default: false
                      type: boolean
                    gatewayReplicas:
                      default: 1
                      description: Gateway (Envoy) replicas in the standby site; it gets gateway.replicas once active.
                      maximum: 10
                      minimum: 0
                      type: integer
                    promotion:
                      default: Switchover
                      description: 'How an activeSite change is carried out (the database''s geoReplication.promotion): Switchover waits for the current primary and loses nothing; Failover promotes the other site right away, for when the active site is down, and loses what it had not archived yet.'
                      enum:
                        - Switchover
                        - Failover
                      type: string
                  type: object
                retrieval:
                  default: {}
                  description: The RAG database, a PostgresCluster (profile vector, PostgreSQL 18) named <name>-db.
                  properties:
                    backup:
                      default: false
                      description: Continuous backups to the Project's bucket (point-in-time restore). Always on with recovery, whose replica is fed from them.
                      type: boolean
                    extensions:
                      default:
                        - vector
                      description: Extensions in the database (from the postgres-extensions catalog).
                      items:
                        type: string
                      type: array
                    instances:
                      default: 3
                      maximum: 9
                      minimum: 1
                      type: integer
                    size:
                      description: A size from the postgres-sizes catalog (e.g. s, m). Unset, 500m CPU and 1Gi memory.
                      type: string
                    storageSize:
                      default: 20Gi
                      pattern: ^[0-9]+(Mi|Gi|Ti)$
                      type: string
                  type: object
              type: object
            status:
              properties:
                activeSite:
                  description: The site that serves (where the database's primary runs).
                  type: string
                components:
                  description: Names of the composed APIs in this namespace.
                  properties:
                    cache:
                      type: string
                    database:
                      type: string
                    gateway:
                      type: string
                    recoveryCache:
                      type: string
                  type: object
                conditions:
                  description: Conditions of the resource, one per type. Crossplane sets Ready (every composed resource is ready) and Synced (the last reconcile succeeded); the composition adds its own, e.g. PostgresReady.
                  items:
                    properties:
                      lastTransitionTime:
                        format: date-time
                        type: string
                      message:
                        description: Human-readable detail
                        type: string
                      observedGeneration:
                        format: int64
                        type: integer
                      reason:
                        description: Machine-readable reason, e.g. Available, ReconcileSuccess
                        type: string
                      status:
                        enum:
                          - "True"
                          - "False"
                          - Unknown
                        type: string
                      type:
                        description: e.g. Ready, Synced
                        type: string
                    required:
                      - type
                      - status
                      - reason
                      - lastTransitionTime
                    type: object
                  type: array
                connectionSecret:
                  description: The Secret with every endpoint and credential, in the project namespace of each site's location.
                  type: string
                message:
                  type: string
                models:
                  type: integer
                ready:
                  type: boolean
                sites:
                  items:
                    properties:
                      active:
                        type: boolean
                      cacheEndpoint:
                        type: string
                      databaseEndpoint:
                        type: string
                      gatewayEndpoint:
                        type: string
                      location:
                        type: string
                      site:
                        type: string
                    type: object
                  type: array
              type: object
          required:
            - apiVersion
            - kind
            - metadata
          type: object
        ObjectMeta:
          description: Standard Kubernetes object metadata (the fields that matter here).
          properties:
            annotations:
              additionalProperties:
                type: string
              type: object
            labels:
              additionalProperties:
                type: string
              type: object
            name:
              type: string
            namespace:
              type: string
          required:
            - name
          type: object
      securitySchemes:
        bearerAuth:
          description: A Kubernetes token (OIDC or ServiceAccount) with RBAC on genaistacks.ai.cndev.nl
          scheme: bearer
          type: http
    info:
      description: |-
        A generative AI stack (retrieval, cache, gateway, wiring) in a Project's site(s).

        A Crossplane composite resource on the platform's control plane, namespaced: it lives in its Project's namespace. Use it with `kubectl` (short name `gstack`), GitOps, or the Kubernetes API below; the portal and its software templates create it the same way. This is the CRD Crossplane makes of the XRD (api/apis): the platform's fields plus Crossplane's own (spec.crossplane, status.conditions), so it is what the API server validates: the schema, its defaults and the rules listed under each field.
      title: GenAIStack (ai.cndev.nl/v1alpha1)
      version: v1alpha1
    openapi: 3.0.3
    paths:
      /apis/ai.cndev.nl/v1alpha1/namespaces/{namespace}/genaistacks:
        get:
          operationId: listGenAIStack
          responses:
            "200":
              content:
