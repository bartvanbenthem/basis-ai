              schema:
                enum:
                  - All
                type: string
          requestBody:
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/Project'
            required: true
          responses:
            "201":
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Project'
              description: Created
            "401":
              description: Not authenticated
            "403":
              description: Not allowed (RBAC), or refused by an admission policy
            "404":
              description: Not found
            "409":
              description: Already exists
            "422":
              description: 'Invalid: the schema or one of its rules rejects it'
          summary: Create a Project
          tags:
            - Project
      /apis/platform.cndev.nl/v1alpha1/projects/{name}:
        delete:
          operationId: deleteProject
          responses:
            "200":
              description: Deletion started
            "401":
              description: Not authenticated
            "403":
              description: Not allowed (RBAC), or refused by an admission policy
            "404":
              description: Not found
            "422":
              description: 'Invalid: the schema or one of its rules rejects it'
          summary: Delete a Project
          tags:
            - Project
        get:
          operationId: readProject
          responses:
            "200":
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Project'
              description: OK
            "401":
