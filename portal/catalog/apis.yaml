apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  description: An exact or semantic Valkey cache for an AI service (cache.cndev.nl/v1alpha1), namespaced in its Project
  name: valkeycache
  tags:
    - kubernetes
    - crossplane
  title: ValkeyCache API
spec:
  definition: |
    components:
      schemas:
        ObjectMeta:
          description: Standard Kubernetes object metadata (the fields that matter here).
          properties:
            annotations:
              additionalProperties:
                type: string
              type: object
            labels:
              additionalProperties:
                type: string
              type: object
            name:
              type: string
            namespace:
              type: string
          required:
            - name
          type: object
        ValkeyCache:
          description: |-
            A Valkey cache (exact or semantic) for an AI service, in its Project's location.

            Rules:
            - ValkeyCache names are lowercase letters, digits and "-", start with a letter, max 40 characters
          properties:
            apiVersion:
              enum:
                - cache.cndev.nl/v1alpha1
              type: string
            kind:
              enum:
                - ValkeyCache
              type: string
            metadata:
              $ref: '#/components/schemas/ObjectMeta'
            spec:
              description: |-
                Rules:
                - mode can't change; create a new cache
                - site can't change; create a new cache in the other site
              properties:
                crossplane:
                  description: 'Set by Crossplane: how it composes this resource. Leave it out; the platform''s composition (valkeycache) is the only one, and Crossplane fills in the rest.'
                  properties:
                    compositionRef:
                      description: 'The Composition that composes this resource (default: valkeycache).'
                      properties:
                        name:
                          type: string
                      required:
                        - name
                      type: object
                    compositionRevisionRef:
                      description: The Composition revision in use; Crossplane sets it.
                      properties:
                        name:
                          type: string
                      required:
                        - name
                      type: object
                    compositionRevisionSelector:
                      description: Selects the Composition revision by labels (with compositionUpdatePolicy Manual).
                      properties:
                        matchLabels:
                          additionalProperties:
                            type: string
                          type: object
                      required:
                        - matchLabels
                      type: object
                    compositionSelector:
                      description: Selects a Composition by labels instead of compositionRef.
                      properties:
                        matchLabels:
                          additionalProperties:
                            type: string
                          type: object
                      required:
                        - matchLabels
                      type: object
                    compositionUpdatePolicy:
                      default: Automatic
                      description: 'Automatic: move to a new Composition revision as soon as there is one. Manual: stay on compositionRevisionRef.'
                      enum:
                        - Automatic
                        - Manual
                      type: string
                    resourceRefs:
                      description: The resources Crossplane composed for this one (read-only).
                      items:
                        properties:
                          apiVersion:
                            description: ""
                            type: string
                          kind:
                            description: ""
                            type: string
                          name:
                            description: ""
                            type: string
                        required:
                          - apiVersion
                          - kind
                        type: object
                      type: array
                  type: object
                evictionPolicy:
                  default: allkeys-lru
                  description: What goes when maxmemory is reached (maxmemory-policy). allkeys-lru suits a cache; volatile-* only evicts keys with a TTL; noeviction refuses writes instead.
                  enum:
                    - allkeys-lru
                    - allkeys-lfu
                    - allkeys-random
                    - volatile-lru
                    - volatile-lfu
                    - volatile-random
                    - volatile-ttl
                    - noeviction
                  type: string
                maxMemoryPercent:
                  default: 75
                  description: Share of the pod's memory Valkey fills with keys before evicting (maxmemory). The rest is for replication buffers, fragmentation and, in semantic mode, index building.
                  maximum: 90
                  minimum: 10
                  type: integer
                mode:
                  default: exact
                  description: 'exact: plain key/value with TTLs (hashed prompt plus context, tool, SQL and search results). semantic: also loads the valkey-search module (FT.CREATE / FT.SEARCH, HNSW/KNN vector search) for embedding-based hits, e.g. LiteLLM''s valkey-semantic cache. Fixed after creation.'
                  enum:
                    - exact
                    - semantic
                  type: string
                monitoring:
                  default: {}
                  properties:
                    enabled:
                      default: true
                      description: Run the redis_exporter sidecar and a PodMonitor for it, scraped by the Project's Prometheus (semantic caches add valkey-search's module metrics).
                      type: boolean
                    grafanaDashboard:
                      default: {}
                      properties:
                        allowCrossNamespaceImport:
                          default: false
                          description: Allow a Grafana in another namespace to import this dashboard.
                          type: boolean
                        datasourceName:
                          default: prometheus
                          description: Name of the Prometheus datasource in Grafana.
                          type: string
                        enabled:
                          default: true
                          description: Create a grafana-operator GrafanaDashboard with the Valkey cache dashboard, preselected on this cache.
                          type: boolean
                        folder:
                          default: Valkey
                          type: string
                        instanceSelector:
                          additionalProperties:
                            type: string
                          description: matchLabels selecting the Grafana instance(s). Defaults to dashboards.paas.cndev.nl/scope=<namespace>.
                          type: object
                      type: object
                    podMonitorLabels:
                      additionalProperties:
                        type: string
                      description: Extra labels on the PodMonitor/PrometheusRule, to match your Prometheus' selectors.
                      type: object
                    prometheusRule:
                      default: {}
                      properties:
                        enabled:
                          default: true
                          description: Create a PrometheusRule with the cache alerts (node down, cluster state, slots, replica link, restarts, rejected writes, connections, eviction, hit ratio).
                          type: boolean
                        excludeRules:
                          description: Alert names to leave out, e.g. [ValkeyCacheLowHitRatio].
                          items:
                            type: string
                          type: array
                      type: object
                  type: object
                replicas:
                  default: 1
                  description: Replicas per shard. A replica takes over when its primary fails, so the cache stays warm; 0 loses that shard's keys on every pod restart.
                  maximum: 5
                  minimum: 0
                  type: integer
                resources:
                  default: {}
                  description: CPU and memory for each Valkey pod (memory is request and limit).
                  properties:
                    cpu:
                      default: 500m
                      pattern: ^[0-9]+(\.[0-9]+)?m?$
                      type: string
                    memory:
                      default: 1Gi
                      description: Mi or Gi; maxmemory is maxMemoryPercent of this.
                      pattern: ^[0-9]+(Mi|Gi)$
                      type: string
                  type: object
                shards:
                  default: 1
                  description: Primaries the keyspace is spread over (Valkey cluster mode). Grow for more memory or write throughput, with a cluster-aware client. Clients without cluster support (e.g. LiteLLM's valkey-semantic cache) need 1 shard and 0 replicas, so the Service always reaches the primary.
                  maximum: 16
                  minimum: 1
                  type: integer
                site:
                  default: protected
                  description: 'Which of the Project''s locations the cache runs in: protected (default) or recovery (the Project needs one). Caches don''t replicate between sites: for a cache next to workloads in both, create one per site. Fixed after creation.'
                  enum:
                    - protected
                    - recovery
                  type: string
              type: object
            status:
              properties:
                conditions:
                  description: Conditions of the resource, one per type. Crossplane sets Ready (every composed resource is ready) and Synced (the last reconcile succeeded); the composition adds its own, e.g. PostgresReady.
                  items:
                    properties:
                      lastTransitionTime:
                        format: date-time
                        type: string
                      message:
                        description: Human-readable detail
                        type: string
                      observedGeneration:
                        format: int64
                        type: integer
                      reason:
                        description: Machine-readable reason, e.g. Available, ReconcileSuccess
                        type: string
                      status:
                        enum:
                          - "True"
                          - "False"
                          - Unknown
                        type: string
                      type:
                        description: e.g. Ready, Synced
                        type: string
                    required:
                      - type
                      - status
                      - reason
                      - lastTransitionTime
                    type: object
                  type: array
                endpoint:
                  description: host:port of the cluster's Service in the location (any node; cluster-mode clients follow redirects).
                  type: string
                location:
                  description: The Project's location for spec.site, pinned on first use.
                  type: string
                message:
                  type: string
                modules:
                  description: Modules loaded (search in semantic mode).
                  items:
                    type: string
                  type: array
                monitoring:
                  properties:
                    dashboardUid:
                      description: uid of the GrafanaDashboard in the Project's Grafana.
                      type: string
                  type: object
                ready:
                  type: boolean
                readyShards:
                  type: integer
                secret:
                  description: Secret in this namespace on the control plane with username, password, host, port and uri (valkey://). A copy is in the location for workloads there.
                  type: string
                shards:
                  type: integer
                site:
                  description: The site (spec.site) the cache runs in.
                  type: string
                state:
                  description: The ValkeyCluster's state (Initializing, Reconciling, Ready, Degraded, Failed).
                  type: string
              type: object
          required:
            - apiVersion
            - kind
            - metadata
          type: object
      securitySchemes:
        bearerAuth:
          description: A Kubernetes token (OIDC or ServiceAccount) with RBAC on valkeycaches.cache.cndev.nl
          scheme: bearer
          type: http
    info:
      description: |-
