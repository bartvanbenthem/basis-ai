apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  description: An OpenAI-compatible gateway to a Project's models, hosted and self-hosted, with a key per client (ai.cndev.nl/v1alpha1)
  name: modelgateway
  tags:
    - kubernetes
    - crossplane
  title: ModelGateway API
spec:
  definition: |
    components:
      schemas:
        ModelGateway:
          description: |-
            An OpenAI-compatible gateway to a Project's models (Agent Router), in its site(s).

            Rules:
            - ModelGateway names are lowercase letters, digits and "-", start with a letter, max 40 characters
          properties:
            apiVersion:
              enum:
                - ai.cndev.nl/v1alpha1
              type: string
            kind:
              enum:
                - ModelGateway
              type: string
            metadata:
              $ref: '#/components/schemas/ObjectMeta'
            spec:
              description: |-
                Rules:
