                    cloudnativepg:
                      type: boolean
                    prometheusOperator:
                      type: boolean
                    valkey:
                      description: The Valkey operator, which ValkeyCaches need (optional).
                      type: boolean
                  type: object
                providerConfig:
                  description: The provider-kubernetes ClusterProviderConfig compositions place objects through.
                  type: string
                ready:
                  description: Connected and both operators installed.
                  type: boolean
              type: object
          required:
            - apiVersion
            - kind
            - metadata
          type: object
        ObjectMeta:
          description: Standard Kubernetes object metadata (the fields that matter here).
