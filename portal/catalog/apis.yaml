apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  description: A team's namespace with its locations, access, quota, Prometheus and Grafana (platform.cndev.nl/v1alpha1)
  name: project
  tags:
    - kubernetes
    - crossplane
  title: Project API
spec:
  definition: |
    components:
      schemas:
        ObjectMeta:
          description: Standard Kubernetes object metadata (the fields that matter here).
          properties:
            annotations:
              additionalProperties:
                type: string
              type: object
            labels:
              additionalProperties:
                type: string
              type: object
            name:
              type: string
            namespace:
              type: string
          required:
            - name
          type: object
        Project:
          description: |-
            A team's namespace with its own Prometheus and Grafana, ready for PostgresClusters.

            Rules:
            - Project names are lowercase letters, digits and "-", start with a letter, max 40 characters
            - this name is reserved for a system namespace
            - Project names can't contain "--"
          properties:
            apiVersion:
              enum:
                - platform.cndev.nl/v1alpha1
              type: string
            kind:
              enum:
                - Project
              type: string
            metadata:
              $ref: '#/components/schemas/ObjectMeta'
            spec:
              properties:
                access:
                  description: Kubernetes groups (from your IdP) that get a RoleBinding in the namespace, on the control plane (to manage PostgresClusters) and in each location (to see what runs there).
                  items:
                    properties:
                      group:
                        minLength: 1
                        type: string
                      role:
                        description: Built-in ClusterRole to bind. edit and admin include PostgresClusters.
                        enum:
                          - admin
                          - edit
                          - view
                        type: string
                    required:
                      - group
                      - role
                    type: object
                  maxItems: 20
                  type: array
                backup:
                  default: {}
                  description: 'An object storage bucket for the project''s database backups, provisioned through COSI (Container Object Storage Interface) on the control plane, with credentials of its own for each location, in the project namespace. PostgresClusters with backups and no destinationPath of their own use it, which is what geo replication needs: both sites archive to and recover from the same bucket. The COSI classes come from project-defaults (backup.cosi) unless set here.'
                  properties:
                    bucket:
                      default: true
                      description: Provision the bucket (only when a BucketClass and BucketAccessClass are known).
                      type: boolean
                    bucketAccessClassName:
                      description: COSI BucketAccessClass. Its driver must hand out S3 keys (the locations use them, not a ServiceAccount on the control plane).
                      type: string
                    bucketClassName:
                      description: |-
                        An existing COSI BucketClass to use instead of the project's own (project-<name>-backups, or prj-<first 16 of name>-<hash> for a name over 11 characters, deletionPolicy Retain, driver from project-defaults). Use one with deletionPolicy Retain: a Delete class deletes the bucket, and every backup in it, with the Project.

                        Rules:
                        - bucketClassName can't change; it would provision a new, empty bucket
                      type: string
                  type: object
                crossplane:
                  description: 'Set by Crossplane: how it composes this resource. Leave it out; the platform''s composition (project) is the only one, and Crossplane fills in the rest.'
                  properties:
                    compositionRef:
                      description: 'The Composition that composes this resource (default: project).'
                      properties:
                        name:
                          type: string
                      required:
                        - name
                      type: object
                    compositionRevisionRef:
                      description: The Composition revision in use; Crossplane sets it.
                      properties:
                        name:
                          type: string
                      required:
                        - name
                      type: object
                    compositionRevisionSelector:
                      description: Selects the Composition revision by labels (with compositionUpdatePolicy Manual).
                      properties:
                        matchLabels:
                          additionalProperties:
                            type: string
                          type: object
                      required:
                        - matchLabels
                      type: object
                    compositionSelector:
                      description: Selects a Composition by labels instead of compositionRef.
                      properties:
                        matchLabels:
                          additionalProperties:
                            type: string
                          type: object
                      required:
                        - matchLabels
                      type: object
                    compositionUpdatePolicy:
                      default: Automatic
                      description: 'Automatic: move to a new Composition revision as soon as there is one. Manual: stay on compositionRevisionRef.'
                      enum:
                        - Automatic
                        - Manual
                      type: string
                    resourceRefs:
                      description: The resources Crossplane composed for this one (read-only).
                      items:
                        properties:
                          apiVersion:
                            description: ""
                            type: string
                          kind:
                            description: ""
                            type: string
                          name:
                            description: ""
                            type: string
                          namespace:
                            description: ""
                            type: string
                        required:
                          - apiVersion
                          - kind
                        type: object
                      type: array
                  type: object
                deletionProtection:
                  default: true
                  description: While true, the API server refuses to delete this Project (and its namespace, which would take every database in it along). Set to false first to delete the project on purpose.
                  type: boolean
                description:
                  maxLength: 200
                  type: string
                locations:
                  description: |-
                    Locations (Kubernetes clusters registered with the platform) the project's databases run in. The control plane itself runs none.

                    Rules:
                    - locations.protected can't be changed; its databases run there
                    - locations.recovery can be added, but not changed or removed; replica clusters run there
                    - the recovery location must be another location than the protected one
                  properties:
                    protected:
                      description: Where the project's databases run (their primary, normally).
                      pattern: ^[a-z]([-a-z0-9]{0,38}[a-z0-9])?$
                      type: string
                    recovery:
                      description: Where PostgresClusters with geoReplication keep a replica cluster, which can take over as primary. Optional; can be added later.
                      pattern: ^[a-z]([-a-z0-9]{0,38}[a-z0-9])?$
                      type: string
                  required:
                    - protected
                  type: object
                observability:
                  default: {}
                  properties:
                    grafana:
                      default: {}
                      description: Grafana that imports the namespace's GrafanaDashboards, with a "prometheus" datasource pointing at the project's Prometheus, anonymous Viewer access and embedding allowed (for the portal).
                      properties:
                        enabled:
                          default: true
                          type: boolean
                        ingress:
                          default: true
                          description: Expose Grafana through the ingress configured in the project-defaults EnvironmentConfig.
                          type: boolean
                      type: object
                    prometheus:
                      default: {}
                      description: Prometheus in each location that scrapes every PodMonitor and PrometheusRule in the namespace there, and one on the control plane that receives their samples (remote write) for Grafana. Settings apply to all of them.
                      properties:
                        enabled:
                          default: true
                          type: boolean
                        resources:
                          default: {}
                          properties:
                            limits:
                              default: {}
                              properties:
                                memory:
                                  default: 2Gi
                                  type: string
                              type: object
                            requests:
                              default: {}
                              properties:
                                cpu:
                                  default: 100m
                                  type: string
                                memory:
                                  default: 512Mi
                                  type: string
                              type: object
                          type: object
                        retention:
                          default: 7d
                          pattern: ^[0-9]+(h|d|w|y)$
                          type: string
                        storage:
                          default: {}
                          description: |-
                            Rules:
                            - the Prometheus volume can grow but not shrink
                            - storageClass cannot be changed after creation
                          properties:
                            size:
                              default: 10Gi
                              pattern: ^[0-9]+(Mi|Gi|Ti)$
                              type: string
                            storageClass:
                              type: string
                          type: object
                      type: object
                  type: object
                owner:
                  description: Backstage group that owns the project (bare name, e.g. team-payments). Set as the backstage.io/owner label on the namespace.
                  maxLength: 63
                  pattern: ^([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9]$
                  type: string
                quota:
                  description: Caps on what the namespace may request in total, in each location. Also adds a LimitRange with default requests, which a ResourceQuota on cpu/memory needs for pods that don't set their own.
                  properties:
                    cpu:
                      description: Total CPU requests, e.g. "8".
                      pattern: ^[0-9]+(\.[0-9]+)?m?$
                      type: string
                    memory:
                      description: Total memory requests and limits, e.g. 32Gi.
                      pattern: ^[0-9]+(Mi|Gi|Ti)$
                      type: string
                    storage:
                      description: Total PVC storage requests, e.g. 200Gi.
                      pattern: ^[0-9]+(Mi|Gi|Ti)$
                      type: string
                  type: object
              required:
                - locations
              type: object
            status:
              properties:
                backup:
                  description: The project's backup bucket; unset without one.
                  properties:
                    bucket:
                      description: Bucket name in the object store.
                      type: string
                    credentials:
                      additionalProperties:
                        type: string
                      description: Per location, the Secret in that namespace with its S3 keys (ACCESS_KEY_ID, ACCESS_SECRET_KEY, REGION).
                      type: object
                    destinationPath:
                      description: Where PostgresClusters using the bucket archive to (Barman Cloud destinationPath).
                      type: string
                    endpoint:
                      type: string
                    namespace:
                      description: Namespace on the control plane with the bucket's COSI objects and credentials (the project's).
                      type: string
                    reachability:
                      description: 'Per location, whether it reaches the bucket: a CronJob there (backup-check in the project namespace) writes, reads back and deletes platform-check/<location> with that location''s keys every few minutes. Its last failed job''s log says why.'
                      items:
                        properties:
                          lastCheckTime:
                            type: string
                          lastSuccessTime:
                            type: string
                          location:
                            type: string
                          state:
                            description: Pending (no check yet), Reachable, Unreachable (the last check failed) or Checking (one runs after a failure).
                            type: string
                        type: object
                      type: array
                    ready:
                      description: Provisioned, and credentials for every location are in place.
                      type: boolean
                    region:
                      type: string
                    servers:
                      description: 'The backup folders in the bucket (Barman server names), one per PostgresCluster site that archives there. Entries stay after their cluster is deleted (active false): the bucket keeps the backups, and a new PostgresCluster can restore from them (spec.restore.source.serverName).'
                      items:
                        properties:
                          active:
                            description: Whether that cluster still archives to it.
                            type: boolean
                          cluster:
                            description: The PostgresCluster that archives (or archived) to it.
                            type: string
                          database:
                            type: string
                          firstRecoverabilityPoint:
                            type: string
                          lastSuccessfulBackup:
                            type: string
                          location:
                            type: string
                          owner:
                            type: string
                          postgresVersion:
                            type: integer
                          serverName:
                            type: string
                        type: object
                      type: array
                  type: object
                conditions:
                  description: Conditions of the resource, one per type. Crossplane sets Ready (every composed resource is ready) and Synced (the last reconcile succeeded); the composition adds its own, e.g. PostgresReady.
                  items:
                    properties:
                      lastTransitionTime:
                        format: date-time
                        type: string
                      message:
                        description: Human-readable detail
                        type: string
                      observedGeneration:
                        format: int64
                        type: integer
                      reason:
                        description: Machine-readable reason, e.g. Available, ReconcileSuccess
                        type: string
                      status:
                        enum:
                          - "True"
                          - "False"
                          - Unknown
                        type: string
                      type:
                        description: e.g. Ready, Synced
                        type: string
                    required:
                      - type
                      - status
                      - reason
                      - lastTransitionTime
                    type: object
                  type: array
                grafana:
                  properties:
                    adminSecret:
                      description: Secret in the namespace with GF_SECURITY_ADMIN_USER / GF_SECURITY_ADMIN_PASSWORD.
                      type: string
                    instanceSelector:
                      additionalProperties:
                        type: string
                      description: Labels a GrafanaDashboard/GrafanaDatasource must select to land in this Grafana.
                      type: object
                    internalUrl:
                      type: string
                    url:
                      description: URL for browsers (the ingress host); unset without ingress.
                      type: string
                  type: object
                locations:
                  description: Per location (protected first), whether its namespace and Prometheus are ready.
                  items:
                    properties:
                      location:
                        type: string
                      message:
                        type: string
                      ready:
                        type: boolean
                      site:
                        description: protected or recovery.
                        type: string
                    type: object
                  type: array
                message:
                  type: string
                namespace:
                  type: string
                prometheus:
                  properties:
                    remoteWriteUrl:
                      description: Where the Prometheus in the project's locations sends its samples; unset without remoteWrite in project-defaults.
                      type: string
                    url:
                      description: In-cluster URL.
                      type: string
                  type: object
                ready:
                  type: boolean
              type: object
          required:
            - apiVersion
            - kind
            - metadata
          type: object
      securitySchemes:
        bearerAuth:
          description: A Kubernetes token (OIDC or ServiceAccount) with RBAC on projects.platform.cndev.nl
          scheme: bearer
          type: http
    info:
      description: |-
        A team's namespace with its own Prometheus and Grafana, ready for PostgresClusters.

        A Crossplane composite resource on the platform's control plane, cluster-scoped. Use it with `kubectl` (short name `proj`), GitOps, or the Kubernetes API below; the portal and its software templates create it the same way. This is the CRD Crossplane makes of the XRD (api/apis): the platform's fields plus Crossplane's own (spec.crossplane, status.conditions), so it is what the API server validates: the schema, its defaults and the rules listed under each field.
      title: Project (platform.cndev.nl/v1alpha1)
      version: v1alpha1
    openapi: 3.0.3
    paths:
      /apis/platform.cndev.nl/v1alpha1/projects:
        get:
          operationId: listProject
          responses:
            "200":
              content:
                application/json:
                  schema:
                    properties:
                      items:
                        items:
                          $ref: '#/components/schemas/Project'
                        type: array
                    type: object
              description: OK
            "401":
              description: Not authenticated
            "403":
              description: Not allowed (RBAC), or refused by an admission policy
            "404":
              description: Not found
            "422":
              description: 'Invalid: the schema or one of its rules rejects it'
          summary: List projects
          tags:
            - Project
        parameters: []
        post:
          operationId: createProject
          parameters:
            - description: 'All: validate (schema, rules, admission policies) without persisting'
              in: query
