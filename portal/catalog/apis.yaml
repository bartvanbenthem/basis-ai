                      message:
                        description: Human-readable detail
                        type: string
                      observedGeneration:
                        format: int64
                        type: integer
                      reason:
                        description: Machine-readable reason, e.g. Available, ReconcileSuccess
                        type: string
                      status:
                        enum:
