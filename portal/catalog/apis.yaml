            required: true
          responses:
            "201":
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/GenAIStack'
              description: Created
            "401":
              description: Not authenticated
            "403":
              description: Not allowed (RBAC), or refused by an admission policy
            "404":
