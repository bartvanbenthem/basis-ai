app:
  # Should be the same as backend.baseUrl when using the `app-backend` plugin.
  baseUrl: http://localhost:7007

backend:
  # Note that the baseUrl should be the URL that the browser and other clients
  # should use when communicating with the backend, i.e. it needs to be
  # reachable not just from within the backend host, but from all of your
  # callers. When its value is "http://localhost:7007", it's strictly private
  # and can't be reached by others.
  baseUrl: http://localhost:7007
  # The listener can also be expressed as a single <host>:<port> string. In this case we bind to
  # all interfaces, the most permissive setting. The right value depends on your specific deployment.
  listen: ':7007'

  # config options: https://node-postgres.com/apis/client
  database:
    client: pg
    # One database, one schema per plugin: the CNPG app role (deploy/database.yaml)
    # owns its database but may not create new ones.
    pluginDivisionMode: schema
    connection:
      database: ${POSTGRES_DB}
      host: ${POSTGRES_HOST}
      port: ${POSTGRES_PORT}
      user: ${POSTGRES_USER}
      password: ${POSTGRES_PASSWORD}
      # https://node-postgres.com/features/ssl
      # you can set the sslmode configuration option via the `PGSSLMODE` environment variable
      # see https://www.postgresql.org/docs/current/libpq-ssl.html Table 33.1. SSL Mode Descriptions (e.g. require)
      # ssl:
      #   ca: # if you have a CA file and want to verify it you can uncomment this section
      #     $file: <file-path>/ca/server.crt

auth:
  providers:
    guest: {}

catalog:
  # Overrides the default list locations from app-config.yaml as these contain example data.
  # See https://backstage.io/docs/features/software-catalog/#adding-components-to-the-catalog for more details
  # on how to get entities into the catalog.
  locations:
    # Local example data, replace this with your production config, these are intended for demo use only.
    # File locations are relative to the backend process, typically in a deployed context, such as in a Docker container, this will be the root
    - type: file
      target: ./examples/entities.yaml

    # Software Template: provision a PostgresCluster
    - type: file
      target: ./templates/postgres-cluster/template.yaml
      rules:
        - allow: [Template]

    # Software Template: create a Project (namespace + Prometheus + Grafana)
    - type: file
      target: ./templates/project/template.yaml
      rules:
        - allow: [Template]

    # Software Template: provision a ValkeyCache (exact or semantic cache)
    - type: file
      target: ./templates/valkey-cache/template.yaml
      rules:
        - allow: [Template]

    # Software Template: provision a GenAIStack (retrieval, cache, gateway, wiring)
    - type: file
      target: ./templates/genai-stack/template.yaml
      rules:
        - allow: [Template]

    # Software Template: provision a ModelGateway (shared gateway to a project's models)
    - type: file
      target: ./templates/model-gateway/template.yaml
      rules:
        - allow: [Template]

    # Local example organizational data
    - type: file
      target: ./catalog/catalog-info.yaml
      rules:
        - allow: [System]
    - type: file
      target: ./catalog/apis.yaml
      rules:
        - allow: [API]
    - type: file
      target: ./examples/org.yaml
      rules:
        - allow: [User, Group]

# In the cluster the backend authenticates with its ServiceAccount (see
# ../deploy/), so no kubeconfig/context is configured here.
basis:
  grafanaUrl: ${BASIS_GRAFANA_URL}
  catalog:
    defaultOwner: group:default/guests

# The docs are built in the backend container (MkDocs is in the image, see
# packages/backend/Dockerfile): there is no Docker daemon to run them in.
# app-config.yaml does the same; this keeps production explicit.
techdocs:
  builder: 'local'
  generator:
    runIn: 'local'
  publisher:
    type: 'local'
