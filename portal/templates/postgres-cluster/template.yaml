apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: postgres-cluster
  title: PostgreSQL cluster (CloudNativePG)
  description: >-
    Provision a production-ready PostgreSQL cluster on CloudNativePG through the
    postgres.cndev.nl PostgresCluster API: HA instances, optional PgBouncer and S3
    backups, Prometheus metrics, alerts and a Grafana dashboard.
  tags: [postgresql, cnpg, database]
spec:
  owner: group:default/guests
  type: resource

  parameters:
    - title: Cluster
      required: [name, project, owner]
      properties:
        name:
          title: Name
          type: string
          description: Lowercase letters, digits and "-", max 40 characters.
          pattern: '^[a-z]([-a-z0-9]{0,38}[a-z0-9])?$'
          ui:autofocus: true
        project:
          title: Project
          type: string
          description: >-
            The project the cluster lives in; its Prometheus and Grafana pick up
            the cluster's metrics, alerts and dashboard. Create one with the Project template.
          ui:field: EntityPicker
          ui:options:
            allowArbitraryValues: false
            defaultKind: Resource
            catalogFilter:
              kind: Resource
              spec.type: project
        owner:
          title: Owner
          type: string
          description: Group that owns this database.
          ui:field: OwnerPicker
          ui:options:
            catalogFilter:
              kind: Group
        system:
          title: System
          type: string
          description: Optional system this database belongs to.
          ui:field: EntityPicker
          ui:options:
            catalogFilter:
              kind: System
        postgresVersion:
          title: PostgreSQL version
          type: integer
          enum: [18, 17, 16, 15, 14]
          default: 17
        instances:
          title: Instances
          type: integer
          description: 1 primary + hot standbys. Use 3 for production.
          minimum: 1
          maximum: 9
          default: 3

    - title: Sizing
      properties:
        # The names in the postgres-sizes catalog
        # (api/apis/postgrescluster/sizes.yaml); keep them in step with it. The
        # API refuses a size the catalog doesn't have.
        size:
          title: Size
          type: string
          description: >-
            CPU and memory per instance, with PostgreSQL settings tuned to them.
            Changing it later restarts the instances one by one.
          enum: [xs, s, m, l, xl, custom]
          enumNames:
            - XS — 0.5 vCPU, 1Gi memory (development)
            - S — 1 vCPU, 4Gi memory
            - M — 2 vCPU, 8Gi memory
            - L — 4 vCPU, 16Gi memory
            - XL — 8 vCPU, 32Gi memory
            - Custom CPU and memory
          default: s
        storageSize:
          title: Data volume size
          type: string
          description: Can grow later, not shrink.
          default: 20Gi
          pattern: '^[0-9]+(Mi|Gi|Ti)$'
        databaseName:
          title: Database / owner role
          type: string
          default: app
          pattern: '^[a-z_][a-z0-9_]*$'
      dependencies:
        size:
          oneOf:
            - properties:
                size:
                  enum: [xs, s, m, l, xl]
            - properties:
                size:
                  const: custom
                cpu:
                  title: CPU request
                  type: string
                  default: 500m
                  pattern: '^([0-9]+m|[0-9]+(\.[0-9]+)?)$'
                memory:
                  title: Memory (request = limit)
                  type: string
                  default: 1Gi
                  pattern: '^[0-9]+(Mi|Gi|Ti)$'
              required: [cpu, memory]

    - title: Features
      properties:
        pooler:
          title: PgBouncer connection pooler
          type: boolean
          default: false
        monitoring:
          title: Prometheus metrics, alerts and Grafana dashboard
          type: boolean
          default: true
        backup:
          title: S3 backups (Barman Cloud)
          type: boolean
          default: false
        geoReplication:
          title: Geo replication
          type: boolean
          description: >-
            A replica cluster in the project's recovery location, ready to take over.
            Needs S3 backups and a project with a recovery location.
          default: false
      dependencies:
        backup:
          oneOf:
            - properties:
                backup:
                  const: false
            - properties:
                backup:
                  const: true
                backupDestinationPath:
                  title: Destination
                  type: string
                  description: >-
                    e.g. s3://my-bucket/postgres. Leave it and the credentials empty to use the
                    project's backup bucket (COSI), which geo replication across both sites needs.
                  pattern: '^s3://.+'
                backupEndpointURL:
                  title: Endpoint URL
                  type: string
                  description: Leave empty for AWS S3.
                backupSecretName:
                  title: Credentials Secret
                  type: string
                  description: Secret with ACCESS_KEY_ID and ACCESS_SECRET_KEY in the project (with a destination of your own).

  steps:
    - id: create
      name: Create PostgresCluster
      action: basis:postgrescluster:create
      input:
        name: ${{ parameters.name }}
        # A project entity ref (resource:default/<project>); the action uses
        # the project name as the namespace.
        namespace: ${{ parameters.project }}
        owner: ${{ parameters.owner }}
        system: ${{ parameters.system }}
        spec:
          postgresVersion: ${{ parameters.postgresVersion }}
          instances: ${{ parameters.instances }}
          storage:
            size: ${{ parameters.storageSize }}
          # A size or custom resources, never both (the API allows one); the
          # action prunes the empty side.
          size: ${{ parameters.size if parameters.size != 'custom' }}
          resources:
            requests:
              cpu: ${{ parameters.cpu if parameters.size == 'custom' }}
              memory: ${{ parameters.memory if parameters.size == 'custom' }}
            limits:
              memory: ${{ parameters.memory if parameters.size == 'custom' }}
          database:
            name: ${{ parameters.databaseName }}
            owner: ${{ parameters.databaseName }}
          pooler:
            enabled: ${{ parameters.pooler }}
          monitoring:
            enabled: ${{ parameters.monitoring }}
            grafanaDashboard:
              enabled: ${{ parameters.monitoring }}
          # Empty optional values are pruned by the action, so a disabled
          # backup section reaches the API as just {enabled: false}.
          geoReplication:
            enabled: ${{ parameters.geoReplication }}
          backup:
            enabled: ${{ parameters.backup }}
            destinationPath: ${{ parameters.backupDestinationPath }}
            endpointURL: ${{ parameters.backupEndpointURL }}
            s3Credentials:
              secretName: ${{ parameters.backupSecretName }}

  output:
    links:
      - title: Open in the PostgreSQL portal
        url: ${{ steps['create'].output.portalPath }}
      - title: Catalog entity (appears within ~30s)
        icon: catalog
        entityRef: ${{ steps['create'].output.entityRef }}
    text:
      - title: Connecting
        content: |
          Applications in the cluster connect to
          `${{ parameters.name }}-rw.${{ steps['create'].output.namespace }}.svc:5432`
          with the credentials in Secret `${{ steps['create'].output.namespace }}/${{ parameters.name }}-app`
          (key `uri` holds a full connection string).
