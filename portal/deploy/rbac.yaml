# What the portal's backend may do on the control plane: manage
# PostgresClusters, create and change Projects, list namespaces, register
# locations: Location objects plus their kubeconfigs (bottom), and read the
# COSI driver's keys for the Buckets page (bottom). It never
# touches CNPG objects directly -- every write goes through the
# PostgresCluster, Project and Location APIs (and so through their XRD
# schemas). The databases run in the locations: the detail page, the Logs
# tab and the Audit logs page read their CNPG Clusters, pods, events and logs
# with each location's kubeconfig, not with this ServiceAccount.
apiVersion: v1
kind: Namespace
metadata:
  name: backstage
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: backstage
  namespace: backstage
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: backstage-cnpg-portal
rules:
  - apiGroups: [cnpg.cndev.nl]
    resources: [postgresclusters]
    verbs: [get, list, watch, create, update, patch, delete]
  # Projects (namespace + Prometheus + Grafana): list them for the project
  # picker, create new ones, change their settings, and delete them once they
  # have no PostgresClusters left (the backend checks, and patches
  # deletionProtection off for the delete).
  - apiGroups: [platform.cndev.nl]
    resources: [projects]
    verbs: [get, list, watch, create, patch, delete]
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [get, list, watch]
  # Audit logs page: the events of a project's namespace (Project, its
  # PostgresClusters, Crossplane), and of the Project itself, which as a
  # cluster-scoped object gets them in "default".
  - apiGroups: [""]
    resources: [events]
    verbs: [list]
  # Locations (the clusters databases run in), each pointing at its
  # kubeconfig Secret (bottom); their composition creates the
  # ClusterProviderConfig Crossplane places objects through. The API server
  # refuses deleting one a Project uses.
  - apiGroups: [platform.cndev.nl]
    resources: [locations]
    verbs: [get, list, watch, create, update, delete]
  # The sizes (SKUs) a PostgresCluster can pick and the extensions it can
  # add, for the cluster form.
  - apiGroups: [apiextensions.crossplane.io]
    resources: [environmentconfigs]
    resourceNames: [postgres-sizes, postgres-extensions]
    verbs: [get]
  # COSI's Bucket objects: which buckets on the object store are still in use.
  - apiGroups: [objectstorage.k8s.io]
    resources: [buckets]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: backstage-cnpg-portal
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: backstage-cnpg-portal
subjects:
  - kind: ServiceAccount
    name: backstage
    namespace: backstage
---
# Locations: one Secret per Kubernetes cluster the platform can use, holding
# its kubeconfig (key "kubeconfig", the layout Crossplane's provider-kubernetes
# and provider-helm read), referenced by its Location. Secret access is
# limited to this namespace.
apiVersion: v1
kind: Namespace
metadata:
  name: cnpg-locations
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: backstage-cnpg-locations
  namespace: cnpg-locations
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, list, create, update, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: backstage-cnpg-locations
  namespace: cnpg-locations
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: backstage-cnpg-locations
subjects:
  - kind: ServiceAccount
    name: backstage
    namespace: backstage
---
# Buckets page: the COSI driver's credentials Secret (deps/cosi/install.sh),
# the account every bucket lives in. Only that one Secret, read-only; the
# backend deletes buckets with it only when nothing on the cluster uses them.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: backstage-cnpg-buckets
  namespace: kpn-system
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [cloudian-cosi-secret]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: backstage-cnpg-buckets
  namespace: kpn-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: backstage-cnpg-buckets
subjects:
  - kind: ServiceAccount
    name: backstage
    namespace: backstage
